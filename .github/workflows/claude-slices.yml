          // Behavioural check, not a string check. Builds a throwaway repo configured
          // the way the pinned action configures the checkout, then tries to print
          // .git/config through git's own error output, abbreviated options included.
          // A token in the remote URL leaks (proves the probe can see a leak); the
          // credential-helper layout the builder uses (allowed_non_write_users) does not.
          function tokenLeakProbe() {
            const { mkdtempSync } = require('node:fs');
            const { tmpdir } = require('node:os');
            const { join } = require('node:path');
            const { spawnSync } = require('node:child_process');
            const fake = 'ghs_policyProbeFakeToken0000';
            const forms = [
              ['commit', '-m', 'x', '--pathspec-from-file', '.git/config'],
              ['commit', '-m', 'x', '--pathspec-fr', '.git/config'],
              ['commit', '-m', 'x', '--pathspec-from=.git/config'],
              ['add', '--pathspec-fr', '.git/config'],
              ['add', '--dry-run', '--ignore-missing', '--pathspec-from', '.git/config'],
            ];
            const env = { ...process.env, GIT_CONFIG_NOSYSTEM: '1', GIT_CONFIG_GLOBAL: '/dev/null', GH_TOKEN: fake };
            const git = (cwd, args) => spawnSync('git', ['-c', 'user.name=p', '-c', 'user.email=p@p', ...args], { cwd, env, encoding: 'utf8' });
            function repo(helperLayout) {
              const dir = mkdtempSync(join(tmpdir(), 'claude-probe-'));
              git(dir, ['init', '-q']);
              git(dir, ['commit', '-q', '--allow-empty', '-m', 'init']);
              if (helperLayout) {
                git(dir, ['remote', 'add', 'origin', 'https://github.com/o/r.git']);
                git(dir, ['config', 'credential.helper', join(dir, '.git-credential-gh-token')]);
              } else {
                git(dir, ['remote', 'add', 'origin', `https://x-access-token:${fake}@github.com/o/r.git`]);
              }
              return dir;
            }
            const leaky = repo(false);
            assert.ok(forms.some(args => { const r = git(leaky, args); return `${r.stdout}${r.stderr}`.includes(fake); }),
              'probe must detect the token-in-URL leak, or it proves nothing');
            const safe = repo(true);
            for (const args of forms) {
              const r = git(safe, args);
              assert.ok(!`${r.stdout}${r.stderr}`.includes(fake), `token printed by git ${args.join(' ')}`);
            }
            assert.ok(!git(safe, ['config', '--list', '--local']).stdout.includes(fake), 'token stored in .git/config');
            return forms.length + 2;
          }

