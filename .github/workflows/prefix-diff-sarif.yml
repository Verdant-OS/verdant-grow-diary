name: Prefix Diff — SARIF upload

# Trust lanes:
#   - Pull requests run only offline file/manifest checks.
#   - Sandbox DB verification runs only from the trusted base branch through
#     the verdant-sandbox environment.
#   - Production DB verification is manual-only from the trusted base branch
#     through the verdant-production environment.
#
# Prereqs (Repo Settings):
#   - Settings → Code security → Code scanning: enabled (default setup off).
#   - Environment secret SUPABASE_DB_URL_SANDBOX in verdant-sandbox.
#   - Environment secret SUPABASE_DB_URL in verdant-production.

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "scripts/assert-no-unreviewed-money-migrations.mjs"
      - "scripts/assert-required-money-migrations.mjs"
      - "scripts/diff-money-migration-prefixes.mjs"
      - "scripts/lib/moneyDatabaseTargetIdentity.mjs"
      - "scripts/lib/supabaseDatabaseTargetIdentity.mjs"
      - "scripts/required-money-migrations.mjs"
      - "scripts/validate-sarif.mjs"
      - "src/test/money-database-target-identity.test.ts"
      - "src/test/required-money-migrations-workflow-trust-boundary.test.ts"
      - ".github/workflows/prefix-diff-sarif.yml"
  push:
    branches: [verdant-grow-diary]
    paths:
      - "supabase/migrations/**"
      - "scripts/assert-no-unreviewed-money-migrations.mjs"
      - "scripts/assert-required-money-migrations.mjs"
      - "scripts/diff-money-migration-prefixes.mjs"
      - "scripts/lib/moneyDatabaseTargetIdentity.mjs"
      - "scripts/lib/supabaseDatabaseTargetIdentity.mjs"
      - "scripts/required-money-migrations.mjs"
      - "scripts/validate-sarif.mjs"
      - "src/test/money-database-target-identity.test.ts"
      - "src/test/required-money-migrations-workflow-trust-boundary.test.ts"
      - ".github/workflows/prefix-diff-sarif.yml"
  workflow_dispatch:
    inputs:
      target_env:
        description: "Protected target environment"
        required: true
        default: "sandbox"
        type: choice
        options:
          - sandbox
          - live

permissions:
  contents: read

concurrency:
  group: prefix-diff-sarif-${{ github.ref }}-${{ inputs.target_env || github.event_name }}
  cancel-in-progress: true

jobs:
  prefix-diff-offline:
    name: Offline money-migration manifest + SARIF validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    env:
      EXPECTED_JSON_PATH: artifacts/prefix-diff-expected.json
      SARIF_PATH: artifacts/prefix-diff-expected.sarif
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Prepare artifacts dir
        run: mkdir -p artifacts

      - name: Assert required migration files
        run: node scripts/assert-required-money-migrations.mjs

      - name: Assert no unreviewed money-adjacent migrations
        run: node scripts/assert-no-unreviewed-money-migrations.mjs

      - name: Export expected prefixes without a DB connection
        run: |
          node scripts/diff-money-migration-prefixes.mjs \
            --expected --json > "${EXPECTED_JSON_PATH}"

      - name: Build offline manifest SARIF
        id: expected-sarif
        shell: bash
        run: |
          set +e
          node scripts/diff-money-migration-prefixes.mjs \
            --expected --sarif --sarif-out="${SARIF_PATH}"
          status=$?
          echo "exit=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Validate offline SARIF structure
        run: node scripts/validate-sarif.mjs "${SARIF_PATH}"

      - name: Upload offline SARIF to Code Scanning
        if: hashFiles(env.SARIF_PATH) != ''
        uses: github/codeql-action/upload-sarif@4187e74d05793876e9989daffde9c3e66b4acd07 # v3
        with:
          sarif_file: ${{ env.SARIF_PATH }}
          category: prefix-diff-expected

      - name: Archive offline manifest evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: prefix-diff-offline
          path: |
            ${{ env.SARIF_PATH }}
            ${{ env.EXPECTED_JSON_PATH }}
          if-no-files-found: warn
          retention-days: 14

      - name: Fail on malformed manifest
        if: steps.expected-sarif.outputs.exit != '0'
        run: |
          echo "::error::Offline money-migration manifest validation failed — see Code Scanning and the workflow artifact."
          exit 1

  prefix-diff-sandbox:
    name: Prefix diff against SANDBOX
    needs: prefix-diff-offline
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/verdant-grow-diary') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/verdant-grow-diary' && inputs.target_env == 'sandbox') }}
    environment: verdant-sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    env:
      DATABASE_URL: ""
      DIFF_JSON_PATH: artifacts/prefix-diff-sandbox.json
      PGDATABASE: ""
      PGHOST: ""
      PGPASSWORD: ""
      PGPORT: ""
      PGSERVICE: ""
      PGSERVICEFILE: ""
      PGUSER: ""
      SARIF_PATH: artifacts/prefix-diff-sandbox.sarif
      TARGET_ENV: sandbox
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Preflight — SUPABASE_DB_URL_SANDBOX configured
        uses: ./.github/actions/require-ci-secret
        with:
          secret-name: SUPABASE_DB_URL_SANDBOX
          secret-value: ${{ secrets.SUPABASE_DB_URL_SANDBOX }}
          guard-heading: "Money-migration prefix diff — SANDBOX"
          fix-steps-json: >-
            ["1. Open **Settings → Environments → verdant-sandbox** in this repository.",
             "2. Add the `SUPABASE_DB_URL_SANDBOX` environment secret.",
             "3. Re-run this workflow from `verdant-grow-diary`."]

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Prepare artifacts dir
        run: mkdir -p artifacts

      - name: Run sandbox prefix diff (JSON)
        id: diff-json
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL_SANDBOX }}
        shell: bash
        run: |
          set +e
          node scripts/diff-money-migration-prefixes.mjs \
            --json > "${DIFF_JSON_PATH}"
          status=$?
          echo "exit=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run sandbox prefix diff (SARIF)
        id: diff-sarif
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL_SANDBOX }}
        shell: bash
        run: |
          set +e
          node scripts/diff-money-migration-prefixes.mjs \
            --sarif --sarif-out="${SARIF_PATH}"
          status=$?
          echo "exit=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Validate sandbox SARIF structure
        run: node scripts/validate-sarif.mjs "${SARIF_PATH}"

      - name: Upload sandbox SARIF to Code Scanning
        if: hashFiles(env.SARIF_PATH) != ''
        uses: github/codeql-action/upload-sarif@4187e74d05793876e9989daffde9c3e66b4acd07 # v3
        with:
          sarif_file: ${{ env.SARIF_PATH }}
          category: prefix-diff-sandbox

      - name: Archive sandbox SARIF + JSON
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: prefix-diff-sarif-sandbox
          path: |
            ${{ env.SARIF_PATH }}
            ${{ env.DIFF_JSON_PATH }}
          if-no-files-found: warn
          retention-days: 14

      - name: Fail on sandbox drift
        if: steps.diff-json.outputs.exit != '0' || steps.diff-sarif.outputs.exit != '0'
        run: |
          echo "::error::Sandbox prefix-diff failed (JSON=${{ steps.diff-json.outputs.exit }}, SARIF=${{ steps.diff-sarif.outputs.exit }}) — see Code Scanning and the workflow artifact."
          exit 1

  prefix-diff-live:
    name: Prefix diff against LIVE
    needs: prefix-diff-offline
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/verdant-grow-diary' && inputs.target_env == 'live' }}
    environment: verdant-production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    env:
      DATABASE_URL: ""
      DIFF_JSON_PATH: artifacts/prefix-diff-live.json
      PGDATABASE: ""
      PGHOST: ""
      PGPASSWORD: ""
      PGPORT: ""
      PGSERVICE: ""
      PGSERVICEFILE: ""
      PGUSER: ""
      SARIF_PATH: artifacts/prefix-diff-live.sarif
      TARGET_ENV: live
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Preflight — SUPABASE_DB_URL configured
        uses: ./.github/actions/require-ci-secret
        with:
          secret-name: SUPABASE_DB_URL
          secret-value: ${{ secrets.SUPABASE_DB_URL }}
          guard-heading: "Money-migration prefix diff — LIVE"
          fix-steps-json: >-
            ["1. Open **Settings → Environments → verdant-production** in this repository.",
             "2. Add the `SUPABASE_DB_URL` environment secret.",
             "3. Re-run this workflow manually from `verdant-grow-diary`."]

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Prepare artifacts dir
        run: mkdir -p artifacts

      - name: Run live prefix diff (JSON)
        id: diff-json
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        shell: bash
        run: |
          set +e
          node scripts/diff-money-migration-prefixes.mjs \
            --json > "${DIFF_JSON_PATH}"
          status=$?
          echo "exit=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run live prefix diff (SARIF)
        id: diff-sarif
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        shell: bash
        run: |
          set +e
          node scripts/diff-money-migration-prefixes.mjs \
            --sarif --sarif-out="${SARIF_PATH}"
          status=$?
          echo "exit=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Validate live SARIF structure
        run: node scripts/validate-sarif.mjs "${SARIF_PATH}"

      - name: Upload live SARIF to Code Scanning
        if: hashFiles(env.SARIF_PATH) != ''
        uses: github/codeql-action/upload-sarif@4187e74d05793876e9989daffde9c3e66b4acd07 # v3
        with:
          sarif_file: ${{ env.SARIF_PATH }}
          category: prefix-diff-live

      - name: Archive live SARIF + JSON
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: prefix-diff-sarif-live
          path: |
            ${{ env.SARIF_PATH }}
            ${{ env.DIFF_JSON_PATH }}
          if-no-files-found: warn
          retention-days: 14

      - name: Fail on live drift
        if: steps.diff-json.outputs.exit == '1' || steps.diff-sarif.outputs.exit == '1'
        run: |
          echo "::error::Live prefix-diff drift detected (JSON=${{ steps.diff-json.outputs.exit }}, SARIF=${{ steps.diff-sarif.outputs.exit }}) — required money migration not applied. Do NOT deploy. See Code Scanning and the workflow artifact."
          exit 1

      - name: Block on live tooling error
        if: steps.diff-json.outputs.exit == '2' || steps.diff-sarif.outputs.exit == '2'
        run: |
          echo "::warning::Live prefix-diff BLOCKED (JSON=${{ steps.diff-json.outputs.exit }}, SARIF=${{ steps.diff-sarif.outputs.exit }}) — DB identity or connection check failed; state is unknown. Correct SUPABASE_DB_URL in the verdant-production environment: use the Supavisor pooler URL (aws-0-*.pooler.supabase.com:5432/postgres) for the production project (knkwiiywfkbqznbxwqfh). See the workflow artifact for details."
