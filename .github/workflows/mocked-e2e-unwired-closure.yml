name: Mocked E2E closure (previously unrun specs)

# Fifteen credential-free Playwright specs that were committed, reviewed and
# merged, and that NO workflow executed. Audited 2026-08-29
# (docs/audits/test-coverage-audit-2026-08-29.md): 25 of 60 specs are named by
# no workflow. Each one reads as coverage in review and provides none, because
# nothing runs it.
#
# SAFETY:
#  - Every spec here stubs its own Supabase traffic with page.route(), or needs
#    no backend at all (/quick-log and /pricing are public routes). No real
#    Supabase auth, REST or edge-function endpoint is contacted.
#  - No accounts created, no emails sent, no grow data touched.
#  - No secrets, no elevated DB role, no fixture URLs. Nothing here reads an
#    E2E_* environment variable, which is the property that made these safe to
#    wire and the env-gated specs unsafe (see the exclusion note below).
#  - SAFE pull_request event only — never pull_request_target. No schedule.
#
# ALWAYS PASS AN EXPLICIT SPEC FILTER. The chromium-mocked project installs no
# global route mocks (playwright.config.ts sets only testIgnore), so an
# unfiltered run also selects authenticated and fixture specs and can reach real
# Supabase.
#
# founder-owner-prefs WAS excluded here as contention-sensitive: one focus
# assertion failed once under a forced --workers=2 run, then passed 3 times.
# Re-measured 2026-08-30 and now WIRED: 3 of 3 green at --workers=2 and 3 of 3
# green single-worker, i.e. 9 passes against that one historical failure. The
# config also makes the original scenario non-representative — playwright.config
# sets fullyParallel: false, and retries is 1 on CI, so a single-attempt flake is
# absorbed. Wired on measurement, not on the absence of a failure.
#
# NOT WIRED HERE, and why — none of these is skipped or quarantined, each is
# named so the gap stays visible:
#   quick-log-activation-handoff  1 of 3 tests fails deterministically (2/2
#     runs): the saved entry never becomes visible in the Timeline assertion at
#     :336. Credential-free, so this is a real signal, not an environment gap.
#   ui-overhaul-responsive  2 of 9 fail at 320px and 1440px on /daily-check
#     concealing intrinsic horizontal overflow. The other 7 pass.
#   pheno-comparison-reload  needs fonts.googleapis.com, which is unreachable
#     from the audit container. Whether it passes on a GitHub runner is
#     NOT_MEASURED, so it is left out rather than wired on a guess.
#   5 fixture-gated specs (evidence-tile-mismatch-smoke,
#     manual-sensor-snapshot-edit-smoke, quick-log-target-panel-smoke,
#     pheno-comparison-visual-regression, pheno-workspace-state-integrity)
#     test.skip unless an operator supplies a real page URL, then navigate it
#     unmocked. Wiring them here would record green skips that read as coverage.

on:
  pull_request:
    # Both PR targets ci.yml runs on, so a PR to main is not left with no result
    # from this lane (CodeRabbit, #1221 round 9).
    branches: [main, verdant-grow-diary]
    paths:
      - "e2e/**"
      - "src/**"
      - "playwright.config.ts"
      - "vite.config.ts"
      # The Vite preset's tsconfigPaths resolves the `@/*` alias from tsconfig.json, so a PR
      # changing only it can break every import the specs boot (CodeRabbit, #1221 round 13).
      - "tsconfig.json"
      # The webServer is `bunx vite` in dev mode, which reads the committed client
      # config from these two; a PR changing only them can stop every spec booting
      # or authenticating (Codex, #1221 round 9). .env.production is not loaded in dev.
      - ".env"
      - ".env.development"
      - "package.json"
      - "bun.lock"
      - "bun.lockb"
      - ".github/workflows/mocked-e2e-unwired-closure.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mocked-e2e-unwired-closure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # #1702 repairs and wires the Timeline date proof. Keep it on its own runner:
  # the first scenario must pass against a cold app without another spec warming
  # Vite, retrying a failure, or extending the existing assertion/test budgets.
  timeline-local-day:
    name: Timeline local-day date filter (mocked)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Install Chromium only (with deps)
        run: bunx playwright install chromium --with-deps

      - name: Typecheck the Timeline spec outside the src-only project config
        run: >-
          bunx tsc --noEmit --skipLibCheck --strict --target ES2022 --module ESNext
          --moduleResolution Bundler --types node e2e/timeline-local-day-date-filter.spec.ts

      - name: Run Timeline local-day and fixture boundaries from cold start
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: e2e/results/timeline-local-day.json
        run: >-
          bunx playwright test e2e/timeline-local-day-date-filter.spec.ts
          --project=chromium-mocked --workers=2 --retries=0 --reporter=list,html,json

      - name: Require all three scenarios with zero failures, skips or retries
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync('e2e/results/timeline-local-day.json', 'utf8'));
          const stats = report.stats ?? {};
          if (stats.expected !== 3 || stats.unexpected !== 0 || stats.flaky !== 0 ||
              stats.skipped !== 0 || !Array.isArray(report.errors) || report.errors.length !== 0) {
            throw new Error(`Timeline local-day proof incomplete: ${JSON.stringify(stats)}`);
          }
          const project = report.config?.projects?.find((entry) => entry.name === 'chromium-mocked');
          if (project?.retries !== 0) throw new Error('Timeline local-day proof must not retry');
          console.log('Timeline local-day proof: 3 PASS / 0 FAIL / 0 SKIP / 0 FLAKY');
          NODE

      - name: Upload Timeline local-day proof
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: timeline-local-day-proof
          path: |
            e2e/results/timeline-local-day.json
            playwright-report
            test-results
          retention-days: 14
          if-no-files-found: error

  mocked-e2e-closure:
    name: Mocked E2E closure (15 previously unrun specs)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('bun.lock', 'bun.lockb', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-chromium-

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Install Chromium only (with deps)
        run: bunx playwright install chromium --with-deps

      - name: Run the previously unrun mocked specs
        run: bun run e2e:mocked-closure

      - name: Upload Playwright report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mocked-e2e-closure-playwright-report
          path: playwright-report
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload Playwright test-results
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mocked-e2e-closure-test-results
          path: test-results
          retention-days: 14
          if-no-files-found: ignore
