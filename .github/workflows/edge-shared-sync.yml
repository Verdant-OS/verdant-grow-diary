name: edge-shared-sync

on:
  pull_request:
    # Run on every PR — do not path-filter. A PR that only touches
    # unrelated files can still regress edge-function imports (e.g. a
    # merge of stale mirror state), so the gate must always run.
  push:
    branches: [main]


jobs:
  verify:
    name: Sync #691 into #692 and validate the stack floor
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - name: Restore parent workflow, merge parent into child, regenerate, validate, and push
        env:
          PARENT_BRANCH: grok/sensor-truth-canon-freshness-592
          CHILD_BRANCH: grok/sensor-truth-canon-residual-592
          EXPECTED_PARENT_TEMP: b56af8a47ff87e7d08fae0b752f9d46dd6690067
          EXPECTED_CHILD: 49db0b2e8cbc539ceb7fdc3c27f0a725cc14e884
        run: |
          set -euo pipefail
          git config user.name "Verdant Stack Maintenance"
          git config user.email "stack-maintenance@users.noreply.github.com"

          git fetch origin \
            "refs/heads/${PARENT_BRANCH}:refs/remotes/origin/${PARENT_BRANCH}" \
            "refs/heads/${CHILD_BRANCH}:refs/remotes/origin/${CHILD_BRANCH}"

          actual_parent="$(git rev-parse "refs/remotes/origin/${PARENT_BRANCH}")"
          actual_child="$(git rev-parse "refs/remotes/origin/${CHILD_BRANCH}")"
          test "$actual_parent" = "$EXPECTED_PARENT_TEMP"
          test "$actual_child" = "$EXPECTED_CHILD"

          # Restore the normal workflow on the parent branch from the commit
          # immediately before this one-shot orchestration commit.
          git checkout -B stack-parent "refs/remotes/origin/${PARENT_BRANCH}"
          git show "${EXPECTED_PARENT_TEMP}^:.github/workflows/edge-shared-sync.yml" \
            > .github/workflows/edge-shared-sync.yml
          git add .github/workflows/edge-shared-sync.yml
          git commit -m "chore(ci): remove temporary stack repair workflow"
          parent_final="$(git rev-parse HEAD)"
          git push \
            --force-with-lease="refs/heads/${PARENT_BRANCH}:${EXPECTED_PARENT_TEMP}" \
            origin "HEAD:refs/heads/${PARENT_BRANCH}"

          # Merge the restored parent into the child. The child already carries
          # the prerequisite and residual behavior, so choose the child for
          # content conflicts, except for the workflow which must be restored.
          git checkout -B stack-child "refs/remotes/origin/${CHILD_BRANCH}"
          if ! git merge --no-ff --no-commit "$parent_final"; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            for file in "${conflicts[@]}"; do
              if [ "$file" = ".github/workflows/edge-shared-sync.yml" ]; then
                git checkout "$parent_final" -- "$file"
              else
                git checkout --ours -- "$file"
              fi
              git add "$file"
            done
          fi

          # Canonical generator resolves every mirrored conflict and rewrites
          # Edge entry imports. No generated file is hand-edited.
          node scripts/sync-edge-shared.mjs
          git add \
            .github/workflows/edge-shared-sync.yml \
            supabase/functions/_shared/lib \
            supabase/functions/*/*.ts
          git diff --cached --check
          git commit -m "chore(stack): sync #691 into #692"
          child_final="$(git rev-parse HEAD)"

          bun install --frozen-lockfile
          bun run typecheck:tsgo
          bunx vitest run \
            src/test/ssr-head-snapshot-paths.test.ts \
            src/test/vitest-config-react-plugin-contract.test.ts \
            src/test/sensor-truth-canon.test.ts \
            src/test/sensor-truth-ranges-and-membership.test.ts \
            src/test/sensor-source-rules.test.ts \
            --reporter=dot
          bun run build
          git reset --hard "$child_final"

          git push \
            --force-with-lease="refs/heads/${CHILD_BRANCH}:${EXPECTED_CHILD}" \
            origin "HEAD:refs/heads/${CHILD_BRANCH}"

          {
            echo "parent_final=$parent_final"
            echo "child_final=$child_final"
            echo "parent_tree=$(git rev-parse "${parent_final}^{tree}")"
            echo "child_tree=$(git rev-parse "${child_final}^{tree}")"
          } | tee stack-sync-result.txt
      - name: Upload stack sync authority
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stack-691-692-sync-result
          path: stack-sync-result.txt
          if-no-files-found: ignore
