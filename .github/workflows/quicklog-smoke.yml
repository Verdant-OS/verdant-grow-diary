name: Quick Log Playwright smoke

# Authenticated Quick Log Playwright smoke harness.
#
# SAFETY:
#  - No auth bypass.
#  - No hardcoded credentials in the workflow.
#  - No elevated DB role usage.
#  - No checked-in storageState; the setup project signs in via the real /auth UI
#    using repository secrets, or skips with a clear message.
#  - Uploads Playwright report + smoke JSON/text report as artifacts on every run.
#  - Never uses the elevated PR target event — only the safe pull_request event.
#
# Triggers:
#  - workflow_dispatch: manual run; fails fast if required secrets/URL are missing.
#  - push to verdant-grow-diary: best-effort; skips cleanly if secrets are unavailable.
#  - pull_request to verdant-grow-diary: best-effort; PRs without access to E2E vars/secrets
#    (e.g. forked PRs) skip cleanly with a clear non-secret message and the job
#    completes successfully.
#
# Required repository secrets / vars (configure in GitHub → Settings):
#   secrets.E2E_TEST_EMAIL
#   secrets.E2E_TEST_PASSWORD
#   vars.E2E_BASE_URL              (e.g. https://<preview-or-staging>.example)
#   vars.E2E_GROW_1_PLANT_URL      (full URL of a Grow #1 plant page)
#   vars.E2E_GROW_1_SECOND_PLANT_NAME (optional; defaults to "E2E Test Plant 2")
#
# PR-comment controls (workflow_dispatch only; push/pull_request use the
# defaults below):
#   pr_comment_min_failed  Minimum hard-failure count to post at all. Default 1.
#   pr_comment_disabled    "true" fully suppresses the PR comment for this run,
#                          unconditionally — even with hard failures. Overrides
#                          pr_comment_min_failed. Default "false".
#   pr_comment_mode        "sticky" (default) updates the same comment across
#                          runs; "new-per-run" posts a fresh comment every run.
#   pr_number              Required alongside the three inputs above for a
#                          workflow_dispatch run: a plain manual dispatch has
#                          no pull_request event context, so PR-comment steps
#                          only run on workflow_dispatch when this is set (or
#                          on a real pull_request event, where it's inferred
#                          automatically). Leave blank to just run the smoke
#                          suite with no PR-comment behavior at all.
#
# Each failed/flaky test also gets its own dedicated artifact (uploaded via
# scripts/upload-per-test-artifacts.mjs) in addition to the shared
# quicklog-playwright-traces/-media bundles, so the PR comment can link
# directly to just that test's evidence. Per-test upload failures are
# warnings only and never fail the job.

on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: "Choose the ordinary Quick Log smoke or the guarded authenticated One-Tent proof."
        required: true
        default: "quicklog_smoke"
        type: choice
        options: ["quicklog_smoke", "one_tent_proof"]
      expected_sha:
        description: "Proof mode only: lowercase 40-hex commit deployed publicly and selected by the guarded proof branch."
        required: false
        default: ""
        type: string
      playwright_retries:
        description: "Playwright retry count per test (default 1 in CI). Increase to 2 or 3 for deeper flake triage."
        required: false
        default: "1"
      pr_comment_min_failed:
        description: "Minimum hard-failure count required to post the PR comment. 0 = always post; 1 = only when at least one test stays red after retries."
        required: false
        default: "1"
      pr_comment_disabled:
        description: "Fully disable PR comment posting for this run, unconditionally — even when there are hard failures. Overrides pr_comment_min_failed."
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      pr_comment_mode:
        description: "'sticky' updates the same PR comment across runs; 'new-per-run' posts a fresh comment every run instead."
        required: false
        default: "sticky"
        type: choice
        options: ["sticky", "new-per-run"]
      pr_number:
        description: "PR number to comment on for a manual workflow_dispatch run. Required for pr_comment_disabled/pr_comment_mode/pr_comment_min_failed to have any effect on a dispatched run — a plain workflow_dispatch has no pull_request event context to infer this from. Leave blank for a run that isn't about PR-comment behavior."
        required: false
        default: ""
      upload_html_report:
        description: "Upload the generated Playwright HTML report (playwright-report/) as the 'quicklog-playwright-report' artifact so failures can be browsed offline even when the flake summary is missing. Default true."
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]

  push:
    branches: [verdant-grow-diary]
    paths:
      - "e2e/**"
      - "playwright.config.ts"
      - ".github/workflows/quicklog-smoke.yml"
  pull_request:
    branches: [verdant-grow-diary]
    paths:
      - "e2e/**"
      - "playwright.config.ts"
      - ".github/workflows/quicklog-smoke.yml"

jobs:
  # Temporary, branch-pinned proof lane. This intentionally uses local immutable
  # harness code and existing end-user E2E credentials against the fixed, publicly
  # attested deployment. It has no elevated credentials, paid-model calls, or
  # control capability. A successful proof
  # owner-cleans active fixture rows and reports protected retained history.
  # Each first-attempt dispatch gets an isolated, validated fixture marker.
  one-tent-authenticated-proof:
    name: Authenticated One-Tent branch proof
    if: github.event_name == 'workflow_dispatch' && inputs.run_mode == 'one_tent_proof'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: one-tent-authenticated-proof
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      E2E_BASE_URL: "https://verdantgrowdiary.com"
      PLAYWRIGHT_RETRIES: "0"
      LOVABLE_E2E_TARGET_PROJECT_REF: knkwiiywfkbqznbxwqfh
      LOVABLE_E2E_TEARDOWN_AFTER_SUCCESS: "true"
      E2E_EXPECTED_SHA: "${{ inputs.expected_sha }}"
      E2E_ONE_TENT_FIXTURE_MARKER: "[GOLDEN-PATH-FIXTURE-RUN-${{ github.run_id }}-ATTEMPT-${{ github.run_attempt }}]"

    steps:
      - name: Verify immutable dispatch identity
        env:
          EXPECTED_SHA: "${{ inputs.expected_sha }}"
          GITHUB_CONTEXT_SHA: "${{ github.sha }}"
          GITHUB_ACTOR: "${{ github.actor }}"
          GITHUB_TRIGGERING_ACTOR: "${{ github.triggering_actor }}"
          GITHUB_RUN_ATTEMPT: "${{ github.run_attempt }}"
          GITHUB_REF: "${{ github.ref }}"
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [ "$EXPECTED_SHA" = "$GITHUB_CONTEXT_SHA" ]
          [ "$GITHUB_ACTOR" = "cheekhimself" ]
          [ "$GITHUB_TRIGGERING_ACTOR" = "cheekhimself" ]
          [ "$GITHUB_RUN_ATTEMPT" = "1" ]
          [ "$GITHUB_REF" = "refs/heads/verdant-grow-diary" ]

      - name: Checkout exact expected commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.expected_sha }}
          persist-credentials: false

      - name: Verify checked-out deployment identity
        env:
          EXPECTED_SHA: "${{ inputs.expected_sha }}"
          GITHUB_CONTEXT_SHA: "${{ github.sha }}"
        shell: bash
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$EXPECTED_SHA" ]
          [ "$EXPECTED_SHA" = "$GITHUB_CONTEXT_SHA" ]

      - name: Compute checked-out public tree identity
        shell: bash
        run: |
          set -euo pipefail
          [ -z "$(git status --porcelain)" ]
          node <<'NODE'
          const { appendFileSync } = require("node:fs");

          async function computeExpectedTreeIdentity() {
            const { computeTreeHash } = await import("./scripts/lib/tree-hash.mjs");
            const { treeHash } = await computeTreeHash(process.cwd());
            if (!/^[0-9a-f]{64}$/u.test(treeHash)) {
              throw new Error("checked_out_tree_hash_invalid");
            }
            appendFileSync(
              process.env.GITHUB_ENV,
              `E2E_EXPECTED_TREE_HASH=${treeHash}\n`,
              "utf8",
            );
          }

          computeExpectedTreeIdentity().catch(() => {
            console.error("checked_out_tree_identity=failed");
            process.exitCode = 1;
          });
          NODE
          [ -z "$(git status --porcelain)" ]

      - name: Verify public deployment identity
        env:
          EXPECTED_SHA: "${{ inputs.expected_sha }}"
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const https = require("node:https");
          const { readFileSync, statSync } = require("node:fs");

          const PUBLIC_ORIGIN = "https://verdantgrowdiary.com";
          const PUBLIC_VERSION_URL = "https://verdantgrowdiary.com/version.json";
          const PUBLIC_VERSION_TIMEOUT_MS = 5_000;
          const PUBLIC_VERSION_MAX_BYTES = 4_096;
          const PUBLIC_HTML_MAX_BYTES = 131_072;
          const PUBLIC_JAVASCRIPT_MAX_BYTES = 8_388_608;
          const PRODUCTION_ENV_MAX_BYTES = 65_536;
          const expectedSha = process.env.EXPECTED_SHA ?? "";

          function readBoundedProductionEnv() {
            const metadata = statSync(".env.production");
            if (!metadata.isFile() || metadata.size > PRODUCTION_ENV_MAX_BYTES) {
              throw new Error("canonical_paddle_env_invalid");
            }
            return readFileSync(".env.production", "utf8");
          }

          function fetchBoundedPublicAsset(url, kind, maxBytes, evaluateMetadata) {
            const parsedUrl = new URL(url);
            if (
              parsedUrl.origin !== PUBLIC_ORIGIN ||
              parsedUrl.protocol !== "https:" ||
              parsedUrl.username ||
              parsedUrl.password
            ) {
              return Promise.reject(new Error("public_asset_origin_invalid"));
            }
            return new Promise((resolve, reject) => {
              const request = https.get(
                parsedUrl,
                {
                  headers: {
                    accept: kind === "html" ? "text/html" : "application/javascript",
                    "accept-encoding": "identity",
                  },
                  signal: AbortSignal.timeout(PUBLIC_VERSION_TIMEOUT_MS),
                  timeout: PUBLIC_VERSION_TIMEOUT_MS,
                },
                async (response) => {
                  const metadata = evaluateMetadata({
                    statusCode: response.statusCode,
                    contentType: String(response.headers["content-type"] ?? ""),
                    contentEncoding: String(response.headers["content-encoding"] ?? "identity"),
                    contentLength: response.headers["content-length"],
                    maxBytes,
                    kind,
                  });
                  if (!metadata.ok) {
                    response.destroy();
                    reject(new Error(metadata.reason));
                    return;
                  }

                  const chunks = [];
                  let bytes = 0;
                  response.setTimeout(PUBLIC_VERSION_TIMEOUT_MS, () =>
                    response.destroy(new Error("response_timeout")),
                  );
                  response.on("data", (chunk) => {
                    bytes += chunk.length;
                    if (bytes > maxBytes) {
                      response.destroy(new Error("body_too_large"));
                      return;
                    }
                    chunks.push(chunk);
                  });
                  response.on("end", () => resolve(Buffer.concat(chunks).toString("utf8")));
                  response.on("error", () => reject(new Error("response_failed")));
                },
              );
              request.on("timeout", () => request.destroy(new Error("request_timeout")));
              request.on("error", () => reject(new Error("request_failed")));
            });
          }

          async function attestPublicVersion() {
            const {
              evaluateBoundedPublicAssetResponseMetadata,
              evaluatePublicDeploymentIdentity,
              evaluatePublicPaddleBundle,
              resolveCanonicalPaddleSandboxToken,
              resolvePublicMainModuleAsset,
            } = await import("./scripts/e2e/managed-session-materialize-core.mjs");
            const response = await new Promise((resolve, reject) => {
              const request = https.get(
                PUBLIC_VERSION_URL,
                {
                  headers: {
                    accept: "application/json",
                    "accept-encoding": "identity",
                  },
                  signal: AbortSignal.timeout(PUBLIC_VERSION_TIMEOUT_MS),
                  timeout: PUBLIC_VERSION_TIMEOUT_MS,
                },
                resolve,
              );
              request.on("timeout", () => request.destroy(new Error("request_timeout")));
              request.on("error", () => reject(new Error("request_failed")));
            });

            if (response.statusCode >= 300 && response.statusCode < 400) {
              response.destroy();
              throw new Error("redirect_rejected");
            }
            if (response.statusCode !== 200) {
              response.destroy();
              throw new Error("unexpected_status");
            }
            const contentType = String(response.headers["content-type"] ?? "").toLowerCase();
            if (!/^application\/json(?:;|$)/u.test(contentType)) {
              response.destroy();
              throw new Error("invalid_content_type");
            }
            const contentEncoding = String(response.headers["content-encoding"] ?? "identity");
            if (contentEncoding !== "identity") {
              response.destroy();
              throw new Error("unexpected_content_encoding");
            }
            const declaredLength = response.headers["content-length"];
            if (
              Array.isArray(declaredLength) ||
              (declaredLength !== undefined &&
                (!/^\d+$/u.test(declaredLength) || Number(declaredLength) > PUBLIC_VERSION_MAX_BYTES))
            ) {
              response.destroy();
              throw new Error("invalid_content_length");
            }

            const body = await new Promise((resolve, reject) => {
              const chunks = [];
              let bytes = 0;
              response.setTimeout(PUBLIC_VERSION_TIMEOUT_MS, () =>
                response.destroy(new Error("response_timeout")),
              );
              response.on("data", (chunk) => {
                bytes += chunk.length;
                if (bytes > PUBLIC_VERSION_MAX_BYTES) {
                  response.destroy(new Error("body_too_large"));
                  return;
                }
                chunks.push(chunk);
              });
              response.on("end", () => resolve(Buffer.concat(chunks).toString("utf8")));
              response.on("error", () => reject(new Error("response_failed")));
            });

            let parsed;
            try {
              parsed = JSON.parse(body);
            } catch {
              throw new Error("invalid_json");
            }
            const identity = evaluatePublicDeploymentIdentity({
              version: parsed,
              expectedSha,
              expectedTreeHash: process.env.E2E_EXPECTED_TREE_HASH,
            });
            if (!identity.ok) {
              throw new Error(identity.reason);
            }

            const canonicalToken = resolveCanonicalPaddleSandboxToken(
              readBoundedProductionEnv(),
            );
            if (!canonicalToken.ok) {
              throw new Error(canonicalToken.reason);
            }
            const html = await fetchBoundedPublicAsset(
              `${PUBLIC_ORIGIN}/`,
              "html",
              PUBLIC_HTML_MAX_BYTES,
              evaluateBoundedPublicAssetResponseMetadata,
            );
            const mainAsset = resolvePublicMainModuleAsset({ html, publicOrigin: PUBLIC_ORIGIN });
            if (!mainAsset.ok) {
              throw new Error(mainAsset.reason);
            }
            const bundle = await fetchBoundedPublicAsset(
              mainAsset.url,
              "javascript",
              PUBLIC_JAVASCRIPT_MAX_BYTES,
              evaluateBoundedPublicAssetResponseMetadata,
            );
            const paddle = evaluatePublicPaddleBundle({
              canonicalToken: canonicalToken.token,
              bundle,
            });
            if (!paddle.ok) {
              throw new Error(paddle.reason);
            }
          }

          attestPublicVersion()
            .then(() => console.log("public_version_attestation=verified"))
            .catch(() => {
              console.error("public_version_attestation=failed");
              process.exitCode = 1;
            });
          NODE

      - name: Verify exact Supabase target origin
        shell: bash
        run: |
          set -euo pipefail
          [ -f .env ] || { echo "Tracked public app configuration is missing" >&2; exit 1; }
          node --env-file=.env scripts/e2e/verify-one-tent-supabase-target.mjs

      - name: Verify E2E credentials are configured
        env:
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          [ -n "$E2E_TEST_EMAIL" ] || { echo "Missing secrets.E2E_TEST_EMAIL" >&2; exit 1; }
          [ -n "$E2E_TEST_PASSWORD" ] || { echo "Missing secrets.E2E_TEST_PASSWORD" >&2; exit 1; }

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: bunx playwright install chromium

      - name: Materialize authenticated managed session
        env:
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
        run: bun --env-file=.env run scripts/e2e/materialize-managed-session.mjs

      - name: Run and verify authenticated One-Tent proof
        env:
          # Non-secret sentinel keeps Playwright tracing disabled for a run
          # whose managed session carries bearer tokens. The real email and
          # password are scoped only to the two first-party steps above.
          E2E_TEST_EMAIL: "managed-session-trace-off"
        shell: bash
        run: |
          set -euo pipefail
          bun --env-file=.env --env-file=e2e/.auth/managed-session.env run e2e:one-tent:preflight
          mkdir -p e2e/results
          set +e
          bun --env-file=.env --env-file=e2e/.auth/managed-session.env run e2e:one-tent:ui > e2e/results/one-tent-authenticated-proof.log 2>&1
          playwright_exit="$?"
          set -e
          node scripts/e2e/verify-one-tent-browser-proof-log.mjs \
            --log e2e/results/one-tent-authenticated-proof.log \
            --playwright-exit "$playwright_exit"

      - name: Remove generated authentication state and proof artifacts
        if: always()
        shell: bash
        run: |
          rm -f -- \
            e2e/.auth/managed-session.env \
            e2e/.auth/user.json \
            e2e/.auth/session-storage.json \
            e2e/results/one-tent-authenticated-proof.log \
            e2e/results/playwright-report.json
          rm -rf -- test-results playwright-report

  quicklog-smoke:
    name: Quick Log Playwright smoke
    if: github.event_name != 'workflow_dispatch' || inputs.run_mode == 'quicklog_smoke'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Job scope: read code, post a sticky PR comment linking to Playwright
    # artifact bundles for failed/flaky tests. No other write scopes.
    permissions:
      contents: read
      pull-requests: write

    env:
      # Run-specific suffix appended to every upload-artifact `name:` so
      # multiple runs (re-runs, retries, dispatch-after-push) don't clash in
      # the Actions UI. Combines run_id (unique per workflow run) with
      # run_attempt (bumps on re-run) and a short commit SHA for at-a-glance
      # traceability from the Artifacts dropdown.
      ARTIFACT_SUFFIX: run-${{ github.run_id }}-attempt-${{ github.run_attempt }}-sha-${{ github.sha }}
      E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
      E2E_GROW_1_PLANT_URL: ${{ vars.E2E_GROW_1_PLANT_URL }}
      E2E_GROW_1_SECOND_PLANT_NAME: ${{ vars.E2E_GROW_1_SECOND_PLANT_NAME }}
      E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
      E2E_FIXTURE_MODE: ${{ vars.E2E_FIXTURE_MODE }}
      E2E_FIXTURE_EXPECTED_GROW_NAME: ${{ vars.E2E_FIXTURE_EXPECTED_GROW_NAME }}
      E2E_FIXTURE_EXPECTED_TENT_NAME: ${{ vars.E2E_FIXTURE_EXPECTED_TENT_NAME }}
      E2E_FIXTURE_EXPECTED_PLANT_NAME: ${{ vars.E2E_FIXTURE_EXPECTED_PLANT_NAME }}
      # Optional safe label (e.g. "E2E") used by the fixture validator if the
      # app visibly exposes account identity. NEVER a password or token.
      E2E_FIXTURE_EXPECTED_ACCOUNT_HINT: ${{ vars.E2E_FIXTURE_EXPECTED_ACCOUNT_HINT }}
      # Optional, off by default. Enables the UI-only fixture bootstrap step.
      E2E_ALLOW_FIXTURE_BOOTSTRAP: ${{ vars.E2E_ALLOW_FIXTURE_BOOTSTRAP }}
      # Playwright retry policy for flake triage. Defaults to 1 retry in CI
      # (playwright.config.ts). workflow_dispatch can override for deeper runs.
      PLAYWRIGHT_RETRIES: ${{ github.event_name == 'workflow_dispatch' && inputs.playwright_retries || '1' }}
      # PR-comment posting mode, read by the two "Post ... PR comment" steps'
      # own `if:` conditions below. push/pull_request always default to
      # 'sticky'; only workflow_dispatch can choose 'new-per-run'.
      PR_COMMENT_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_comment_mode || 'sticky' }}
      # Unconditional PR-comment kill switch, read by both the per-test
      # artifact upload step (skip the work entirely) and the comment-body
      # builder step (skip even when there are hard failures). Overrides
      # PR_COMMENT_MIN_FAILED. push/pull_request always default to 'false'.
      PR_COMMENT_DISABLED: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_comment_disabled || 'false' }}
      # The PR number to comment on: inferred automatically on a real
      # pull_request event, or from the pr_number input on workflow_dispatch.
      # Empty on push, and empty on workflow_dispatch when pr_number is unset.
      PR_NUMBER: ${{ github.event.pull_request.number || (github.event_name == 'workflow_dispatch' && inputs.pr_number || '') }}
      # Whether THIS run is in a context where a PR comment can be built and
      # posted at all — a real pull_request event, or workflow_dispatch with
      # an explicit pr_number. Without this, pr_comment_disabled/pr_comment_mode
      # would only ever be readable on workflow_dispatch, while the only
      # steps that build/post a comment were pull_request-only — two
      # mutually exclusive event types that could never both be true in one
      # run, making every pr_comment_* input permanently unreachable.
      PR_COMMENT_CONTEXT_OK: ${{ (github.event_name == 'pull_request') && 'true' || (github.event_name == 'workflow_dispatch' && inputs.pr_number != '' && 'true') || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Verify required configuration
        id: e2e_config
        shell: bash
        run: |
          # Track presence (never echo values). Only NAMES of missing config
          # are emitted — never the values of any var or secret.
          missing=()
          [ -n "$E2E_BASE_URL" ] || missing+=("vars.E2E_BASE_URL")
          [ -n "$E2E_GROW_1_PLANT_URL" ] || missing+=("vars.E2E_GROW_1_PLANT_URL")
          [ -n "$E2E_TEST_EMAIL" ] || missing+=("secrets.E2E_TEST_EMAIL")
          [ -n "$E2E_TEST_PASSWORD" ] || missing+=("secrets.E2E_TEST_PASSWORD")
          # Disposable E2E fixture safety: required before write-producing smoke.
          # Grow name is OPTIONAL — the current UI has no Grow page in the
          # setup flow (Dashboard → Add Tent → Add Plant).
          [ -n "$E2E_FIXTURE_MODE" ] || missing+=("vars.E2E_FIXTURE_MODE")
          [ -n "$E2E_FIXTURE_EXPECTED_TENT_NAME" ] || missing+=("vars.E2E_FIXTURE_EXPECTED_TENT_NAME")
          [ -n "$E2E_FIXTURE_EXPECTED_PLANT_NAME" ] || missing+=("vars.E2E_FIXTURE_EXPECTED_PLANT_NAME")

          event="${{ github.event_name }}"

          # Sanitized, comma-separated list of missing config NAMES.
          missing_csv=""
          if [ ${#missing[@]} -gt 0 ]; then
            missing_csv=$(IFS=, ; echo "${missing[*]}")
          fi
          echo "missing_config=${missing_csv}" >> "$GITHUB_OUTPUT"

          if [ ${#missing[@]} -gt 0 ]; then
            echo "Missing required Quick Log smoke configuration: ${missing[*]}"
            if [ "$event" = "workflow_dispatch" ]; then
              echo "Missing required Quick Log smoke configuration. Configure Actions vars/secrets." >&2
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              exit 1
            elif [ "$event" = "pull_request" ]; then
              echo "Skipping Quick Log smoke: E2E vars/secrets are unavailable for this PR context."
              echo "should_run=false" >> "$GITHUB_OUTPUT"
            else
              echo "Skipping Quick Log smoke: E2E vars/secrets are unavailable for this event."
              echo "should_run=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "Quick Log smoke configuration present. Proceeding."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Bun
        if: steps.e2e_config.outputs.should_run == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      # Best-effort cache for Bun's package cache. Never includes auth state,
      # storageState, smoke reports, traces, screenshots, videos, or secrets.
      - name: Cache Bun packages
        if: steps.e2e_config.outputs.should_run == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'bun.lockb', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      # Best-effort cache for Playwright browser binaries. Never includes auth
      # state, storageState, smoke reports, traces, screenshots, videos, or
      # secrets. `bun run e2e:install:ci` still runs below to verify Chromium
      # and OS deps after restore.
      - name: Cache Playwright browsers
        if: steps.e2e_config.outputs.should_run == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock', 'bun.lockb', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        if: steps.e2e_config.outputs.should_run == 'true'
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium (with OS deps)
        if: steps.e2e_config.outputs.should_run == 'true'
        run: bun run e2e:install:ci

      - name: Print disposable E2E fixture checklist
        if: steps.e2e_config.outputs.should_run == 'true'
        run: bun run e2e:fixture-checklist

      # Optional UI-only disposable E2E fixture bootstrap. OFF by default.
      # Only runs when vars.E2E_ALLOW_FIXTURE_BOOTSTRAP == 'true'.
      # Never deletes, renames, or modifies existing grow data. Refuses to
      # run against any account that does not look disposable. Bootstrap is
      # NOT required — fixture verification still runs and gates the smoke.
      - name: Bootstrap disposable E2E fixture
        id: bootstrap_fixture
        if: steps.e2e_config.outputs.should_run == 'true' && vars.E2E_ALLOW_FIXTURE_BOOTSTRAP == 'true'
        run: bun run e2e:bootstrap-fixture

      - name: Verify disposable E2E fixture
        id: verify_fixture
        if: steps.e2e_config.outputs.should_run == 'true'
        run: bun run e2e:verify-fixture

      - name: Run Quick Log Playwright smoke
        id: quicklog_smoke
        if: steps.e2e_config.outputs.should_run == 'true' && steps.verify_fixture.outcome == 'success'
        run: bun run e2e:quicklog-smoke

      - name: Verify Quick Log smoke artifacts
        if: always() && steps.e2e_config.outputs.should_run == 'true'
        shell: bash
        run: |
          # After a real smoke execution the JSON report + Playwright HTML
          # report must exist. If either is missing the run is not a usable
          # smoke result — fail the job so we never publish a green run that
          # produced no evidence. Never echoes secret values.
          status=0

          if [ -f "e2e/results/quicklog-smoke-report.json" ]; then
            echo "OK: e2e/results/quicklog-smoke-report.json present"
          else
            echo "MISSING (required): e2e/results/quicklog-smoke-report.json" >&2
            status=1
          fi

          if [ -d "playwright-report" ]; then
            echo "OK: playwright-report/ present"
          else
            echo "MISSING (required): playwright-report/ directory" >&2
            status=1
          fi

          if [ -f "e2e/results/quicklog-smoke-report.txt" ]; then
            echo "OK: e2e/results/quicklog-smoke-report.txt present"
          else
            echo "WARN: e2e/results/quicklog-smoke-report.txt missing (non-fatal)"
          fi

          if [ -d "test-results" ]; then
            echo "OK: test-results/ present"
          else
            echo "WARN: test-results/ missing (non-fatal; may be empty on full pass)"
          fi

          exit "$status"

      - name: Summarize failed step metadata in Job Summary
        if: failure()
        shell: bash
        env:
          BOOTSTRAP_FIXTURE_OUTCOME: ${{ steps.bootstrap_fixture.outcome }}
          VERIFY_FIXTURE_OUTCOME: ${{ steps.verify_fixture.outcome }}
          QUICKLOG_SMOKE_OUTCOME: ${{ steps.quicklog_smoke.outcome }}
        run: |
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          ATTEMPT_URL="${RUN_URL}/attempts/${GITHUB_RUN_ATTEMPT}"
          failed_step="untracked setup or post-smoke step"
          failed_outcome="failure"
          if [ "${BOOTSTRAP_FIXTURE_OUTCOME}" = "failure" ]; then
            failed_step="Bootstrap disposable E2E fixture"
            failed_outcome="${BOOTSTRAP_FIXTURE_OUTCOME}"
          elif [ "${VERIFY_FIXTURE_OUTCOME}" = "failure" ]; then
            failed_step="Verify disposable E2E fixture"
            failed_outcome="${VERIFY_FIXTURE_OUTCOME}"
          elif [ "${QUICKLOG_SMOKE_OUTCOME}" = "failure" ]; then
            failed_step="Run Quick Log Playwright smoke"
            failed_outcome="${QUICKLOG_SMOKE_OUTCOME}"
          fi
          {
            echo ""
            echo "## ❌ Quick Log smoke failed"
            echo ""
            echo "- Workflow: \`${GITHUB_WORKFLOW}\`"
            echo "- Run: [#${GITHUB_RUN_NUMBER} attempt ${GITHUB_RUN_ATTEMPT}](${ATTEMPT_URL})"
            echo "- Failed step: \`${failed_step}\`"
            echo "- Outcome: \`${failed_outcome}\`"
            echo ""
            echo "Open the [run-attempt logs](${ATTEMPT_URL}) for the masked command output. Raw logs, smoke-report contents, and Playwright DOM context are not copied into this summary or retained in a diagnostic artifact."
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Capture Quick Log smoke metadata
        id: smoke_meta
        if: always() && steps.e2e_config.outputs.should_run == 'true'
        shell: bash
        run: |
          # Best-effort capture of smoke counts + Playwright version for the
          # GitHub Actions step summary. Never echoes secret values. Failures
          # here must not mask the real Playwright failure: this step always
          # exits 0 and emits explicit "unavailable" sentinels when fields
          # cannot be determined. Distinguishes:
          #   report_parse_status=parsed  -> counts successfully extracted
          #   report_parse_status=missing -> report JSON not produced
          #   report_parse_status=failed  -> report JSON present but parsing failed
          set +e

          pw_version="$(bunx playwright --version 2>/dev/null | tr -d '\r' | head -n1)"
          if [ -z "${pw_version}" ]; then
            pw_version="unavailable"
          fi
          echo "playwright_version=${pw_version}" >> "$GITHUB_OUTPUT"

          report="e2e/results/quicklog-smoke-report.json"
          report_parse_error=""
          if [ -f "${report}" ]; then
            echo "report_json_present=true" >> "$GITHUB_OUTPUT"
            counts="$(node -e '
              try {
                const fs = require("fs");
                const r = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
                const pick = (...keys) => {
                  for (const k of keys) {
                    const v = k.split(".").reduce((o, p) => (o == null ? o : o[p]), r);
                    if (typeof v === "number") return v;
                  }
                  return null;
                };
                const steps = Array.isArray(r.steps) ? r.steps : (Array.isArray(r.results) ? r.results : null);
                let total = pick("total", "stats.total", "counts.total");
                let passed = pick("passed", "stats.passed", "counts.passed", "ok");
                let failed = pick("failed", "stats.failed", "counts.failed", "failures");
                let skipped = pick("skipped", "stats.skipped", "counts.skipped");
                if (steps) {
                  const norm = s => String(s ?? "").toLowerCase();
                  if (total == null) total = steps.length;
                  if (passed == null) passed = steps.filter(s => ["pass","passed","ok","success"].includes(norm(s.status ?? s.result))).length;
                  if (failed == null) failed = steps.filter(s => ["fail","failed","error"].includes(norm(s.status ?? s.result))).length;
                  if (skipped == null) skipped = steps.filter(s => ["skip","skipped"].includes(norm(s.status ?? s.result))).length;
                }
                const out = [total, passed, failed, skipped].map(v => (typeof v === "number" ? v : ""));
                process.stdout.write(out.join("|"));
              } catch (e) {
                process.stderr.write(String(e && e.message ? e.message : e).slice(0, 200));
                process.stdout.write("");
              }
            ' "${report}" 2> /tmp/smoke_meta_err.txt)"
            IFS='|' read -r smoke_total smoke_passed smoke_failed smoke_skipped <<< "${counts}"
            if [ -n "${smoke_total}${smoke_passed}${smoke_failed}${smoke_skipped}" ]; then
              echo "smoke_counts_available=true" >> "$GITHUB_OUTPUT"
              echo "report_parse_status=parsed" >> "$GITHUB_OUTPUT"
              echo "smoke_total=${smoke_total:-unknown}" >> "$GITHUB_OUTPUT"
              echo "smoke_passed=${smoke_passed:-unknown}" >> "$GITHUB_OUTPUT"
              echo "smoke_failed=${smoke_failed:-unknown}" >> "$GITHUB_OUTPUT"
              echo "smoke_skipped=${smoke_skipped:-unknown}" >> "$GITHUB_OUTPUT"
            else
              echo "smoke_counts_available=false" >> "$GITHUB_OUTPUT"
              echo "report_parse_status=failed" >> "$GITHUB_OUTPUT"
              if [ -s /tmp/smoke_meta_err.txt ]; then
                # Sanitize: single line, strip $ and backticks, cap length.
                report_parse_error="$(tr '\n' ' ' < /tmp/smoke_meta_err.txt | tr -d '`$' | head -c 200)"
              else
                report_parse_error="unable to extract counts from report JSON"
              fi
              echo "report_parse_error=${report_parse_error}" >> "$GITHUB_OUTPUT"
              echo "::warning::Quick Log smoke metadata parsing failed: ${report_parse_error}"
            fi
          else
            echo "report_json_present=false" >> "$GITHUB_OUTPUT"
            echo "smoke_counts_available=false" >> "$GITHUB_OUTPUT"
            echo "report_parse_status=missing" >> "$GITHUB_OUTPUT"
            echo "report_parse_error=" >> "$GITHUB_OUTPUT"
            echo "::warning::Quick Log smoke report JSON missing at ${report}"
          fi

          exit 0

      - name: Upload Playwright HTML report
        id: upload_playwright_report
        # Always uploaded on push/pull_request; on workflow_dispatch, honors the
        # upload_html_report input (default true). Kept independent of the flake
        # summary so failures can still be browsed offline via the standalone
        # HTML report even when playwright-flake-summary.md is missing.
        # Runs before any $GITHUB_STEP_SUMMARY writer so the link section
        # immediately below is the first thing reviewers see in the summary.
        if: >-
          always()
          && steps.e2e_config.outputs.should_run == 'true'
          && (github.event_name != 'workflow_dispatch' || inputs.upload_html_report != 'false')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quicklog-playwright-report-${{ env.ARTIFACT_SUFFIX }}
          path: playwright-report/
          retention-days: 30
          if-no-files-found: warn

      - name: Link Playwright HTML report in Job Summary
        if: always() && steps.e2e_config.outputs.should_run == 'true'
        shell: bash
        env:
          HTML_REPORT_URL: ${{ steps.upload_playwright_report.outputs.artifact-url }}
          UPLOAD_HTML_REPORT_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_html_report || 'true' }}
        run: |
          # First section written to $GITHUB_STEP_SUMMARY on purpose: moved
          # above the flake summarizer so the HTML report link is pinned at
          # the top of the run's Job Summary for immediate visibility.
          # FLAKE_SUMMARY_PRESENT is not yet known at this point in the run
          # (check_flake_summary hasn't executed), so the "primary source of
          # truth" note is omitted here; the later flake-summary section
          # remains the place where that relationship is spelled out.
          # Enrichment only — never fails the job.
          {
            echo "### 🧭 Playwright HTML report"
            echo ""
            if [ ! -d "playwright-report" ]; then
              echo "**Status:** ❌ \`playwright-report/\` directory not produced — Playwright likely did not run to completion. See earlier steps."
            elif [ "${UPLOAD_HTML_REPORT_INPUT}" = "false" ]; then
              echo "**Status:** ⏭️ Upload skipped for this run (\`upload_html_report=false\` on workflow_dispatch)."
              echo ""
              echo "Re-dispatch with \`upload_html_report=true\` (default) to publish the \`quicklog-playwright-report\` artifact."
            elif [ -n "${HTML_REPORT_URL}" ]; then
              echo "Browse failures offline via the standalone HTML report:"
              echo ""
              echo "- [\`quicklog-playwright-report\`](${HTML_REPORT_URL}) — unzip and open \`index.html\`"
            else
              echo "**Status:** _HTML report artifact URL unavailable — check the run's Artifacts dropdown for \`quicklog-playwright-report\`._"
            fi
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize Playwright flakes
        id: summarize_flakes
        if: always() && steps.e2e_config.outputs.should_run == 'true'
        shell: bash
        run: |
          # Parses e2e/results/playwright-report.json (Playwright JSON reporter)
          # and appends a flake summary to $GITHUB_STEP_SUMMARY. Flakes = tests
          # that failed on attempt 0 but passed on retry1. Retry counts and
          # artifact paths (trace/video/screenshot) are included per flake.
          # Never fails the job on presence of flakes — informational only.
          if [ ! -f "e2e/results/playwright-report.json" ]; then
            echo "::warning::Playwright JSON report not found; skipping flake summary."
            {
              echo ""
              echo "## Playwright flake summary"
              echo ""
              echo "_No Playwright JSON report was produced for this run — flake classification skipped._"
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
            echo "pw_counts_available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node scripts/summarize-playwright-flakes.mjs \
            --report=e2e/results/playwright-report.json \
            --out=e2e/results/playwright-flake-summary.md \
            2> >(tee /tmp/summarize_flakes_stderr.txt >&2) \
            || echo "::warning::flake summarizer exited non-zero (see logs)"

          # The script's own final stderr line is the single source of truth
          # for these counts (`total=N passed=N failed=N flaky=N skipped=N`).
          # Parsed here rather than re-derived from the JSON report so the
          # counts shown in the Job Summary's gate explanation can never
          # disagree with what actually decided whether the file is non-empty.
          counts_line="$(grep -oE 'total=[0-9]+ passed=[0-9]+ failed=[0-9]+ flaky=[0-9]+ skipped=[0-9]+' /tmp/summarize_flakes_stderr.txt | tail -n1 || true)"
          if [ -n "${counts_line}" ]; then
            echo "pw_counts_available=true" >> "$GITHUB_OUTPUT"
            for pair in ${counts_line}; do
              key="${pair%%=*}"; val="${pair##*=}"
              echo "pw_${key}=${val}" >> "$GITHUB_OUTPUT"
            done
          else
            echo "::warning::Could not parse test counts from the flake summarizer's output."
            echo "pw_counts_available=false" >> "$GITHUB_OUTPUT"
          fi

      # Dedicated single-file upload of the flake summary markdown so
      # reviewers can grab just the summary from the run's artifacts
      # dropdown without downloading the full smoke bundle. The same file
      # is also included in `quicklog-smoke-artifacts` below for archival.
      # Pre-check: the flake summary markdown is only meaningful when there
      # were failed or flaky tests. If summarize-playwright-flakes.mjs
      # produced no file (nothing to report) or an empty file, we skip the
      # dedicated upload and record a clear note in the Job Summary instead
      # of shipping an empty artifact reviewers might mistake for evidence.
      - name: Check flake summary presence
        id: check_flake_summary
        if: always() && steps.e2e_config.outputs.should_run == 'true'
        shell: bash
        env:
          PW_COUNTS_AVAILABLE: ${{ steps.summarize_flakes.outputs.pw_counts_available }}
          PW_FAILED: ${{ steps.summarize_flakes.outputs.pw_failed }}
          PW_FLAKY: ${{ steps.summarize_flakes.outputs.pw_flaky }}
        run: |
          file="e2e/results/playwright-flake-summary.md"

          # `-s` (non-empty) does NOT distinguish "nothing to report" from
          # "something to report": buildSummary() in summarize-playwright-flakes.mjs
          # always writes a header + counts line + either the flake/failure
          # tables or "_No flaky tests detected in this run._" — the file is
          # non-empty on EVERY successful run, including a fully green one.
          # Verified directly: a synthetic all-passing report still produces a
          # non-empty file. Gating on `-s` alone would upload the dedicated
          # artifact on every green run too, contradicting the intent that
          # it's "only meaningful when there were failed or flaky tests".
          #
          # The real signal is the counts captured by the previous step. Fall
          # back to file presence only when counts genuinely could not be
          # parsed — and fail OPEN in that case (upload anyway): withholding
          # possible evidence is worse than an occasional unnecessary artifact.
          if [ "${PW_COUNTS_AVAILABLE}" = "true" ]; then
            noteworthy=$(( ${PW_FAILED:-0} + ${PW_FLAKY:-0} ))
            if [ -f "${file}" ] && [ "${noteworthy}" -gt 0 ]; then
              echo "present=true" >> "$GITHUB_OUTPUT"
              echo "reason=" >> "$GITHUB_OUTPUT"
              echo "OK: ${PW_FAILED:-0} failed + ${PW_FLAKY:-0} flaky — uploading dedicated artifact."
            else
              echo "present=false" >> "$GITHUB_OUTPUT"
              echo "reason=clean" >> "$GITHUB_OUTPUT"
              echo "NOTE: 0 failed, 0 flaky — nothing worth a dedicated artifact."
            fi
          elif [ -s "${file}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "reason=" >> "$GITHUB_OUTPUT"
            echo "OK: ${file} is present and non-empty (counts unavailable — uploading to be safe)."
          elif [ -f "${file}" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "reason=empty" >> "$GITHUB_OUTPUT"
            echo "NOTE: ${file} exists but is empty — nothing to upload."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "reason=missing" >> "$GITHUB_OUTPUT"
            echo "NOTE: ${file} was not produced — nothing to upload."
          fi

      - name: Upload flake summary markdown
        id: upload_flake_summary
        if: always() && steps.e2e_config.outputs.should_run == 'true' && steps.check_flake_summary.outputs.present == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quicklog-flake-summary-${{ env.ARTIFACT_SUFFIX }}
          path: e2e/results/playwright-flake-summary.md
          retention-days: 30
          if-no-files-found: warn

      # Append a direct download link to the just-uploaded flake summary
      # artifact into the GitHub Actions Job Summary. `artifact-url` is only
      # populated by actions/upload-artifact@v4 AFTER the upload step runs,
      # so this must live immediately after upload_flake_summary rather than
      # inside the earlier summarizer step. When the upload was skipped
      # because there were no failed/flaky tests, record that explicitly
      # instead so reviewers know why no artifact is attached. Enrichment
      # only — never fails.
      - name: Link flake summary artifact in Job Summary
        if: always() && steps.e2e_config.outputs.should_run == 'true'
        shell: bash
        env:
          FLAKE_SUMMARY_URL: ${{ steps.upload_flake_summary.outputs.artifact-url }}
          HTML_REPORT_URL: ${{ steps.upload_playwright_report.outputs.artifact-url }}

          FLAKE_SUMMARY_PRESENT: ${{ steps.check_flake_summary.outputs.present }}
          FLAKE_SUMMARY_REASON: ${{ steps.check_flake_summary.outputs.reason }}
          PW_COUNTS_AVAILABLE: ${{ steps.summarize_flakes.outputs.pw_counts_available }}
          PW_TOTAL: ${{ steps.summarize_flakes.outputs.pw_total }}
          PW_PASSED: ${{ steps.summarize_flakes.outputs.pw_passed }}
          PW_FAILED: ${{ steps.summarize_flakes.outputs.pw_failed }}
          PW_FLAKY: ${{ steps.summarize_flakes.outputs.pw_flaky }}
          PW_SKIPPED: ${{ steps.summarize_flakes.outputs.pw_skipped }}
        run: |
          {
            echo ""
            echo "### 📎 Flake summary artifact"
            echo ""
            # Direct top-of-section link when the dedicated upload actually
            # succeeded. Reviewers should not have to scroll through the
            # upload-gate breakdown below to grab the file. `artifact-url`
            # is populated by actions/upload-artifact@v4 only on a real
            # successful upload, so its presence here is a strong signal
            # that the download link is live. The fuller status/gate
            # explanation still follows for the skipped/missing cases.
            # The run/job URLs are stable GitHub-provided identifiers, so we
            # can always build them from env — no extra API call needed. The
            # per-attempt URL points at the exact retry that produced the
            # uploaded artifact, which is what a reviewer usually wants when
            # cross-referencing a flake summary against raw step logs.
            RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            RUN_ATTEMPT_URL="${RUN_URL}/attempts/${GITHUB_RUN_ATTEMPT}"
            if [ "${FLAKE_SUMMARY_PRESENT}" = "true" ] && [ -n "${FLAKE_SUMMARY_URL}" ]; then
              echo "**Download:** [\`quicklog-flake-summary-${ARTIFACT_SUFFIX}\`](${FLAKE_SUMMARY_URL}) — single-file artifact containing \`playwright-flake-summary.md\`."
              echo ""
              # One-click access to the exact file the artifact contains.
              # GitHub Actions has no public deep-link into a zip artifact,
              # so the closest "one click" is the artifact URL labeled with
              # the archive-relative path, plus the file contents inlined
              # below so reviewers do not have to download + unzip just to
              # read it. Skipped when the file is unreadable so the summary
              # never breaks. Truncated to keep the Job Summary well under
              # GitHub's 1 MiB $GITHUB_STEP_SUMMARY cap even if a future
              # summarizer produces a very large report.
              echo "**Open the exact file (\`playwright-flake-summary.md\` at the root of the zip):** [\`quicklog-flake-summary-${ARTIFACT_SUFFIX}/playwright-flake-summary.md\`](${FLAKE_SUMMARY_URL}) — one-click download; the zip contains only this single file, so no unzipping is required to locate it."
              echo ""
              flake_summary_file="e2e/results/playwright-flake-summary.md"
              if [ -r "${flake_summary_file}" ]; then
                flake_summary_bytes=$(wc -c < "${flake_summary_file}" | tr -d ' ')
                echo "<details><summary>📄 Inline preview of <code>playwright-flake-summary.md</code> (${flake_summary_bytes} bytes) — click to expand</summary>"
                echo ""
                echo "> Rendered from the exact file that was uploaded as \`quicklog-flake-summary-${ARTIFACT_SUFFIX}/playwright-flake-summary.md\` in this run. Contents are truncated to the first 64 KiB to stay under the Job Summary size cap; download the artifact for the full file."
                echo ""
                echo '```markdown'
                head -c 65536 "${flake_summary_file}"
                if [ "${flake_summary_bytes}" -gt 65536 ]; then
                  echo ""
                  echo "... [truncated in Job Summary — see artifact for full contents] ..."
                fi
                echo ""
                echo '```'
                echo ""
                echo "</details>"
                echo ""
              fi

              if [ -n "${HTML_REPORT_URL}" ]; then
                echo "**Playwright HTML report for the same run:** [\`quicklog-playwright-report-${ARTIFACT_SUFFIX}\`](${HTML_REPORT_URL}) — unzip and open \`index.html\` to browse the exact test tree the flake summary counts came from. _Uploaded as a sibling artifact rather than inside the flake summary zip (which holds only \`playwright-flake-summary.md\`)._"
              else
                echo "**Playwright HTML report for the same run:** _URL unavailable — check this run's Artifacts dropdown for \`quicklog-playwright-report-${ARTIFACT_SUFFIX}\` (unzip and open \`index.html\`). It is uploaded as a sibling artifact rather than inside the flake summary zip._"
              fi
              echo ""
              echo "**Raw workflow logs for this upload:** [run #${GITHUB_RUN_NUMBER} attempt ${GITHUB_RUN_ATTEMPT}](${RUN_ATTEMPT_URL}) — expand the \`${GITHUB_JOB}\` job, then the \`Upload playwright-flake-summary.md as artifact\` step for the exact upload output, or the \`Summarize Playwright flakes\` step for how the file was generated. Full run page: [${GITHUB_WORKFLOW} #${GITHUB_RUN_NUMBER}](${RUN_URL})."
              echo ""
            elif [ "${FLAKE_SUMMARY_PRESENT}" = "true" ]; then

              echo "**Download:** _Standalone artifact was uploaded, but its direct URL is unavailable in this Job Summary._"
              echo ""
              echo "Open this run's **Artifacts** dropdown (top-right of the run page) and download:"
              echo ""
              echo "- **Artifact name:** \`quicklog-flake-summary-${ARTIFACT_SUFFIX}\`"
              echo "- **File inside the zip:** \`playwright-flake-summary.md\` (at the root of the archive)"
              echo ""
              echo "**Raw workflow logs for this upload:** [run #${GITHUB_RUN_NUMBER} attempt ${GITHUB_RUN_ATTEMPT}](${RUN_ATTEMPT_URL}) — expand the \`${GITHUB_JOB}\` job, then the \`Upload playwright-flake-summary.md as artifact\` step. Full run page: [${GITHUB_WORKFLOW} #${GITHUB_RUN_NUMBER}](${RUN_URL})."
              echo ""

            else
              echo "**Download:** _Standalone \`quicklog-flake-summary-${ARTIFACT_SUFFIX}\` artifact was **not uploaded** for this run (see the **Upload gate** breakdown below for the exact reason)._"
              echo ""
              echo "Fallback — the same file is archived inside the always-uploaded smoke bundle whenever it exists on disk:"
              echo ""
              echo "- **Bundle artifact name:** \`quicklog-smoke-artifacts-${ARTIFACT_SUFFIX}\` (Artifacts dropdown on this run's page)"
              echo "- **Path inside the bundle zip:** \`e2e/results/playwright-flake-summary.md\`"
              echo "- **Sibling source of truth (same folder):** \`e2e/results/playwright-report.json\` — regenerate the summary locally by passing this to \`scripts/summarize-playwright-flakes.mjs --report=\`."
              echo ""
              echo "If neither artifact contains the file, it was never produced — jump to **How to (re)generate \`playwright-flake-summary.md\` locally** below."
              echo ""
              echo "**Raw workflow logs for the skipped/failed upload:** [run #${GITHUB_RUN_NUMBER} attempt ${GITHUB_RUN_ATTEMPT}](${RUN_ATTEMPT_URL}) — expand the \`${GITHUB_JOB}\` job, then the \`Check flake summary presence\` step to see the gate decision, and the \`Upload playwright-flake-summary.md as artifact\` step to confirm it was skipped or errored. Full run page: [${GITHUB_WORKFLOW} #${GITHUB_RUN_NUMBER}](${RUN_URL})."
              echo ""
            fi

            echo "**Expected path (in this workspace):** \`e2e/results/playwright-flake-summary.md\`"
            echo "**Uploaded artifact name (standalone):** \`quicklog-flake-summary-${ARTIFACT_SUFFIX}\` (single file: \`playwright-flake-summary.md\`)"
            echo "**Also archived inside:** \`quicklog-smoke-artifacts-${ARTIFACT_SUFFIX}\` bundle at \`e2e/results/playwright-flake-summary.md\` — alongside the source it was generated from, \`e2e/results/playwright-report.json\` (Playwright's own JSON reporter output; not uploaded as a standalone artifact)."

            echo ""
            echo "#### Upload gate"
            echo ""
            # Compute every input the real gate in `Check flake summary presence`
            # branched on, then render each one so reviewers can reproduce the
            # decision without reading the workflow YAML.
            file="e2e/results/playwright-flake-summary.md"
            if [ -f "${file}" ]; then
              file_exists="true"
              file_size=$(wc -c < "${file}" | tr -d ' ')
            else
              file_exists="false"
              file_size="0"
            fi
            if [ "${file_exists}" = "true" ] && [ "${file_size}" -gt 0 ]; then
              file_nonempty="true"
            else
              file_nonempty="false"
            fi
            noteworthy=$(( ${PW_FAILED:-0} + ${PW_FLAKY:-0} ))
            failed_threshold=0
            flaky_threshold=0
            case "${FLAKE_SUMMARY_PRESENT}" in
              true)  gate_result="upload" ;;
              *)     gate_result="skip" ;;
            esac
            case "${FLAKE_SUMMARY_REASON}" in
              "")      reason_display="(none — uploaded)" ;;
              clean)   reason_display="clean — 0 failed + 0 flaky" ;;
              empty)   reason_display="empty — file existed but had zero bytes" ;;
              missing) reason_display="missing — summarizer did not produce the file" ;;
              *)       reason_display="${FLAKE_SUMMARY_REASON}" ;;
            esac
            echo "**Thresholds (hardcoded in \`Check flake summary presence\`):**"
            echo ""
            echo "| threshold | value | meaning |"
            echo "| --------- | ----- | ------- |"
            echo "| \`failed\` | \`> ${failed_threshold}\` | any hard failure contributes to \`noteworthy\` |"
            echo "| \`flaky\` | \`> ${flaky_threshold}\` | any retry-recovered test contributes to \`noteworthy\` |"
            echo "| \`noteworthy = failed + flaky\` | \`> 0\` | primary gate — upload only when at least one test was failed or flaky |"
            echo ""
            echo "**Computed inputs for this run:**"
            echo ""
            echo "| input | value | source |"
            echo "| ----- | ----- | ------ |"
            echo "| \`pw_counts_available\` | \`${PW_COUNTS_AVAILABLE:-false}\` | \`summarize_flakes\` step output |"
            echo "| \`pw_failed\` | \`${PW_FAILED:-?}\` | \`summarize_flakes\` step output |"
            echo "| \`pw_flaky\` | \`${PW_FLAKY:-?}\` | \`summarize_flakes\` step output |"
            echo "| \`pw_passed\` | \`${PW_PASSED:-?}\` | \`summarize_flakes\` step output |"
            echo "| \`pw_skipped\` | \`${PW_SKIPPED:-?}\` | \`summarize_flakes\` step output |"
            echo "| \`pw_total\` | \`${PW_TOTAL:-?}\` | \`summarize_flakes\` step output |"
            echo "| \`noteworthy\` (\`failed + flaky\`) | \`${noteworthy}\` | computed here |"
            echo "| \`playwright-flake-summary.md\` exists | \`${file_exists}\` | filesystem check |"
            echo "| \`playwright-flake-summary.md\` size (bytes) | \`${file_size}\` | filesystem check |"
            echo "| \`playwright-flake-summary.md\` non-empty | \`${file_nonempty}\` | filesystem check |"
            echo ""
            if [ "${PW_COUNTS_AVAILABLE}" = "true" ]; then
              echo "| total | passed | failed | flaky | skipped |"
              echo "| ----- | ------ | ------ | ----- | ------- |"
              echo "| ${PW_TOTAL:-?} | ${PW_PASSED:-?} | ${PW_FAILED:-?} | ${PW_FLAKY:-?} | ${PW_SKIPPED:-?} |"
              echo ""
              echo "**Gate rule (primary):** upload only when \`failed + flaky > 0\` AND the file exists."
              echo "**Gate rule (fallback, when counts unavailable):** upload when the file exists and is non-empty."
              echo ""
              echo "**Applied branch:** counts available (\`pw_counts_available=true\`) → primary rule."
              echo "**Evaluation:** \`${PW_FAILED:-0} failed + ${PW_FLAKY:-0} flaky = ${noteworthy}\` and \`file_exists=${file_exists}\` → **${gate_result}**."
              echo ""
              if [ "${noteworthy}" -gt 0 ] && [ "${file_exists}" = "true" ]; then
                echo "**Generated from failed/flaky tests?** ✅ Yes — \`playwright-flake-summary.md\` reflects **${PW_FAILED:-0} failed** and **${PW_FLAKY:-0} flaky** test(s). Gate result: **upload** (${noteworthy} > 0)."
              else
                echo "**Generated from failed/flaky tests?** ❌ No — clean run (**0 failed, 0 flaky**) or missing file. Gate result: **skip upload**."
              fi
            else
              echo "**Gate rule (primary):** upload only when \`failed + flaky > 0\`."
              echo "**Gate rule (fallback, applied here):** counts unavailable → upload if the file exists and is non-empty (fail-open — withholding possible evidence is worse than an occasional unnecessary artifact)."
              echo ""
              echo "**Applied branch:** counts unavailable (\`pw_counts_available!=true\`) → fallback rule."
              echo "**Evaluation:** \`file_exists=${file_exists}\`, \`file_nonempty=${file_nonempty}\` → **${gate_result}**."
              echo ""
              echo "_Cannot determine whether the summary was generated from failed/flaky tests — counts weren't parsed._"
            fi
            echo ""
            echo "**Gate decision:** \`${gate_result}\` — reason: \`${reason_display}\`."
            echo ""
            if [ "${FLAKE_SUMMARY_PRESENT}" != "true" ]; then
              case "${FLAKE_SUMMARY_REASON}" in
                clean)
                  echo "**Status:** _0 failed, 0 flaky — dedicated \`quicklog-flake-summary\` artifact skipped. This is the expected outcome on a clean run, not a build error._"
                  ;;
                empty)
                  echo "**Status:** _\`playwright-flake-summary.md\` was written but empty, so the dedicated artifact was skipped._"
                  ;;
                *)
                  echo "**Status:** _\`playwright-flake-summary.md\` was not produced, so the dedicated artifact was skipped._"
                  ;;
              esac
              echo ""
              echo "#### How to (re)generate \`playwright-flake-summary.md\` locally"
              echo ""
              echo "These commands mirror the exact steps this workflow runs (\`.github/workflows/quicklog-smoke.yml\`): the \`e2e:install:ci\` + \`e2e:quicklog-smoke\` scripts defined in \`package.json\`, followed by \`scripts/summarize-playwright-flakes.mjs\` against Playwright's JSON reporter output at \`e2e/results/playwright-report.json\`."
              echo ""
              echo '```bash'
              echo "# 0. Install deps once (matches the workflow's setup step)"
              echo "bun install --frozen-lockfile"
              echo ""
              echo "# 1. Install the Chromium browser Playwright needs (matches CI's \`bun run e2e:install:ci\`)"
              echo "#    Script: \"e2e:install:ci\": \"playwright install --with-deps chromium\""
              echo "bun run e2e:install:ci"
              echo ""
              echo "# 2. Run the Quick Log smoke — produces e2e/results/playwright-report.json"
              echo "#    Script: \"e2e:quicklog-smoke\": \"playwright test e2e/quicklog-smoke.spec.ts --project=chromium-authed\""
              echo "bun run e2e:quicklog-smoke"
              echo ""
              echo "# 3. Regenerate the flake summary markdown from the JSON report"
              echo "#    (identical invocation to the \`Summarize Playwright flakes\` step above)"
              echo "node scripts/summarize-playwright-flakes.mjs \\"
              echo "  --report=e2e/results/playwright-report.json \\"
              echo "  --out=e2e/results/playwright-flake-summary.md"
              echo ""
              echo "# 4. Open the regenerated summary"
              echo "cat e2e/results/playwright-flake-summary.md"
              echo '```'
              echo ""
              echo "Prefer \`node\` over \`bun\` for step 3 to match CI exactly — the summarizer is invoked with \`node\` in the workflow. If \`bun run e2e:quicklog-smoke\` cannot reach the same fixture (missing env, auth secrets, network), regenerate the summary from any existing Playwright JSON report by pointing \`--report=\` at that file instead."
              echo ""
              echo "Note: \`playwright-flake-summary.md\` is written on every successful run — including a clean one — with at least the header and the counts table, and it says explicitly when no flakes were found. It is the COUNTS (above), not file emptiness, that decide whether the dedicated artifact is worth downloading."
            elif [ -n "${FLAKE_SUMMARY_URL}" ]; then
              echo "**Status:** Download the standalone \`playwright-flake-summary.md\` here: [quicklog-flake-summary](${FLAKE_SUMMARY_URL})"
            else
              echo "**Status:** _Flake summary artifact URL unavailable — check the run's Artifacts dropdown for \`quicklog-flake-summary\`._"
            fi
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload smoke artifacts
        id: upload_smoke_bundle
        if: always() && steps.e2e_config.outputs.should_run == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quicklog-smoke-artifacts-${{ env.ARTIFACT_SUFFIX }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            e2e/results/quicklog-smoke-report.json
            e2e/results/quicklog-smoke-report.txt
            e2e/results/playwright-report.json
            e2e/results/playwright-flake-summary.md
            playwright-report/

      # Consolidated at-a-glance index of the three primary uploads for this
      # run (smoke bundle, standalone flake summary, standalone Playwright
      # HTML report) so a reviewer can grab any of them from one place
      # without scrolling through the per-artifact sections that already
      # exist above/below. Written after upload_smoke_bundle so every
      # `artifact-url` output is populated. Enrichment only — never fails.
      - name: List uploaded artifacts in Job Summary
        if: always() && steps.e2e_config.outputs.should_run == 'true'
        shell: bash
        env:
          SMOKE_BUNDLE_URL: ${{ steps.upload_smoke_bundle.outputs.artifact-url }}
          FLAKE_SUMMARY_URL: ${{ steps.upload_flake_summary.outputs.artifact-url }}
          FLAKE_SUMMARY_PRESENT: ${{ steps.check_flake_summary.outputs.present }}
          HTML_REPORT_URL: ${{ steps.upload_playwright_report.outputs.artifact-url }}
        run: |
          # Renders one Markdown row per artifact with the exact uploaded
          # name (including the run-scoped ARTIFACT_SUFFIX) and a Download
          # column that becomes a clickable link only when the upload
          # actually succeeded. Absent uploads (skipped by the flake gate,
          # disabled via `upload_html_report=false`, failed upload) render
          # as an italic "not uploaded" note in the same row so reviewers
          # never wonder whether they missed a link.
          fmt_link() {
            local url="$1" label="$2" missing_note="$3"
            if [ -n "${url}" ]; then
              printf '[%s](%s)' "${label}" "${url}"
            else
              printf '_%s_' "${missing_note}"
            fi
          }
          smoke_link=$(fmt_link "${SMOKE_BUNDLE_URL}" "Download" "not uploaded — check the run's Artifacts dropdown")
          if [ "${FLAKE_SUMMARY_PRESENT}" = "true" ]; then
            flake_link=$(fmt_link "${FLAKE_SUMMARY_URL}" "Download" "uploaded, URL unavailable — see Artifacts dropdown")
          else
            flake_link='_not uploaded — 0 failed + 0 flaky (see Flake summary section)_'
          fi
          html_link=$(fmt_link "${HTML_REPORT_URL}" "Download" "not uploaded — see HTML report section for reason")
          {
            echo ""
            echo "### 📦 Uploaded artifacts (this run)"
            echo ""
            echo "One-stop index of every standalone artifact this workflow published. Each row shows the exact uploaded name (with the run-scoped suffix \`${ARTIFACT_SUFFIX}\`), what it contains, and a direct download link when available. Per-artifact sections above/below add gate breakdowns, inline previews, and fallback paths for the missing cases."
            echo ""
            echo "| Artifact name | Contents | Download |"
            echo "| ------------- | -------- | -------- |"
            echo "| \`quicklog-smoke-artifacts-${ARTIFACT_SUFFIX}\` | Smoke bundle: \`quicklog-smoke-report.{json,txt}\`, \`playwright-report.json\`, \`playwright-flake-summary.md\`, \`playwright-report/\` (HTML) | ${smoke_link} |"
            echo "| \`quicklog-flake-summary-${ARTIFACT_SUFFIX}\` | Single file: \`playwright-flake-summary.md\` (uploaded only when \`failed + flaky > 0\`) | ${flake_link} |"
            echo "| \`quicklog-playwright-report-${ARTIFACT_SUFFIX}\` | Standalone \`playwright-report/\` (unzip and open \`index.html\`) | ${html_link} |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      # Follow-up to the pinned "🧭 Playwright HTML report" section at the
      # top of the Job Summary: the same `playwright-report/` tree is also
      # packaged inside the `quicklog-smoke-artifacts` bundle. Surface that
      # copy's artifact URL too so reviewers who already downloaded the
      # bundle for other files (JSON report, TXT report, flake summary)
      # don't need to grab the standalone HTML report artifact separately.
      # `upload-artifact@v4`'s `artifact-url` output is only populated after
      # the upload step runs, so this must live immediately after
      # upload_smoke_bundle. Enrichment only — never fails the job.
      - name: Link smoke bundle HTML report in Job Summary
        if: always() && steps.e2e_config.outputs.should_run == 'true'
        shell: bash
        env:
          SMOKE_BUNDLE_URL: ${{ steps.upload_smoke_bundle.outputs.artifact-url }}
        run: |
          {
            echo ""
            echo "### 🧭 Playwright HTML report (bundled copy)"
            echo ""
            if [ ! -d "playwright-report" ]; then
              echo "**Status:** ❌ \`playwright-report/\` not produced — no bundled HTML report to link. See the pinned HTML report section at the top of this summary."
            elif [ -n "${SMOKE_BUNDLE_URL}" ]; then
              echo "The same \`playwright-report/\` tree is also included inside the smoke artifacts bundle:"
              echo ""
              echo "- [\`quicklog-smoke-artifacts\`](${SMOKE_BUNDLE_URL}) — unzip and open \`playwright-report/index.html\`"
              echo ""
              echo "_Prefer the pinned [\`quicklog-playwright-report\`](#user-content-playwright-html-report) artifact at the top of this summary if you only need the HTML report; use this bundle when you also want the JSON/TXT reports or the flake summary markdown._"
            else
              echo "**Status:** _Smoke bundle artifact URL unavailable — check the run's Artifacts dropdown for \`quicklog-smoke-artifacts\` and open \`playwright-report/index.html\` inside it._"
            fi
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      # Moved: Upload Playwright HTML report + Link in Job Summary now run
      # earlier (right before "Summarize Playwright flakes") so the HTML report
      # link is the FIRST section written to $GITHUB_STEP_SUMMARY and is
      # immediately visible at the top of the run's summary. $GITHUB_STEP_SUMMARY
      # is append-only, so ordering is controlled purely by step execution order.
      # Downstream steps that reference steps.upload_playwright_report.outputs.artifact-url
      # still resolve because those steps run after the moved position.

      - name: Detect Playwright trace files
        id: trace_files
        if: always() && steps.e2e_config.outputs.should_run == 'true'
        shell: bash
        run: |
          count=0
          if [ -d "test-results" ]; then
            count="$(find test-results -type f -name 'trace.zip' -print 2>/dev/null | wc -l | tr -d ' ')"
          fi
          echo "count=${count}" >> "$GITHUB_OUTPUT"
          if [ "${count}" -gt 0 ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Playwright traces
        id: upload_playwright_traces
        if: >-
          always()
          && steps.e2e_config.outputs.should_run == 'true'
          && steps.trace_files.outputs.present == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quicklog-playwright-traces-${{ env.ARTIFACT_SUFFIX }}
          path: |
            test-results/**/trace.zip
          retention-days: 30
          if-no-files-found: warn

      # Compute artifact file sizes + SHA-256 checksums for the flake summary
      # and Playwright traces so the Job Summary carries independent integrity
      # metadata for the exact bytes uploaded. Never fails the job — pure
      # enrichment. All values are derived from local files (same bytes
      # actions/upload-artifact consumed), never from network calls.
      - name: Artifact checksums (trace + flake summary)
        id: artifact_checksums
        if: always() && steps.e2e_config.outputs.should_run == 'true'
        shell: bash
        env:
          FLAKE_SUMMARY_PRESENT: ${{ steps.check_flake_summary.outputs.present }}
          FLAKE_SUMMARY_URL: ${{ steps.upload_flake_summary.outputs.artifact-url }}
          TRACES_URL: ${{ steps.upload_playwright_traces.outputs.artifact-url }}
        run: |
          human_bytes() {
            # POSIX-portable human-readable byte formatter (no `numfmt` dep).
            awk -v b="$1" 'BEGIN {
              split("B KiB MiB GiB TiB", u, " ");
              i = 1;
              while (b >= 1024 && i < 5) { b /= 1024; i++; }
              if (i == 1) printf "%d %s", b, u[i];
              else printf "%.2f %s", b, u[i];
            }'
          }

          flake_file="e2e/results/playwright-flake-summary.md"
          flake_line="_Not generated for this run — no failed or flaky tests to report._"
          if [ "${FLAKE_SUMMARY_PRESENT}" = "true" ] && [ -r "${flake_file}" ]; then
            flake_bytes=$(wc -c < "${flake_file}" | tr -d ' ')
            flake_sha=$(sha256sum "${flake_file}" | awk '{print $1}')
            flake_hr=$(human_bytes "${flake_bytes}")
            flake_line="| \`playwright-flake-summary.md\` | ${flake_hr} (${flake_bytes} bytes) | \`${flake_sha}\` |"
          fi

          # Playwright traces artifact = every test-results/**/trace.zip. Report
          # per-file rows (bounded to 25 to stay well under the 1 MiB
          # $GITHUB_STEP_SUMMARY cap) plus totals + a manifest checksum that
          # covers every trace zip, so tampering with any single trace is
          # detectable from the summary alone.
          trace_rows=""
          trace_total_bytes=0
          trace_file_count=0
          trace_manifest_sha=""
          if compgen -G "test-results/**/trace.zip" > /dev/null 2>&1 || \
             find test-results -type f -name 'trace.zip' -print -quit 2>/dev/null | grep -q .; then
            tmp_manifest="$(mktemp)"
            # Deterministic ordering so the manifest checksum is reproducible.
            while IFS= read -r -d '' f; do
              bytes=$(wc -c < "$f" | tr -d ' ')
              sha=$(sha256sum "$f" | awk '{print $1}')
              trace_total_bytes=$((trace_total_bytes + bytes))
              trace_file_count=$((trace_file_count + 1))
              printf '%s  %s  %s\n' "$sha" "$bytes" "$f" >> "$tmp_manifest"
            done < <(find test-results -type f -name 'trace.zip' -print0 | sort -z)
            trace_manifest_sha=$(sha256sum "$tmp_manifest" | awk '{print $1}')
            # Cap displayed rows so a run with hundreds of trace zips doesn't
            # overflow the Job Summary size cap. Full manifest is still
            # covered by trace_manifest_sha (computed over the full list).
            trace_rows=$(head -n 25 "$tmp_manifest" | awk '{
              sha=$1; bytes=$2; $1=""; $2=""; path=$0; sub(/^  /,"",path);
              printf "| `%s` | %s bytes | `%s` |\n", path, bytes, sha;
            }')
            if [ "${trace_file_count}" -gt 25 ]; then
              trace_rows="${trace_rows}"$'\n'"| _…and $((trace_file_count - 25)) more trace zip(s) — full list covered by the manifest SHA-256 below._ | | |"
            fi
            rm -f "$tmp_manifest"
          fi

          {
            echo ""
            echo "### 🔐 Artifact checksums (SHA-256)"
            echo ""
            echo "Independent integrity metadata for the exact bytes uploaded above. Recompute locally with \`sha256sum <file>\` after unzipping the artifact to verify."
            echo ""
            echo "**Flake summary (\`quicklog-flake-summary-${ARTIFACT_SUFFIX}\`)**"
            echo ""
            echo "| File | Size | SHA-256 |"
            echo "|------|------|---------|"
            echo "${flake_line}"
            echo ""
            echo "**Playwright traces (\`quicklog-playwright-traces-${ARTIFACT_SUFFIX}\`)**"
            echo ""
            if [ "${trace_file_count}" -gt 0 ]; then
              trace_total_hr=$(human_bytes "${trace_total_bytes}")
              echo "- **Files:** ${trace_file_count} \`trace.zip\`(s)"
              echo "- **Total size:** ${trace_total_hr} (${trace_total_bytes} bytes)"
              echo "- **Manifest SHA-256:** \`${trace_manifest_sha}\` — computed over a deterministic \`<sha>  <bytes>  <path>\` listing of every uploaded trace zip; any change to any single trace changes this value."
              echo ""
              echo "| File | Size | SHA-256 |"
              echo "|------|------|---------|"
              echo "${trace_rows}"
            else
              echo "_No \`test-results/**/trace.zip\` files were produced for this run — nothing to checksum._"
            fi
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      # Real-auth runs force trace off in playwright.config.ts. Viewer/download
      # guidance is emitted only when trace files were proven to exist and the
      # upload action returned an actual artifact URL.
      - name: Link Playwright trace viewer in Job Summary
        if: always() && steps.e2e_config.outputs.should_run == 'true'
        shell: bash
        env:
          TRACE_FILES_PRESENT: ${{ steps.trace_files.outputs.present }}
          TRACE_FILE_COUNT: ${{ steps.trace_files.outputs.count }}
          TRACES_URL: ${{ steps.upload_playwright_traces.outputs.artifact-url }}
        run: |
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          ATTEMPT_URL="${RUN_URL}/attempts/${GITHUB_RUN_ATTEMPT}"
          {
            echo ""
            echo "### 🎬 Playwright trace status"
            echo ""
            echo "Run: [#${GITHUB_RUN_NUMBER} attempt ${GITHUB_RUN_ATTEMPT}](${ATTEMPT_URL})"
            echo ""
            if [ "${TRACE_FILES_PRESENT}" = "true" ] && [ -n "${TRACES_URL}" ]; then
              echo "Trace files detected: \`${TRACE_FILE_COUNT}\`. [Download \`quicklog-playwright-traces-${ARTIFACT_SUFFIX}\`](${TRACES_URL})."
              echo ""
              echo "The upload wildcard strips the \`test-results/\` prefix. After extracting, locate traces from the artifact root:"
              echo ""
              echo '  ```bash'
              echo "  find quicklog-playwright-traces-${ARTIFACT_SUFFIX} -type f -name 'trace.zip'"
              echo '  ```'
              echo ""
              echo "Retry traces use sibling directories such as \`<test>-retry1/trace.zip\`. Open a located trace with \`bunx playwright show-trace <path-to-trace.zip>\`."
            elif [ "${TRACE_FILES_PRESENT}" = "true" ]; then
              echo "Trace files were detected, but no trace artifact URL is available. Viewer/download instructions are withheld until an upload is proven."
            else
              echo "Trace intentionally disabled/unavailable for this authenticated smoke run."
            fi
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Playwright media (screenshots/videos)
        id: upload_playwright_media

        if: always() && steps.e2e_config.outputs.should_run == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quicklog-playwright-media-${{ env.ARTIFACT_SUFFIX }}
          path: |
            test-results/**/*.png
            test-results/**/*.jpg
            test-results/**/*.jpeg
            test-results/**/*.gif
            test-results/**/*.webm
            test-results/**/*.mp4
            playwright-report/data/**
          retention-days: 30
          if-no-files-found: warn

      - name: Upload smoke report JSON
        id: upload_smoke_report_json
        if: always() && steps.e2e_config.outputs.should_run == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quicklog-smoke-report-json-${{ env.ARTIFACT_SUFFIX }}
          path: e2e/results/quicklog-smoke-report.json
          retention-days: 30
          if-no-files-found: warn

      - name: Upload smoke report TXT
        id: upload_smoke_report_txt
        if: always() && steps.e2e_config.outputs.should_run == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quicklog-smoke-report-txt-${{ env.ARTIFACT_SUFFIX }}
          path: e2e/results/quicklog-smoke-report.txt
          retention-days: 30
          if-no-files-found: warn

      - name: Link Playwright JSON report source in Job Summary
        if: always() && steps.e2e_config.outputs.should_run == 'true'
        shell: bash
        env:
          BUNDLE_URL: ${{ steps.upload_smoke_bundle.outputs.artifact-url }}
          SMOKE_JSON_URL: ${{ steps.upload_smoke_report_json.outputs.artifact-url }}
          HTML_REPORT_URL: ${{ steps.upload_playwright_report.outputs.artifact-url }}
        run: |
          # Traceability: point reviewers at the exact Playwright JSON report
          # directory that fed scripts/summarize-playwright-flakes.mjs, so
          # playwright-flake-summary.md can always be traced back to its
          # source. Enrichment only — never fails the job.
          REPORT_PATH="e2e/results/playwright-report.json"
          {
            echo ""
            echo "### 📄 Playwright JSON report source"
            echo ""
            echo "\`playwright-flake-summary.md\` is generated from the Playwright JSON report at:"
            echo ""
            echo "- **Local path:** \`${REPORT_PATH}\`"
            echo "- **Local HTML report dir:** \`playwright-report/\`"
            echo ""
            if [ -f "${REPORT_PATH}" ]; then
              SIZE_BYTES=$(wc -c < "${REPORT_PATH}" | tr -d ' ')
              echo "- **Report file present in this run:** ✅ (\`${SIZE_BYTES}\` bytes)"
            else
              echo "- **Report file present in this run:** ❌ not generated (Playwright likely did not run — see earlier steps)"
            fi
            echo ""
            echo "**Downloads (this run):**"
            echo ""
            if [ -n "${SMOKE_JSON_URL}" ]; then
              echo "- [\`quicklog-smoke-report-json\`](${SMOKE_JSON_URL}) — bundles \`e2e/results/quicklog-smoke-report.json\`"
            else
              echo "- \`quicklog-smoke-report-json\` — artifact URL unavailable, see Artifacts dropdown"
            fi
            if [ -n "${BUNDLE_URL}" ]; then
              echo "- [\`quicklog-smoke-artifacts\`](${BUNDLE_URL}) — bundles \`playwright-report.json\`, \`playwright-report/\`, and the smoke/flake summaries"
            else
              echo "- \`quicklog-smoke-artifacts\` — artifact URL unavailable, see Artifacts dropdown"
            fi
            if [ -n "${HTML_REPORT_URL}" ]; then
              echo "- [\`quicklog-playwright-report\`](${HTML_REPORT_URL}) — standalone HTML report directory"
            else
              echo "- \`quicklog-playwright-report\` — artifact URL unavailable, see Artifacts dropdown"
            fi
            echo ""
            echo "_Download any of the above, then re-run \`node scripts/summarize-playwright-flakes.mjs --report=<path-to-playwright-report.json>\` locally to reproduce \`playwright-flake-summary.md\` byte-for-byte._"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload per-test failure artifacts
        id: upload_per_test_artifacts
        if: always() && steps.e2e_config.outputs.should_run == 'true' && env.PR_COMMENT_CONTEXT_OK == 'true' && env.PR_COMMENT_DISABLED != 'true'
        shell: bash
        run: |
          # One dedicated artifact per failed/flaky test, so the PR comment
          # can link directly to just that test's evidence instead of the
          # whole run's shared bundle. Enrichment only: this script never
          # exits non-zero, so it can never fail the job. Skipped entirely
          # when PR comments are disabled — nothing would ever link to it.
          if [ ! -f "e2e/results/playwright-report.json" ]; then
            echo "::notice::No Playwright JSON report — skipping per-test artifact uploads."
            exit 0
          fi
          node scripts/upload-per-test-artifacts.mjs \
            --report=e2e/results/playwright-report.json \
            --out=e2e/results/per-test-artifacts.json \
            || echo "::warning::per-test artifact uploader exited non-zero (see logs) — this is enrichment only and does not affect the smoke result"

      - name: Build Playwright failure PR-comment body
        id: build_pr_comment
        if: always() && steps.e2e_config.outputs.should_run == 'true' && env.PR_COMMENT_CONTEXT_OK == 'true'
        shell: bash
        env:
          TRACES_URL: ${{ steps.upload_playwright_traces.outputs.artifact-url }}
          MEDIA_URL: ${{ steps.upload_playwright_media.outputs.artifact-url }}
          REPORT_URL: ${{ steps.upload_playwright_report.outputs.artifact-url }}
          BUNDLE_URL: ${{ steps.upload_smoke_bundle.outputs.artifact-url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PR_COMMENT_MIN_FAILED: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_comment_min_failed || '1' }}
        run: |
          # Regenerates the flake summary as a PR-comment body with direct
          # links to the uploaded artifact bundles for both attempt 1 and
          # retry1. `artifact-url` outputs are only populated by
          # actions/upload-artifact@v4 AFTER the upload step runs, so this
          # step must live after every upload_playwright_* step.
          #
          # PR_COMMENT_DISABLED is checked FIRST and unconditionally — it
          # overrides PR_COMMENT_MIN_FAILED and posts nothing even when there
          # are hard failures. This is the one authoritative gate: the "Post
          # ... PR comment" steps below only ever look at comment_ready, so
          # disabling here is enough to suppress posting everywhere.
          if [ "${PR_COMMENT_DISABLED}" = "true" ]; then
            echo "::notice::pr_comment_disabled=true — skipping PR comment unconditionally, even if there are hard failures."
            echo "comment_ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          #
          # PR_COMMENT_MIN_FAILED gates comment creation: the file (and
          # therefore the sticky comment) is only written when the hard-
          # failure count is >= this threshold. Default 1 keeps PRs quiet
          # on flake-only runs; set to 0 to always post.
          if [ ! -f "e2e/results/playwright-report.json" ]; then
            echo "::notice::No Playwright JSON report — skipping PR comment."
            echo "comment_ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node scripts/summarize-playwright-flakes.mjs \
            --report=e2e/results/playwright-report.json \
            --pr-comment=e2e/results/playwright-flake-pr-comment.md \
            --traces-url="${TRACES_URL}" \
            --media-url="${MEDIA_URL}" \
            --report-url="${REPORT_URL}" \
            --bundle-url="${BUNDLE_URL}" \
            --run-url="${RUN_URL}" \
            --per-test-artifacts=e2e/results/per-test-artifacts.json \
            --min-failed="${PR_COMMENT_MIN_FAILED:-1}" \
            > /dev/null \
            || echo "::warning::PR-comment builder exited non-zero (see logs)"
          if [ -s "e2e/results/playwright-flake-pr-comment.md" ]; then
            echo "comment_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "comment_ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Post Playwright failure artifacts PR comment (sticky)
        if: always() && steps.build_pr_comment.outputs.comment_ready == 'true' && env.PR_COMMENT_MODE == 'sticky'
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2
        with:
          header: verdant-playwright-flake-artifacts
          path: e2e/results/playwright-flake-pr-comment.md
          # Explicit PR number so this also works when comment_ready came
          # from a workflow_dispatch run (no pull_request event context to
          # auto-detect from — see PR_NUMBER/PR_COMMENT_CONTEXT_OK above).
          number: ${{ env.PR_NUMBER }}

      - name: Post Playwright failure artifacts PR comment (new per run)
        if: always() && steps.build_pr_comment.outputs.comment_ready == 'true' && env.PR_COMMENT_MODE == 'new-per-run'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Deliberately bypasses the sticky-comment action: with no header
          # to match against, every run posts a brand-new comment instead of
          # updating a prior one. Same body (and sticky marker inside it) as
          # the 'sticky' mode above — only the posting behavior differs.
          gh pr comment "${PR_NUMBER}" --body-file e2e/results/playwright-flake-pr-comment.md

      - name: Write Quick Log smoke run summary
        if: always()
        shell: bash
        env:
          SHOULD_RUN: ${{ steps.e2e_config.outputs.should_run }}
          MISSING_CONFIG: ${{ steps.e2e_config.outputs.missing_config }}
          JOB_STATUS: ${{ job.status }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ARTIFACTS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts
          SMOKE_COUNTS_AVAILABLE: ${{ steps.smoke_meta.outputs.smoke_counts_available }}
          SMOKE_TOTAL: ${{ steps.smoke_meta.outputs.smoke_total }}
          SMOKE_PASSED: ${{ steps.smoke_meta.outputs.smoke_passed }}
          SMOKE_FAILED: ${{ steps.smoke_meta.outputs.smoke_failed }}
          SMOKE_SKIPPED: ${{ steps.smoke_meta.outputs.smoke_skipped }}
          PLAYWRIGHT_VERSION: ${{ steps.smoke_meta.outputs.playwright_version }}
          REPORT_JSON_PRESENT: ${{ steps.smoke_meta.outputs.report_json_present }}
          REPORT_PARSE_STATUS: ${{ steps.smoke_meta.outputs.report_parse_status }}
          REPORT_PARSE_ERROR: ${{ steps.smoke_meta.outputs.report_parse_error }}
          SMOKE_STEP_OUTCOME: ${{ steps.quicklog_smoke.outcome }}
          SMOKE_STEP_CONCLUSION: ${{ steps.quicklog_smoke.conclusion }}
          PLAYWRIGHT_REPORT_ARTIFACT_URL: ${{ steps.upload_playwright_report.outputs.artifact-url }}
          PLAYWRIGHT_TRACES_ARTIFACT_URL: ${{ steps.upload_playwright_traces.outputs.artifact-url }}
          TRACE_FILES_PRESENT: ${{ steps.trace_files.outputs.present }}
          TRACE_FILE_COUNT: ${{ steps.trace_files.outputs.count }}
          PLAYWRIGHT_MEDIA_ARTIFACT_URL: ${{ steps.upload_playwright_media.outputs.artifact-url }}
          SMOKE_REPORT_JSON_ARTIFACT_URL: ${{ steps.upload_smoke_report_json.outputs.artifact-url }}
          SMOKE_REPORT_TXT_ARTIFACT_URL: ${{ steps.upload_smoke_report_txt.outputs.artifact-url }}
          FIXTURE_STEP_OUTCOME: ${{ steps.verify_fixture.outcome }}
          FIXTURE_STEP_CONCLUSION: ${{ steps.verify_fixture.conclusion }}
          BOOTSTRAP_ALLOW: ${{ vars.E2E_ALLOW_FIXTURE_BOOTSTRAP }}
          BOOTSTRAP_STEP_OUTCOME: ${{ steps.bootstrap_fixture.outcome }}
          BOOTSTRAP_STEP_CONCLUSION: ${{ steps.bootstrap_fixture.conclusion }}
        run: |
          # Never echo secret values. Only references to secret NAMES are written.
          fallback="${ARTIFACTS_URL}"
          pw_report_url="${PLAYWRIGHT_REPORT_ARTIFACT_URL:-$fallback}"
          pw_media_url="${PLAYWRIGHT_MEDIA_ARTIFACT_URL:-$fallback}"
          smoke_json_url="${SMOKE_REPORT_JSON_ARTIFACT_URL:-$fallback}"
          smoke_txt_url="${SMOKE_REPORT_TXT_ARTIFACT_URL:-$fallback}"

          # Fixture validation status for the summary.
          if [ "${SHOULD_RUN}" != "true" ]; then
            fixture_status="skipped due missing config"
          elif [ -z "${FIXTURE_STEP_OUTCOME}" ] || [ "${FIXTURE_STEP_OUTCOME}" = "skipped" ]; then
            fixture_status="not run"
          elif [ "${FIXTURE_STEP_OUTCOME}" = "success" ]; then
            fixture_status="passed"
          else
            fixture_status="failed"
          fi

          # Bootstrap status for the summary.
          if [ "${SHOULD_RUN}" != "true" ]; then
            bootstrap_status="skipped due missing config"
          elif [ "${BOOTSTRAP_ALLOW}" != "true" ]; then
            bootstrap_status="not enabled"
          elif [ "${BOOTSTRAP_STEP_OUTCOME}" = "success" ]; then
            bootstrap_status="passed"
          elif [ -z "${BOOTSTRAP_STEP_OUTCOME}" ] || [ "${BOOTSTRAP_STEP_OUTCOME}" = "skipped" ]; then
            bootstrap_status="skipped"
          else
            bootstrap_status="failed"
          fi

          {
            echo "## Quick Log Playwright smoke"
            echo ""
            echo "- Workflow result: \`${JOB_STATUS}\`"
            echo "- Event: \`${EVENT_NAME}\`"
            echo "- Branch/ref: \`${{ github.ref }}\`"
            echo "- [Workflow run](${RUN_URL})"
            echo "- [Artifacts](${ARTIFACTS_URL})"
            echo "- [Playwright HTML report](${pw_report_url})"
            if [ "${TRACE_FILES_PRESENT}" = "true" ] && [ -n "${PLAYWRIGHT_TRACES_ARTIFACT_URL}" ]; then
              echo "- [Playwright traces (${TRACE_FILE_COUNT})](${PLAYWRIGHT_TRACES_ARTIFACT_URL})"
            else
              echo "- Playwright traces: intentionally disabled/unavailable for this authenticated run"
            fi
            echo "- [Playwright media (screenshots/videos)](${pw_media_url})"
            echo "- [Smoke report JSON](${smoke_json_url})"
            echo "- [Smoke report TXT](${smoke_txt_url})"
            echo ""
            echo "  GitHub artifacts are downloads, not hosted HTML pages — download the artifact and open \`index.html\` (HTML report) or the report files locally."
            echo ""
            echo "### Disposable E2E fixture validation"
            echo ""
            echo "- Fixture validation: \`${fixture_status}\`"
            echo "- Fixture step outcome: \`${FIXTURE_STEP_OUTCOME:-unknown}\` (conclusion: \`${FIXTURE_STEP_CONCLUSION:-unknown}\`)"
            echo "- Bootstrap status: \`${bootstrap_status}\` (outcome: \`${BOOTSTRAP_STEP_OUTCOME:-unknown}\`, conclusion: \`${BOOTSTRAP_STEP_CONCLUSION:-unknown}\`)"
            echo ""
            echo "  GitHub artifacts are downloads — open files locally; no direct raw URLs are produced."
            echo ""
            if [ "${fixture_status}" = "failed" ]; then
              echo "Fixture verification failed: smoke was not allowed to run because the target plant/grow/tent did not match the expected disposable E2E fixture. No diary entries were written."
            fi
            if [ "${SHOULD_RUN}" = "true" ]; then
              echo "- Smoke executed: yes"
              echo "- Smoke step outcome: \`${SMOKE_STEP_OUTCOME:-unknown}\` (conclusion: \`${SMOKE_STEP_CONCLUSION:-unknown}\`)"
              echo ""
              echo "### Smoke run"
              echo ""
              echo "- Command: \`bun run e2e:quicklog-smoke\`"
              echo "- Browser: \`chromium\`"
              echo "- Playwright: \`${PLAYWRIGHT_VERSION:-unavailable}\`"
              echo "- Playwright retries per test: \`${PLAYWRIGHT_RETRIES:-1}\` (override via workflow_dispatch \`playwright_retries\` input)"
              echo ""
              echo "  Retry artifacts use sibling directories such as \`test-results/<test>-retry1/\`. Authenticated tracing is intentionally off; screenshots/videos may still be retained by Playwright."
              echo ""
              echo "### Smoke counts"
              echo ""
              if [ "${SMOKE_COUNTS_AVAILABLE}" = "true" ]; then
                echo "| total | passed | failed | skipped |"
                echo "| ----- | ------ | ------ | ------- |"
                echo "| ${SMOKE_TOTAL} | ${SMOKE_PASSED} | ${SMOKE_FAILED} | ${SMOKE_SKIPPED} |"
              else
                echo "Smoke counts unavailable: report JSON was not produced."
              fi
              echo ""
              echo "### Failure annotation"
              echo ""
              echo "- Smoke step outcome: \`${SMOKE_STEP_OUTCOME:-unknown}\`"
              echo "- Smoke step conclusion: \`${SMOKE_STEP_CONCLUSION:-unknown}\`"
              echo "- Report JSON present: \`${REPORT_JSON_PRESENT:-unknown}\`"
              echo "- Report parse status: \`${REPORT_PARSE_STATUS:-unknown}\`"
              echo ""
              if [ "${SMOKE_STEP_OUTCOME}" = "failure" ] || [ "${SMOKE_STEP_CONCLUSION}" = "failure" ]; then
                echo "Smoke command failed: the Playwright smoke step did not complete successfully. Inspect the masked run logs and the available report/media artifacts."
              fi
              case "${REPORT_PARSE_STATUS}" in
                parsed)
                  echo "Report parsing succeeded: smoke counts were extracted from \`quicklog-smoke-report.json\`."
                  ;;
                missing)
                  echo "Report JSON missing: smoke count parsing could not run because the report JSON was not produced. The artifact guard should fail this job after a real smoke attempt."
                  ;;
                failed)
                  echo "Report parsing failed: smoke counts could not be extracted from \`quicklog-smoke-report.json\`. This is a metadata/report parsing problem, not automatically the same as a Playwright smoke failure."
                  if [ -n "${REPORT_PARSE_ERROR}" ]; then
                    echo ""
                    echo "  Sanitized parse error: \`${REPORT_PARSE_ERROR}\`"
                  fi
                  ;;
                *)
                  echo "Report parse status unknown."
                  ;;
              esac
              echo ""
              echo "### Artifacts"
              echo ""
              echo "- Bundled artifact: \`quicklog-smoke-artifacts\` (retention: 30 days)"
              echo "- Playwright HTML report artifact: \`quicklog-playwright-report\` (retention: 30 days)"
              if [ "${TRACE_FILES_PRESENT}" = "true" ] && [ -n "${PLAYWRIGHT_TRACES_ARTIFACT_URL}" ]; then
                echo "- Playwright traces artifact: \`quicklog-playwright-traces\` (${TRACE_FILE_COUNT} file(s), retention: 30 days)"
              else
                echo "- Playwright traces artifact: not uploaded — trace intentionally disabled/unavailable"
              fi
              echo "- Playwright media artifact: \`quicklog-playwright-media\` (retention: 30 days)"
              echo "- Smoke report JSON artifact: \`quicklog-smoke-report-json\` (retention: 30 days)"
              echo "- Smoke report TXT artifact: \`quicklog-smoke-report-txt\` (retention: 30 days)"
              echo "- Run artifacts page: ${ARTIFACTS_URL}"
              echo ""
              echo "Bundled contents:"
              echo ""
              echo "- \`e2e/results/quicklog-smoke-report.json\`"
              echo "- \`e2e/results/quicklog-smoke-report.txt\`"
              echo "- \`e2e/results/playwright-report.json\` (Playwright's own JSON reporter — source of the flake summary above)"
              echo "- \`e2e/results/playwright-flake-summary.md\` (present even on a clean run — see the flake summary section above)"
              echo "- \`playwright-report/\`"
              echo ""
              echo "### Troubleshooting"
              echo ""
              echo "Open \`quicklog-smoke-report.txt\` first (then the JSON sibling) and find the first \`✗\` line. Use the masked run logs and any uploaded screenshots/videos for additional context."

            else
              echo "- Smoke executed: no (skipped)"
              echo ""
              echo "### Skipped: required Quick Log smoke configuration was unavailable"
              echo ""
              echo "Missing required Quick Log smoke configuration prevented execution."
              echo ""
              echo "Tent + Plant fixture names are required; Grow name is optional."
              echo "Required configuration (names only — values are never printed):"
              echo ""
              echo "- \`vars.E2E_BASE_URL\`"
              echo "- \`vars.E2E_GROW_1_PLANT_URL\`"
              echo "- \`secrets.E2E_TEST_EMAIL\`"
              echo "- \`secrets.E2E_TEST_PASSWORD\`"
              echo "- \`vars.E2E_FIXTURE_MODE\`"
              echo "- \`vars.E2E_FIXTURE_EXPECTED_TENT_NAME\`"
              echo "- \`vars.E2E_FIXTURE_EXPECTED_PLANT_NAME\`"
              echo ""
              echo "Optional configuration (names only — values are never printed):"
              echo ""
              echo "- \`vars.E2E_FIXTURE_EXPECTED_GROW_NAME\`"
              echo ""

              if [ -n "${MISSING_CONFIG}" ]; then
                echo "Missing in this run:"
                echo ""
                # MISSING_CONFIG is a comma-separated list of NAMES only.
                IFS=',' read -ra _names <<< "${MISSING_CONFIG}"
                for n in "${_names[@]}"; do
                  echo "- \`${n}\`"
                done
                echo ""
              fi
              if [ "${EVENT_NAME}" = "pull_request" ] || [ "${EVENT_NAME}" = "push" ]; then
                echo "This is a clean skip for the \`${EVENT_NAME}\` event — forks and branch contexts without access to E2E vars/secrets are expected to skip without failing."
              elif [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
                echo "On \`workflow_dispatch\`, missing required configuration fails fast in the \`Verify required configuration\` step before later steps run. Configure the Actions vars/secrets above and re-dispatch."
              fi
              echo ""
              echo "No smoke artifacts were produced because the smoke did not execute."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
