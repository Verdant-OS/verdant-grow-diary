name: jsonld-rich-results

on:
  pull_request:
    paths:
      - "src/**"
      - "index.html"
      - "scripts/validate-jsonld-rich-results.mjs"
      - "vite.config.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/jsonld-rich-results.yml"
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Cache Bun install cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: Install
        run: bun install --frozen-lockfile
      - name: Build (runs postbuild JSON-LD validator)
        run: bun run build
      - name: Explicit JSON-LD Rich Results check
        run: bun run check:jsonld
      - name: Validator unit tests
        run: bunx vitest run src/test/validate-jsonld-rich-results.test.ts --reporter=dot
