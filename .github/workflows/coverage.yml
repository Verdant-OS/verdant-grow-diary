name: Coverage report

# Merges the raw Istanbul coverage sample that CI's gate shard 1/32 uploads
# (artifact coverage-raw-typescript) into one Cobertura report and uploads it.
# It runs as its own workflow after CI completes, not as jobs inside ci.yml:
# ci.yml holds exactly the 35 unconditional jobs the deploy ruleset requires
# (pinned by src/test/ci-pr-concurrency.test.ts), and coverage reporting is
# best-effort, never a required gate.
#
# workflow_run always runs this file from the default branch with the base
# repository's token, so it only ever checks out and runs default-branch code.
# The downloaded artifact is data (JSON coverage maps), never executed. Fork
# PRs never upload the raw sample, and are skipped here as well.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  merge-coverage-typescript:
    name: Merge coverage sample into Cobertura report
    if: ${{ github.event.workflow_run.conclusion != 'cancelled' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      report-generated: ${{ steps.merge.outcome == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Best-effort: a run without the sample (shard 1 failed, or a fork PR)
      # skips the rest of this workflow instead of failing it.
      - name: Download raw coverage sample (gate shard 1/32)
        id: download-raw-coverage
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: coverage-raw-typescript
          path: coverage-raw
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Merge raw coverage into Cobertura report
        id: merge
        if: steps.download-raw-coverage.outcome == 'success'
        run: node scripts/merge-coverage-reports.mjs coverage-raw coverage-report

      - name: Upload coverage report artifact
        if: steps.merge.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report-typescript
          path: coverage-report/cobertura-coverage.xml
          if-no-files-found: error
          retention-days: 7

  # Separate job, per GitHub's guidance for actions/upload-code-coverage: the
  # upload needs code-quality: write, while the job that produces the report
  # runs repository code and dependencies and should not hold it. The two jobs
  # share only the coverage-report-typescript artifact.
  upload-coverage-typescript:
    name: Upload coverage report (TypeScript)
    needs: merge-coverage-typescript
    if: ${{ needs.merge-coverage-typescript.outputs.report-generated == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      code-quality: write
    steps:
      - name: Download coverage report artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: coverage-report-typescript

      - uses: actions/upload-code-coverage@2b21a77928be8d5168c2b9581a67f2adbebacc52 # v1
        with:
          file: cobertura-coverage.xml
          language: TypeScript
          label: code-coverage-agent
