name: Security regression

# Every PR needs this result, including drafts stacked on another feature branch.
# Filtering PR bases to the deploy branch silently omits the security gate.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [main, verdant-grow-diary]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-security-regression:
    name: test:security-regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      # Cache Bun's global install cache keyed on the text lockfile. Read/write
      # only — never alters what `bun install --frozen-lockfile` resolves.
      - name: Cache Bun install cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type check (fail fast)
        run: bun run typecheck
      - name: Supabase migration safety scan (RLS / SECURITY DEFINER / permissive policies)
        run: bun run check:supabase-security
      - name: Static client/published secret scan
        run: bun run test:security-static
      - name: Bridge sensor-ingest trust-chain evidence
        run: bun run test:bridge-sensor-ingest-evidence
      - name: Gamification direct-insert RLS scan
        run: bun run test:security-gamification
      - name: sensor_readings tent ownership RLS test
        run: bun run test:sensor-readings-tent-ownership
      - name: Payments webhook security tests
        run: bun run test:payments-security
      - name: Storage bucket policy tests
        run: bun run test:storage-security
      - name: Pi-ingest replay resistance tests
        run: bun run test:pi-ingest-security
