name: Security DB Local

# OPTIONAL job — DB-backed security harnesses. Not a required check.
# Required PR gate remains `test:security-regression`. Do not mark this
# job required until it has been stable across multiple PRs.
#
# OPT-IN ONLY. Runs only when explicitly enabled via either:
#   - workflow_dispatch input `run_db_security: true`, or
#   - repository variable ENABLE_DB_SECURITY_LANE == 'true'
# Otherwise all steps are skipped and a summary is written.

on:
  pull_request:
    branches: [main, verdant-grow-diary]
  push:
    branches: [main, verdant-grow-diary]
  workflow_dispatch:
    inputs:
      run_db_security:
        description: "Boot local Supabase and run DB security lane"
        type: boolean
        required: false
        default: false

jobs:
  test-security-db-local:
    name: test:security-db-local
    runs-on: tenki-standard-medium-4c-8g
    timeout-minutes: 25
    # Not a required check, so a red run never blocks the merge queue.
    # Deliberately NOT continue-on-error: that flag rewrote a failing job
    # into a run-level "success" and masked a real base red for a full day
    # (run 30940375065, deploy head ef1173798). Failures must stay visible.
    env:
      ENABLED: ${{ (github.event_name == 'workflow_dispatch' && inputs.run_db_security == true) || vars.ENABLE_DB_SECURITY_LANE == 'true' }}
    steps:
      - name: Skip notice (lane disabled)
        if: env.ENABLED != 'true'
        run: |
          echo "DB security lane is disabled for this run." | tee -a "$GITHUB_STEP_SUMMARY"
          echo "Enable via workflow_dispatch input run_db_security=true," | tee -a "$GITHUB_STEP_SUMMARY"
          echo "or set repository variable ENABLE_DB_SECURITY_LANE=true."   | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        if: env.ENABLED == 'true'

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: env.ENABLED == 'true'
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        if: env.ENABLED == 'true'
        run: bun install --frozen-lockfile

      - name: Setup Supabase CLI
        if: env.ENABLED == 'true'
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v1
        with:
          # Pinned: "latest" resolves through an unauthenticated GitHub API
          # call that rate-limits on shared runners (two fast lane failures
          # on 2026-07-09). Bump deliberately when a newer CLI is needed.
          version: 2.109.1

      - name: Prepare immutable migration replay workspace
        if: env.ENABLED == 'true'
        run: |
          set -eo pipefail
          REPLAY_WORKDIR="${RUNNER_TEMP}/verdant-supabase-replay"
          bun run test:local-supabase-replay
          node scripts/prepare-local-supabase-replay.mjs \
            --output="${REPLAY_WORKDIR}" \
            --json \
            | tee migration-replay-compatibility.json
          echo "SUPABASE_REPLAY_WORKDIR=${REPLAY_WORKDIR}" >> "$GITHUB_ENV"

      - name: Start local Supabase
        if: env.ENABLED == 'true'
        id: supabase-start
        run: |
          set -eo pipefail
          supabase start --workdir "$SUPABASE_REPLAY_WORKDIR" 2>&1 | tee supabase-start.log
          echo "started=true" >> "$GITHUB_OUTPUT"

      - name: Export local Supabase env
        if: env.ENABLED == 'true'
        id: supabase-env
        run: |
          set -e
          STATUS_JSON="$(supabase status --workdir "$SUPABASE_REPLAY_WORKDIR" -o json)"
          SUPABASE_URL="$(echo "$STATUS_JSON" | jq -r '.API_URL // .api_url // empty')"
          SUPABASE_ANON_KEY="$(echo "$STATUS_JSON" | jq -r '.ANON_KEY // .anon_key // empty')"
          SUPABASE_SERVICE_ROLE_KEY="$(echo "$STATUS_JSON" | jq -r '.SERVICE_ROLE_KEY // .service_role_key // empty')"
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "BLOCKED: local Supabase did not expose required keys."
            exit 2
          fi
          # Local-only Postgres URL. Needed by the hardening harness's
          # causation phase, which re-opens an ACL hole and re-applies the
          # migration to prove THAT FILE closes it -- end-state assertions
          # alone are also satisfied by seed.sql. The harness re-verifies
          # loopback before mutating any grant.
          SUPABASE_DB_URL="$(echo "$STATUS_JSON" | jq -r '.DB_URL // .db_url // empty')"
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "BLOCKED: local Supabase did not expose DB_URL; the causation proof cannot run."
            exit 2
          fi
          # Optional. Enables only the restricted-role harness's P3 PostgREST
          # role-claim proof. Read from the STATUS_JSON already fetched above --
          # deliberately NOT a second `supabase status` call, which would break
          # the 4-command lifecycle pin in
          # src/test/local-supabase-replay-compatibility.test.ts. Absent is not
          # fatal: that harness reports P3 BLOCKED, never PASS.
          SUPABASE_JWT_SECRET="$(echo "$STATUS_JSON" | jq -r '.JWT_SECRET // .jwt_secret // empty')"
          if [ -n "$SUPABASE_JWT_SECRET" ]; then
            echo "::add-mask::$SUPABASE_JWT_SECRET"
            echo "SUPABASE_JWT_SECRET=$SUPABASE_JWT_SECRET" >> "$GITHUB_ENV"
          fi
          # Local-only keys. Do NOT echo values.
          echo "SUPABASE_URL=$SUPABASE_URL" >> "$GITHUB_ENV"
          echo "::add-mask::$SUPABASE_ANON_KEY"
          echo "::add-mask::$SUPABASE_SERVICE_ROLE_KEY"
          echo "::add-mask::$SUPABASE_DB_URL"
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_SERVICE_ROLE_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_DB_URL=$SUPABASE_DB_URL" >> "$GITHUB_ENV"

      - name: Apply migrations (db reset with grant-parity seed)
        if: env.ENABLED == 'true'
        # NOT --no-seed: supabase/seed.sql restores the production GRANT
        # baseline that fresh local stacks (hardened default ACL) omit.
        # Without it the harnesses' authenticated setup (tents/profiles
        # inserts) fails with 42501 before any assertion runs. The seed is
        # local-only and never touches the hosted project. See
        # docs/security-regression-tests.md.
        run: |
          set -o pipefail
          supabase db reset --workdir "$SUPABASE_REPLAY_WORKDIR" 2>&1 | tee supabase-db-reset.log

      - name: Profiles DB security
        if: env.ENABLED == 'true'
        id: profiles-db
        run: |
          set -o pipefail
          bun run test:profiles-db-security 2>&1 | tee profiles-db.log

      - name: Customer Mode isolation
        if: env.ENABLED == 'true'
        id: customer-mode-db
        run: |
          set -o pipefail
          bun run test:customer-mode-db-security 2>&1 | tee customer-mode-db.log

      - name: Subscriber interest RLS
        if: env.ENABLED == 'true'
        id: subscriber-interest-db
        run: |
          set -o pipefail
          bun run test:subscriber-interest-db-security 2>&1 | tee subscriber-interest-db.log

      - name: Public support forms RLS
        if: env.ENABLED == 'true'
        id: public-support-forms-db
        run: |
          set -o pipefail
          bun run test:public-support-forms-db-security 2>&1 | tee public-support-forms-db.log

      - name: AI Doctor sessions RLS
        if: env.ENABLED == 'true'
        id: ai-doctor-sessions-rls
        env:
          AI_DOCTOR_SESSIONS_RLS_HARNESS: "1"
        run: |
          set -o pipefail
          bun run test:ai-doctor-sessions-rls 2>&1 | tee ai-doctor-sessions-rls.log

      - name: Bridge tokens RLS + revocation integrity (strict)
        if: env.ENABLED == 'true'
        id: bridge-tokens-db
        env:
          # Strict mode: unreachable DB, replay failure, or any skipped test
          # is a hard FAIL — skipping never counts as proof in this lane.
          BRIDGE_TOKENS_DB_SECURITY_REQUIRED: "1"
        run: |
          set -o pipefail
          bun run test:bridge-tokens-db-security 2>&1 | tee bridge-tokens-db.log

      - name: Restricted-role Phase 1 proof (GAP-PGROLE-001)
        if: env.ENABLED == 'true'
        id: restricted-role
        run: |
          set -o pipefail
          bun run test:restricted-role 2>&1 | tee restricted-role.log

      - name: Aggregate DB security lane
        if: env.ENABLED == 'true'
        id: aggregate
        run: |
          set -o pipefail
          bun run test:security-db-local 2>&1 | tee security-db-local.log

      - name: Upload failure artifacts
        if: failure() && env.ENABLED == 'true'
        id: upload-artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-db-local-artifacts
          path: |
            supabase-start.log
            supabase-db-reset.log
            migration-replay-compatibility.json
            ${{ runner.temp }}/verdant-supabase-replay/local-supabase-replay-report.json
            profiles-db.log
            customer-mode-db.log
            subscriber-interest-db.log
            public-support-forms-db.log
            ai-doctor-sessions-rls.log
            bridge-tokens-db.log
            security-db-local.log
            test-results/**
            artifacts/security-db/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Write job summary
        if: always()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set +e
          {
            echo "## Security DB Local"
            echo ""
            if [ "${ENABLED:-false}" != "true" ]; then
              echo "**Status:** disabled"
              echo ""
              echo "Lane is opt-in. Enable via workflow_dispatch input"
              echo "\`run_db_security=true\` or repo variable"
              echo "\`ENABLE_DB_SECURITY_LANE=true\`."
            else
              case "$JOB_STATUS" in
                success) echo "**Status:** passed" ;;
                failure) echo "**Status:** failed" ;;
                cancelled) echo "**Status:** cancelled" ;;
                *) echo "**Status:** $JOB_STATUS" ;;
              esac
              echo ""
              echo "**Tests requested:**"
              echo "- immutable migration replay compatibility verification"
              echo "- profiles DB security (\`test:profiles-db-security\`)"
              echo "- customer mode isolation (\`test:customer-mode-db-security\`)"
              echo "- subscriber interest RLS (\`test:subscriber-interest-db-security\`)"
              echo "- public support forms RLS (\`test:public-support-forms-db-security\`)"
              echo "- AI Doctor sessions RLS (\`test:ai-doctor-sessions-rls\`)"
              echo "- bridge tokens RLS + revocation integrity, strict zero-skip mode (\`test:bridge-tokens-db-security\`)"
              echo "- VPD calibration provenance RLS (via aggregate lane)"
              echo "- aggregate lane (\`test:security-db-local\`)"
              echo ""
              echo "**Artifact:** \`security-db-local-artifacts\` (uploaded on failure only, 14-day retention)"
              echo ""
              echo "Artifact paths (when uploaded):"
              echo "- \`migration-replay-compatibility.json\`, \`local-supabase-replay-report.json\`"
              echo "- \`profiles-db.log\`, \`customer-mode-db.log\`, \`subscriber-interest-db.log\`, \`public-support-forms-db.log\`, \`ai-doctor-sessions-rls.log\`, \`security-db-local.log\`"
              echo "- \`supabase-start.log\`, \`supabase-db-reset.log\` (sanitized)"
              echo "- \`test-results/\`, \`artifacts/security-db/\` (if produced)"
              echo ""
              if [ "$JOB_STATUS" != "failure" ]; then
                echo "_No failure artifacts uploaded for this run._"
              fi
            fi
            echo ""
            echo "**Run:** ${RUN_URL}"
            echo ""
            echo "_Summary contains no secrets, service-role values, JWTs, or DB URLs._"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stop local Supabase
        if: always() && env.ENABLED == 'true'
        run: supabase stop --workdir "$SUPABASE_REPLAY_WORKDIR" --no-backup || true