name: Grow Walk MCP codegen artifact

on:
  push:
    branches:
      - codex/verdant-grow-walk-v0
    paths:
      - src/lib/mcp/**
      - src/lib/growWalk*.ts
      - .github/workflows/grow-walk-mcp-codegen-artifact.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run the repository MCP generator
        id: codegen
        shell: bash
        run: |
          set +e
          bunx vite build
          status=$?
          echo "vite_status=$status" >> "$GITHUB_OUTPUT"
          test -s .lovable/mcp/manifest.json
          test -s supabase/functions/mcp/index.ts
          grep -q 'list_grow_walk_targets' .lovable/mcp/manifest.json
          grep -q 'get_grow_walk_context' .lovable/mcp/manifest.json
          grep -q 'list_grow_walk_targets' supabase/functions/mcp/index.ts
          grep -q 'get_grow_walk_context' supabase/functions/mcp/index.ts

      - name: Record generated diff
        shell: bash
        run: |
          git diff -- .lovable/mcp/manifest.json supabase/functions/mcp/index.ts > /tmp/grow-walk-mcp-generated.diff
          {
            echo "### Grow Walk MCP codegen"
            echo
            echo "Vite exit: ${{ steps.codegen.outputs.vite_status }}"
            echo
            echo '```text'
            git diff --stat -- .lovable/mcp/manifest.json supabase/functions/mcp/index.ts
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload generated files
        uses: actions/upload-artifact@v4
        with:
          name: grow-walk-mcp-generated
          if-no-files-found: error
          retention-days: 1
          path: |
            .lovable/mcp/manifest.json
            supabase/functions/mcp/index.ts
            /tmp/grow-walk-mcp-generated.diff
