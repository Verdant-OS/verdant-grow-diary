name: ESLint

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    name: eslint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run ESLint (fail on any error)
        run: bun run lint
