name: One-Tent Loop smoke test

on:
  push:
    branches: [main]
  pull_request:
    paths-ignore:
      - "src/lib/ggsSentinelSmokeRunner.ts"
      - "src/components/GgsSentinelSmokeRunnerPanel.tsx"
      - "src/test/ggs-sentinel-*.test.ts"
      - "src/test/ggs-sentinel-*.test.tsx"
  workflow_dispatch:

jobs:
  one-tent-loop-smoke:
    name: One-Tent Loop smoke audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: One-Tent Loop smoke audit
        run: bun run test:one-tent-loop-smoke

      # Narrow safety gate — every PR runs the rules + deterministic
      # telemetry fuzz suite for /one-tent-loop-proof. Regressions where
      # malformed / stale / invalid / demo / unknown telemetry could be
      # classified as passed, direct, healthy, OK, verified, or success
      # must fail CI here.
      - name: One-Tent Loop Proof never-healthy rules + fuzz
        run: bun run test:one-tent-loop-proof-never-healthy

      - name: EcoWitt-only sensor direction scanner
        run: node scripts/assert-ecowitt-only-sensor-direction.mjs

      - name: Sensor Intelligence safety scanner
        run: bun run test:sensor-intelligence-safety

      - name: VPD stage mapping ownership scanner
        run: bun run test:vpd-stage-normalization-ownership
