name: Secret scan

# CLI only. gitleaks-action needs a license secret, so this job does not use it.
# Matches stay in the redacted job log and are never uploaded.

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Install gitleaks v8.30.1
        run: |
          set -euo pipefail
          archive="gitleaks_8.30.1_linux_x64.tar.gz"
          curl -sSfL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/${archive}"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  ${archive}" | sha256sum -c
          tar -xzf "$archive" gitleaks
          mkdir -p "$HOME/.local/bin"
          install -m 0755 gitleaks "$HOME/.local/bin/gitleaks"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          rm -f gitleaks "$archive"

      - name: Resolve scan range
        id: range
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          MERGE_GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          MERGE_GROUP_HEAD: ${{ github.event.merge_group.head_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
          PUSH_DELETED: ${{ github.event.deleted }}
          PUSH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail

          require_sha() {
            if ! printf '%s' "$1" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "scan bound is not a 40-character sha" >&2
              exit 1
            fi
          }

          is_zero_sha() {
            printf '%s' "$1" | grep -Eq '^0{40}$'
          }

          base_tip() {
            git fetch --no-tags origin +refs/heads/verdant-grow-diary:refs/remotes/origin/verdant-grow-diary
            git rev-parse --verify refs/remotes/origin/verdant-grow-diary
          }

          skip=false
          case "$EVENT_NAME" in
            pull_request)
              require_sha "$PR_BASE"
              require_sha "$PR_HEAD"
              range="${PR_BASE}..${PR_HEAD}"
              policy_ref="$PR_BASE"
              ;;
            merge_group)
              require_sha "$MERGE_GROUP_BASE"
              require_sha "$MERGE_GROUP_HEAD"
              range="${MERGE_GROUP_BASE}..${MERGE_GROUP_HEAD}"
              policy_ref="$MERGE_GROUP_BASE"
              ;;
            push)
              # A deleted branch or tag has no new commits to scan.
              if [ "$PUSH_DELETED" = "true" ] || is_zero_sha "$PUSH_AFTER"; then
                echo "ref deleted; nothing to scan"
                skip=true
                range=""
                policy_ref=""
              else
                require_sha "$PUSH_AFTER"
                # A force-push may have dropped the old tip from this clone.
                # Fetch it so policy and the range can stay on that commit.
                if printf '%s' "${PUSH_BEFORE:-}" | grep -Eq '^[0-9a-f]{40}$' \
                  && ! is_zero_sha "$PUSH_BEFORE" \
                  && ! git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
                  git fetch --no-tags origin "$PUSH_BEFORE" 2>/dev/null || true
                fi
                if [ "${PUSH_REF:-}" = "refs/heads/verdant-grow-diary" ]; then
                  # origin/verdant-grow-diary is already PUSH_AFTER. Reading
                  # policy from it would let this push allowlist its own leak.
                  if ! is_zero_sha "${PUSH_BEFORE:-}" \
                    && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
                    policy_ref="$PUSH_BEFORE"
                  else
                    policy_ref="$(git hash-object -t tree /dev/null)"
                  fi
                else
                  policy_ref="$(base_tip)"
                fi
                require_sha "$policy_ref"
                if is_zero_sha "${PUSH_BEFORE:-}" || ! git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
                  # New branch, or force-push whose old tip is gone.
                  base="$(git merge-base "$policy_ref" "$PUSH_AFTER" 2>/dev/null || true)"
                  if [ -n "$base" ] && [ "$base" != "$PUSH_AFTER" ]; then
                    require_sha "$base"
                    range="${base}..${PUSH_AFTER}"
                  elif [ -n "$base" ] && [ "${PUSH_REF:-}" != "refs/heads/verdant-grow-diary" ]; then
                    # Tip is already contained in the base branch.
                    require_sha "$base"
                    range="${base}..${PUSH_AFTER}"
                  else
                    # merge-base failed, or the default-branch tip collapsed
                    # onto itself. A bare sha walks every ancestor, and
                    # SHA..SHA scans nothing.
                    range="-1 ${PUSH_AFTER}"
                  fi
                else
                  require_sha "$PUSH_BEFORE"
                  range="${PUSH_BEFORE}..${PUSH_AFTER}"
                fi
              fi
              ;;
            *)
              echo "unsupported event" >&2
              exit 1
              ;;
          esac

          {
            echo "skip=${skip}"
            echo "policy_ref=${policy_ref}"
            echo "range<<EOF"
            printf '%s\n' "$range"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Policy (config, baseline, ignore list) comes from the base branch, never
      # from the commits under scan, so a change cannot allowlist its own leak.
      - name: Load scan policy from base
        id: policy
        if: steps.range.outputs.skip != 'true'
        env:
          POLICY_REF: ${{ steps.range.outputs.policy_ref }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/gitleaks-policy"
          mkdir -p "$dir"
          if git cat-file -e "${POLICY_REF}:.gitleaks.toml" 2>/dev/null; then
            git show "${POLICY_REF}:.gitleaks.toml" > "$dir/gitleaks.toml"
          else
            printf '[extend]\nuseDefault = true\n' > "$dir/gitleaks.toml"
          fi
          if git cat-file -e "${POLICY_REF}:.gitleaks-baseline.json" 2>/dev/null; then
            git show "${POLICY_REF}:.gitleaks-baseline.json" > "$dir/baseline.json"
          else
            echo '[]' > "$dir/baseline.json"
          fi
          if git cat-file -e "${POLICY_REF}:.gitleaksignore" 2>/dev/null; then
            git show "${POLICY_REF}:.gitleaksignore" > "$dir/.gitleaksignore"
          else
            : > "$dir/.gitleaksignore"
          fi
          echo "dir=${dir}" >> "$GITHUB_OUTPUT"

      - name: Scan commits
        if: steps.range.outputs.skip != 'true'
        env:
          RANGE: ${{ steps.range.outputs.range }}
          POLICY_DIR: ${{ steps.policy.outputs.dir }}
        run: |
          set -euo pipefail
          # --remerge-diff shows lines a merge resolution added, as a normal
          # unified diff gitleaks can parse. -m replays each parent, so
          # base-branch secrets are attributed to the merge commit and miss
          # the baseline. --cc hides those parents, but gitleaks 8.30.1 does
          # not parse combined diffs.
          gitleaks git --redact --no-banner --exit-code 1 \
            --config "$POLICY_DIR/gitleaks.toml" \
            --baseline-path "$POLICY_DIR/baseline.json" \
            --gitleaks-ignore-path "$POLICY_DIR/.gitleaksignore" \
            --log-opts="--remerge-diff ${RANGE}"
