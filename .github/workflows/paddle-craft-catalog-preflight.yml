name: Paddle Craft catalog preflight

# Verifies that craft_monthly and craft_annual price external_ids exist
# (and are active) in both Paddle sandbox and live before a change can be
# merged or deployed. Read-only against the Paddle API.
#
# Fails the PR / deploy if either env is missing an entry — this is the
# structural gate that prevents shipping Craft CTAs the catalog can't
# fulfill (sandbox: blocks at price resolution; live: risks a charge with
# no entitlement grant via payments-webhook's KNOWN_PRICE_IDS filter).
#
# Required repo secrets:
#   PADDLE_SANDBOX_API_KEY   — Paddle sandbox API key (read scope suffices)
#   PADDLE_LIVE_API_KEY      — Paddle live API key    (read scope suffices)

on:
  pull_request:
    paths:
      - "src/lib/paidPlanAllowlist.ts"
      - "src/lib/paddle.ts"
      - "src/lib/checkoutPlanIntent.ts"
      - "supabase/functions/get-paddle-price/**"
      - "supabase/functions/payments-webhook/**"
      - "scripts/verify-paddle-craft-catalog.ts"
      - ".github/workflows/paddle-craft-catalog-preflight.yml"
  workflow_dispatch:
  schedule:
    # Nightly, so an out-of-band archive/delete in the Paddle dashboard
    # surfaces within 24h instead of waiting for the next Craft PR.
    - cron: "17 8 * * *"

concurrency:
  # One preflight per PR. Without this, two overlapping `synchronize` runs
  # race on the sticky comment: the older run can finish last and PATCH its
  # result over the newer one, leaving a stale — possibly green — verdict
  # attached to a commit that failed. Mirrors deployment-preview.yml.
  #
  # The `|| github.ref` fallback keeps the nightly and workflow_dispatch runs
  # in their own group, so a PR run can never cancel the scheduled sweep that
  # exists to catch an out-of-band archive in the Paddle dashboard.
  group: paddle-craft-catalog-preflight-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Needed only to post/refresh the sticky failure comment on a PR. The
  # nightly and workflow_dispatch runs never reach that step.
  pull-requests: write

jobs:
  paddle-craft-catalog-preflight:
    name: Paddle Craft catalog preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Verify Craft price catalog (sandbox + live)
        id: preflight
        env:
          PADDLE_SANDBOX_API_KEY: ${{ secrets.PADDLE_SANDBOX_API_KEY }}
          PADDLE_LIVE_API_KEY: ${{ secrets.PADDLE_LIVE_API_KEY }}
        run: |
          set +e
          # Capture BOTH streams. The "API key not set" path writes its
          # ::error:: to stderr and exits before printing any per-id line, so
          # a stdout-only capture loses every trace of why nothing ran.
          bun run scripts/verify-paddle-craft-catalog.ts --env both \
            > "$RUNNER_TEMP/craft-preflight.log" 2>&1
          RC=$?
          set -e
          cat "$RUNNER_TEMP/craft-preflight.log"
          {
            echo "### Paddle Craft catalog preflight"
            echo ""
            echo '```'
            cat "$RUNNER_TEMP/craft-preflight.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "rc=$RC" >> "$GITHUB_OUTPUT"

          # Whether the ONLY reason we could not verify is an absent API key.
          #
          # Two conditions, both required. "A key was missing" alone is NOT
          # sufficient: with the sandbox key set and the live key absent, a
          # real sandbox catalog failure is recorded and THEN the run exits 2
          # on reaching live. Keying the exception off the message alone would
          # wave that confirmed failure through as green — the exact
          # false-green this exception was written to avoid creating.
          #
          # So it is also gated on the structured summary reporting zero
          # failures. `fail=` comes from the script's own SUMMARY line, which
          # counts results rather than log text.
          FAILCOUNT=$(sed -nE 's/.*SUMMARY: pass=[0-9]+ fail=([0-9]+) skip=[0-9]+.*/\1/p' \
            "$RUNNER_TEMP/craft-preflight.log" | tail -n1)
          echo "failcount=${FAILCOUNT:-unknown}" >> "$GITHUB_OUTPUT"
          if grep -qE '_API_KEY is not set' "$RUNNER_TEMP/craft-preflight.log" \
             && [ "${FAILCOUNT:-}" = "0" ]; then
            echo "unconfigured=true" >> "$GITHUB_OUTPUT"
          else
            echo "unconfigured=false" >> "$GITHUB_OUTPUT"
          fi
          # Do NOT exit here. The enforcement step below decides, so a
          # missing repo secret does not red every unrelated checkout PR.

      # Summarise the outcome on the PR itself. Runs even when the check
      # failed, so the comment appears exactly when it is most useful.
      #
      # PRIVACY: the comment is built ONLY from the parsed `external_id` +
      # environment of non-passing lines. The raw log is deliberately NOT
      # echoed here — a passing line's detail embeds the Paddle internal
      # price id (`pri_...`), which has no business in PR chatter. The step
      # summary above (run-scoped, not a comment) keeps the full log.
      # `!cancelled()` rather than `always()`: cancel-in-progress narrows the
      # race but does not close it, because `always()` also fires on a
      # CANCELLED run — so a superseded run could still PATCH its stale
      # verdict on the way out. This runs on success and on failure, never on
      # cancellation.
      #
      # Same-repository head only. A fork PR gets a read-only GITHUB_TOKEN and
      # no secrets, so `gh pr comment` / PATCH would 403 and red the run —
      # turning the deliberately non-blocking "secrets absent" case into a
      # hard failure for exactly the contributors who can least fix it. The
      # step summary still carries the full result for those runs.
      - name: Comment Craft catalog failures on the PR
        if: >-
          ${{ !cancelled()
            && github.event_name == 'pull_request'
            && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RC: ${{ steps.preflight.outputs.rc }}
        run: |
          set -euo pipefail
          MARKER="<!-- paddle-craft-catalog-preflight -->"
          LOG="$RUNNER_TEMP/craft-preflight.log"
          # No log means the run died before the verifier ever executed (a
          # checkout or Bun-setup failure). Returning early here would leave a
          # previous run's green marker comment standing, so the PR would keep
          # advertising "verified" for a run that verified nothing. Fall
          # through with an empty log: RC is empty too, so the case below
          # renders the treat-as-unverified state and PATCHes the existing
          # comment rather than abandoning it.
          [ -f "$LOG" ] || { echo "No preflight log — reporting as unverified."; : > "$LOG"; }

          # Classify each non-passing line by its DETAIL, not just its glyph.
          # A `✗` can mean the catalog genuinely lacks the price, OR that the
          # Paddle API refused us (auth / rate limit / 5xx). Collapsing those
          # into "missing or inactive" sends an operator to create a price
          # when the real fix is a credential or waiting out an outage.
          # Only the HTTP status is surfaced — never the response body, which
          # can echo request context.
          ROWS=$(awk -F' — ' '
            /^✗ / {
              hdr = $1; sub(/^✗ +/, "", hdr)
              env = hdr; sub(/^\[/, "", env); sub(/\].*$/, "", env)
              id  = hdr; sub(/^\[[^]]*\] */, "", id)
              d = $2
              if (d ~ /^Paddle API /) {
                code = d; sub(/^Paddle API /, "", code); sub(/:.*$/, "", code)
                state = "API error (HTTP " code ") — check credentials / Paddle status"
              } else if (d ~ /none are active/) {
                state = "present but not active (archived?)"
              } else {
                state = "missing from catalog"
              }
              printf "| `%s` | %s | %s |\n", id, env, state
            }
            /^• / {
              hdr = $1; sub(/^• +/, "", hdr)
              env = hdr; sub(/^\[/, "", env); sub(/\].*$/, "", env)
              id  = hdr; sub(/^\[[^]]*\] */, "", id)
              printf "| `%s` | %s | not verified — API key unset |\n", id, env
            }
          ' "$LOG" || true)

          # The EXIT CODE is authoritative, never the presence of parsed rows.
          # The key-unset path exits 2 having printed no per-id line at all, so
          # "no rows" previously rendered as a green "verified" on a failed
          # run — the exact false-green this gate exists to prevent.
          case "${RC:-}" in
            0)
              STATUS="✅ **Craft catalog verified** — every required price exists and is active in both environments."
              ;;
            1)
              STATUS="❌ **Craft catalog incomplete.** At least one advertised Craft price is missing, inactive, or could not be read. Shipping this risks a live charge that \`payments-webhook\` cannot convert into an entitlement."
              ;;
            2)
              STATUS="⚠️ **Craft catalog NOT verified.** A required API key is unset (or the invocation was malformed), so the catalog was never checked. **This is not a pass.**"
              ;;
            *)
              STATUS="⚠️ **Craft catalog preflight did not complete** (exit \`${RC:-unknown}\`). Treat as unverified."
              ;;
          esac

          if [ -n "$ROWS" ]; then
            TABLE=$(printf '| external_id | environment | state |\n| --- | --- | --- |\n%s\n' "$ROWS")
          elif [ "${RC:-}" != "0" ]; then
            TABLE="_No per-price detail was produced — the run stopped before reaching the catalog. See the workflow run for the reason._"
          else
            TABLE=""
          fi

          # Remedies differ per outcome; a single blanket "create the price"
          # line was wrong for both the credential and the not-run cases.
          case "${RC:-}" in
            0) FIX="" ;;
            2) FIX="Fix: set the missing \`PADDLE_SANDBOX_API_KEY\` / \`PADDLE_LIVE_API_KEY\` repo secret, then re-run." ;;
            *) FIX="Fix: for a missing/inactive entry, create or re-activate the price in the Paddle dashboard with the matching \`external_id\`, or stop advertising the plan until it exists. For an API error, check the credential and Paddle status before assuming the catalog is at fault." ;;
          esac

          BODY=$(printf '%s\n### Paddle Craft catalog preflight\n\n%s\n\n%s\n\n%s\n\n- Exit code: `%s` (0 pass · 1 missing/inactive/unreadable · 2 not verified)\n- Workflow run: %s\n' \
            "$MARKER" "$STATUS" "$TABLE" "$FIX" "${RC:-unknown}" "$RUN_URL")

          # Idempotent: patch the existing marker comment rather than stacking.
          # Match on the marker AND the bot author. The marker alone is
          # user-forgeable: anyone can post it before this workflow first
          # runs, and the PATCH of another user's comment fails — permanently
          # wedging the step for that PR. Restricting to our own bot means a
          # planted marker is ignored and a fresh comment is posted instead.
          EXISTING=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            -q ".[] | select(.user.login == \"github-actions[bot]\")
                    | select(.body | contains(\"$MARKER\")) | .id" | head -n1)
          if [ -n "$EXISTING" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$EXISTING" -f body="$BODY" >/dev/null
            echo "Updated Craft catalog comment $EXISTING."
          else
            gh pr comment "$PR" --repo "$REPO" --body "$BODY"
            echo "Posted Craft catalog comment on PR #$PR."
          fi

      # Enforcement is separated from execution so the gate can be honest
      # about WHY it could not verify.
      #
      # A catalog that is genuinely wrong (exit 1) fails hard — that is the
      # whole point of the gate. But an absent PADDLE_*_API_KEY repo secret is
      # a repository configuration state, not a defect in the pull request,
      # and failing every checkout-touching PR for it would train reviewers to
      # ignore this check — which is exactly how two genuinely-red suites sat
      # unnoticed on the deploy branch.
      #
      # The comment still says "NOT VERIFIED … This is not a pass", and this
      # step still emits a ::warning::, so the unverified state stays visible
      # rather than being silently downgraded to green. The moment the secrets
      # exist, this branch stops being reachable and the gate blocks for real.
      - name: Enforce catalog result
        # Same reasoning as the comment step: a superseded, cancelled run must
        # not report a verdict at all.
        if: ${{ !cancelled() }}
        env:
          RC: ${{ steps.preflight.outputs.rc }}
          UNCONFIGURED: ${{ steps.preflight.outputs.unconfigured }}
        run: |
          set -euo pipefail
          case "${RC:-}" in
            0)
              echo "Craft catalog verified in every requested environment."
              ;;
            2)
              if [ "${UNCONFIGURED:-}" = "true" ]; then
                echo "::warning::Craft catalog NOT verified — PADDLE_SANDBOX_API_KEY / PADDLE_LIVE_API_KEY are not configured. This is not a pass; it is not blocking only because no PR can fix a missing repo secret. Configure the secrets before Craft goes on sale."
                exit 0
              fi
              echo "::error::Craft catalog preflight was misconfigured (exit 2) for a reason other than a missing API key — see the log."
              exit 1
              ;;
            "")
              echo "::error::Craft catalog preflight did not run to completion; treat as unverified."
              exit 1
              ;;
            *)
              echo "::error::Craft catalog check failed (exit ${RC}). An advertised Craft price is missing, inactive, or unreadable."
              exit 1
              ;;
          esac
