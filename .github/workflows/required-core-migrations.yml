name: Required core schema present

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "scripts/lib/supabaseDatabaseTargetIdentity.mjs"
      - "scripts/assert-required-core-migrations.mjs"
      - "scripts/assert-required-core-migrations-applied.mjs"
      - "scripts/required-core-migrations.mjs"
      - "src/test/required-core-migrations-gate.test.ts"
      - ".github/workflows/required-core-migrations.yml"
  push:
    branches:
      - verdant-grow-diary
  workflow_dispatch:
    inputs:
      target_env:
        description: Pinned Supabase database to verify
        type: choice
        required: true
        default: sandbox
        options:
          - sandbox
          - production

permissions:
  contents: read

concurrency:
  group: required-core-schema-${{ github.event_name }}-${{ github.ref }}-${{ inputs.target_env || 'none' }}
  cancel-in-progress: false

jobs:
  # This is the only pull-request job. It is deliberately offline and has no
  # environment or secret reference, so untrusted PR code never receives a
  # remote database credential.
  manifest-and-files:
    name: Core schema manifest and migration files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run focused gate tests
        run: bunx vitest run src/test/required-core-migrations-gate.test.ts --reporter=dot
      - name: Assert migration files remain in history
        run: node scripts/assert-required-core-migrations.mjs

  # Configure this GitHub environment with required reviewers/branch
  # restrictions and an environment-scoped SUPABASE_DB_URL secret.
  verify-sandbox:
    name: Verify pinned Verdant sandbox schema
    needs: manifest-and-files
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/verdant-grow-diary' && inputs.target_env == 'sandbox' }}
    runs-on: ubuntu-latest
    environment: verdant-sandbox
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Prepare audit directory
        run: mkdir -p "${{ github.workspace }}/audit/core-sandbox"
      - name: Verify blocking core schema
        env:
          TARGET_ENV: sandbox
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          REPORT_PATH: ${{ github.workspace }}/audit/core-sandbox/core-report.md
          AUDIT_PATH: ${{ github.workspace }}/audit/core-sandbox/core-audit.json
        run: node scripts/assert-required-core-migrations-applied.mjs
      - name: Verify advisory schema
        id: advisory
        if: always()
        continue-on-error: true
        env:
          TARGET_ENV: sandbox
          MANIFEST_SCOPE: advisory
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          REPORT_PATH: ${{ github.workspace }}/audit/core-sandbox/advisory-report.md
          AUDIT_PATH: ${{ github.workspace }}/audit/core-sandbox/advisory-audit.json
        run: node scripts/assert-required-core-migrations-applied.mjs
      - name: Publish sanitized reports
        if: always()
        run: |
          for report in "${{ github.workspace }}"/audit/core-sandbox/*-report.md; do
            if [ -f "$report" ]; then
              cat "$report" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          if [ "${{ steps.advisory.outcome }}" = "failure" ]; then
            echo "::warning title=Advisory schema drift::The pinned sandbox is missing advisory schema. Core release blocking remains determined by the core step."
          fi
      - name: Upload sanitized audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: required-core-schema-sandbox
          path: audit/core-sandbox
          if-no-files-found: error

  # Production is reachable only from the trusted deploy-branch push or an
  # explicit manual dispatch, and uses a separate protected environment.
  verify-production:
    name: Verify pinned Verdant production schema
    needs: manifest-and-files
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/verdant-grow-diary') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/verdant-grow-diary' && inputs.target_env == 'production') }}
    runs-on: ubuntu-latest
    environment: verdant-production
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Prepare audit directory
        run: mkdir -p "${{ github.workspace }}/audit/core-production"
      - name: Verify blocking core schema
        env:
          TARGET_ENV: production
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          REPORT_PATH: ${{ github.workspace }}/audit/core-production/core-report.md
          AUDIT_PATH: ${{ github.workspace }}/audit/core-production/core-audit.json
        run: node scripts/assert-required-core-migrations-applied.mjs
      - name: Verify advisory schema
        id: advisory
        if: always()
        continue-on-error: true
        env:
          TARGET_ENV: production
          MANIFEST_SCOPE: advisory
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          REPORT_PATH: ${{ github.workspace }}/audit/core-production/advisory-report.md
          AUDIT_PATH: ${{ github.workspace }}/audit/core-production/advisory-audit.json
        run: node scripts/assert-required-core-migrations-applied.mjs
      - name: Publish sanitized reports
        if: always()
        run: |
          for report in "${{ github.workspace }}"/audit/core-production/*-report.md; do
            if [ -f "$report" ]; then
              cat "$report" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          if [ "${{ steps.advisory.outcome }}" = "failure" ]; then
            echo "::warning title=Advisory schema drift::The pinned production database is missing advisory schema. Core release blocking remains determined by the core step."
          fi
      - name: Upload sanitized audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: required-core-schema-production
          path: audit/core-production
          if-no-files-found: error
