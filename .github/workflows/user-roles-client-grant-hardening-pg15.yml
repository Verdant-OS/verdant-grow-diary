name: user_roles client grant hardening PG15 and PG17

on:
  pull_request:
    paths: &user_roles_grants_paths
      - "supabase/migrations/20260925090000_user_roles_client_grant_hardening.sql"
      - "supabase/migrations/20260517010926_65004f70-4e2c-48b3-bfcb-37bb8d2f0040.sql"
      - "scripts/run-user-roles-client-grant-hardening-pg15-harness.mjs"
      - "src/test/user-roles-client-grant-hardening-migration.test.ts"
      - ".github/workflows/user-roles-client-grant-hardening-pg15.yml"
  push:
    branches:
      - verdant-grow-diary
    paths: *user_roles_grants_paths
  merge_group:

permissions:
  contents: read

jobs:
  pg15_runtime:
    name: PostgreSQL 15 runtime contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15.18@sha256:bb0df8b69f086efa2cbe4b8128df2f368a362bbdadef743731a63dd0f2f24c9e
        env: &user_roles_grants_postgres_env
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: verdant-runtime-only
          POSTGRES_DB: verdant_user_roles_grants
        ports: &user_roles_grants_postgres_ports
          - 5432:5432
        options: &user_roles_grants_postgres_options >-
          --health-cmd "pg_isready -U postgres -d verdant_user_roles_grants"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      USER_ROLES_GRANTS_PG15_URL: postgresql://postgres:verdant-runtime-only@127.0.0.1:5432/verdant_user_roles_grants
      USER_ROLES_GRANTS_PG_MAJOR: "15"
    steps: &user_roles_grants_runtime_steps
      - name: Checkout exact candidate
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"

      - name: Install and verify PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client
          psql --version

      - name: Create disposable PostgreSQL harness sentinel
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: verdant-runtime-only
          PGDATABASE: verdant_user_roles_grants
        run: |
          psql -X -q -v ON_ERROR_STOP=1 --single-transaction --file=- <<'SQL'
          create schema verdant_user_roles_grants_harness authorization postgres;
          revoke all on schema verdant_user_roles_grants_harness from public;
          create table verdant_user_roles_grants_harness.runtime_sentinel (
            sentinel text primary key
          );
          revoke all on table verdant_user_roles_grants_harness.runtime_sentinel from public;
          insert into verdant_user_roles_grants_harness.runtime_sentinel(sentinel)
          values ('verdant_user_roles_grants_pg15_disposable_v1');
          SQL

      - name: Run isolated PostgreSQL runtime harness
        run: node scripts/run-user-roles-client-grant-hardening-pg15-harness.mjs

  # Production runs PostgreSQL 17, where the browser roles also hold MAINTAIN.
  # Only this job executes the migration's MAINTAIN branch and the harness's
  # PostgreSQL 17 proofs.
  pg17_runtime:
    name: PostgreSQL 17 runtime contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.6@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
        env: *user_roles_grants_postgres_env
        ports: *user_roles_grants_postgres_ports
        options: *user_roles_grants_postgres_options
    env:
      USER_ROLES_GRANTS_PG15_URL: postgresql://postgres:verdant-runtime-only@127.0.0.1:5432/verdant_user_roles_grants
      USER_ROLES_GRANTS_PG_MAJOR: "17"
    steps: *user_roles_grants_runtime_steps
