name: sitemap-robots-parity

on:
  pull_request:
    paths:
      - "public/sitemap.xml"
      - "public/robots.txt"
      - "scripts/check-sitemap-robots-parity.mjs"
      - ".github/workflows/sitemap-robots-parity.yml"
  push:
    branches: [main]
    paths:
      - "public/sitemap.xml"
      - "public/robots.txt"
      - "scripts/check-sitemap-robots-parity.mjs"

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Verify sitemap ↔ robots.txt parity
        run: node scripts/check-sitemap-robots-parity.mjs
