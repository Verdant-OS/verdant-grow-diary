name: sitemap-robots-parity

on:
  pull_request:
  push:
    branches: [main, verdant-grow-diary]

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Verify generated sitemap ↔ robots.txt crawl contract
        run: bun run check:sitemap-robots
