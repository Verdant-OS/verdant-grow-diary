name: Dependency & Security CI

on:
  workflow_dispatch:
  merge_group:
  push:
    branches: [verdant-grow-diary]
  pull_request:
    branches: [verdant-grow-diary]

# Read-only workflow: no secrets used, no artifacts uploaded that could
# contain tokens. See scripts/check-dependency-security.mjs for the
# redaction contract on any surfaced audit text.
permissions:
  contents: read

jobs:
  security:
    name: Lockfile policy, dependency audit, typecheck, build, tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      # Cache Bun's global install cache. Keyed on the text lockfile so
      # `bun install --frozen-lockfile` still resolves the same tree.
      - name: Cache Bun install cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      # 1. bun.lock stays canonical. package-lock.json remains synchronized
      #    only for the owned, dated npm-consumer transition contract.
      - name: Lockfile policy check
        run: bun run check:lockfile

      - name: npm compatibility lock semantic check
        run: bun run check:npm-lock-semantic

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      # 2. Dual Bun + npm compatibility-lock security scan. npm propagation
      #    metadata is normalized to atomic advisories before the same exact,
      #    expiring exception policy is applied to both sources.
      - name: Dependency security scan
        run: bun run check:deps

      - name: Dependency security contract tests
        run: >-
          bunx vitest run
          src/test/check-bun-lockfile-policy.test.ts
          src/test/check-dependency-security.test.ts
          src/test/dependency-security-ci-workflow.test.ts
          src/test/dependency-security-phase-a-contract.test.ts
          src/test/vite-dev-server-binding.test.ts
          --reporter=dot

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      # Repo-wide Vitest coverage is intentionally delegated to the existing
      # sharded `CI` and `Full Vitest Suite (PR gate)` workflows. This job owns
      # only the focused dependency-security contract tests above.

      # Pinned mocked browser compatibility only. Repo-wide browser coverage
      # remains owned by the existing dedicated E2E workflows.
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers (chromium only)
        run: bunx playwright install --with-deps chromium

      - name: Playwright smoke suite
        run: >-
          bunx playwright test
          e2e/auth-loading.spec.ts
          e2e/auth-route-protection.spec.ts
          e2e/legal-seo-metadata.spec.ts
          --project=chromium-mocked
        continue-on-error: false
