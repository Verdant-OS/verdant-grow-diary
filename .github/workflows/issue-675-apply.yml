name: Issue 675 implementation

on:
  pull_request:
    branches:
      - verdant-grow-diary
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: agent/issue-675-grow-scoped-timeline
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Apply assertion-based product patch
        run: python scripts/.issue-675-apply.py

      - name: Apply assertion-based test migration
        run: python scripts/.issue-675-tests.py

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format touched files
        run: >-
          bunx prettier --write
          src/lib/quickLogTimelineNavigationTarget.ts
          src/lib/quickLogSaveGuardRules.ts
          src/lib/oneTentLoopNavigationRules.ts
          src/components/QuickLogV2Sheet.tsx
          src/components/QuickLog.tsx
          src/test/quick-log-timeline-navigation-target.test.ts
          src/test/quick-log-timeline-cta-integration.test.tsx
          src/test/quicklog-post-save-target-plant.test.tsx
          src/test/one-tent-loop-navigation-rules.test.ts
          src/test/quick-log-save-hardening-rules.test.ts
          src/test/quick-log-save-guard-rules.test.ts
          src/test/quick-log-v2-sheet-feeding.test.tsx
          e2e/quick-log-activation-handoff.spec.ts

      - name: Typecheck
        run: bun run typecheck

      - name: Targeted Quick Log and Timeline tests
        run: >-
          bunx vitest run
          src/test/quick-log-timeline-navigation-target.test.ts
          src/test/quick-log-timeline-cta-integration.test.tsx
          src/test/quicklog-post-save-target-plant.test.tsx
          src/test/one-tent-loop-navigation-rules.test.ts
          src/test/quick-log-save-hardening-rules.test.ts
          src/test/quick-log-save-guard-rules.test.ts
          src/test/quick-log-v2-sheet-feeding.test.tsx
          src/test/quick-log-v2-sheet-watering.test.tsx
          src/test/timeline-entry-anchor-rules.test.ts
          src/test/timeline-hash-anchor-handoff.test.tsx
          src/test/timeline-page-read-state.test.tsx
          src/test/scoped-grow-navigation-contract.test.tsx

      - name: Lint touched files
        run: >-
          bunx eslint
          src/lib/quickLogTimelineNavigationTarget.ts
          src/lib/quickLogSaveGuardRules.ts
          src/lib/oneTentLoopNavigationRules.ts
          src/components/QuickLogV2Sheet.tsx
          src/components/QuickLog.tsx
          src/test/quick-log-timeline-navigation-target.test.ts
          src/test/quick-log-timeline-cta-integration.test.tsx
          src/test/quicklog-post-save-target-plant.test.tsx
          src/test/one-tent-loop-navigation-rules.test.ts
          src/test/quick-log-save-hardening-rules.test.ts
          src/test/quick-log-save-guard-rules.test.ts
          src/test/quick-log-v2-sheet-feeding.test.tsx
          e2e/quick-log-activation-handoff.spec.ts

      - name: Build
        run: bun run build

      - name: Commit implementation and tests
        shell: bash
        run: |
          git config user.name "Verdant Automation"
          git config user.email "actions@users.noreply.github.com"
          git add \
            src/lib/quickLogTimelineNavigationTarget.ts \
            src/lib/quickLogSaveGuardRules.ts \
            src/lib/oneTentLoopNavigationRules.ts \
            src/components/QuickLogV2Sheet.tsx \
            src/components/QuickLog.tsx \
            src/test/quick-log-timeline-navigation-target.test.ts \
            src/test/quick-log-timeline-cta-integration.test.tsx \
            src/test/quicklog-post-save-target-plant.test.tsx \
            src/test/one-tent-loop-navigation-rules.test.ts \
            src/test/quick-log-save-hardening-rules.test.ts \
            src/test/quick-log-save-guard-rules.test.ts \
            src/test/quick-log-v2-sheet-feeding.test.tsx \
            e2e/quick-log-activation-handoff.spec.ts
          git commit -m "fix(quick-log): scope post-save diary navigation"
          git push origin HEAD:agent/issue-675-grow-scoped-timeline
