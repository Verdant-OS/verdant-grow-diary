name: Codex PR690 router harness transfer

on:
  push:
    branches:
      - codex/fix-ssr-head-snapshot-bundle-path-20260803

jobs:
  transfer:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - name: Transfer the exact Vitest-only router harness, validate, and self-remove
        env:
          TARGET_BRANCH: codex/fix-ssr-head-snapshot-bundle-path-20260803
          SOURCE_BRANCH: fix/ssr-supabase-init-hardening
          EXPECTED_PRE_TRANSFER_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name "Verdant CI Maintenance"
          git config user.email "ci-maintenance@users.noreply.github.com"
          test "$(git rev-parse HEAD)" = "$EXPECTED_PRE_TRANSFER_HEAD"

          git fetch --depth=1 origin \
            "refs/heads/${SOURCE_BRANCH}:refs/remotes/origin/${SOURCE_BRANCH}"

          mkdir -p src/test/helpers
          git show "refs/remotes/origin/${SOURCE_BRANCH}:src/test/helpers/reactRouterCompat.vitest.tsx" \
            > src/test/helpers/reactRouterCompat.vitest.tsx
          git show "refs/remotes/origin/${SOURCE_BRANCH}:src/test/router-harness-memory-router.test.tsx" \
            > src/test/router-harness-memory-router.test.tsx

          node <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const path = 'vitest.config.ts';
          let source = readFileSync(path, 'utf8');
          if (!source.includes('const srcRoot = path.resolve(__dirname, "./src");')) {
            source = source.replace(
              'export default defineConfig({',
              'const srcRoot = path.resolve(__dirname, "./src");\n\nexport default defineConfig({',
            );
          }
          source = source.replace(
            /resolve:\s*\{\s*alias:\s*\{\s*"@":\s*path\.resolve\(__dirname,\s*"\.\/src"\)\s*\}\s*,?\s*\}/m,
            `resolve: {
              alias: {
                // Vitest-only: real TanStack MemoryRouter provider for legacy tests.
                // Production Vite continues to resolve the product shim.
                "@/lib/react-router-compat": path.resolve(
                  srcRoot,
                  "test/helpers/reactRouterCompat.vitest.tsx",
                ),
                "@": srcRoot,
              },
            }`,
          );
          if (!source.includes('test/helpers/reactRouterCompat.vitest.tsx')) {
            throw new Error('Failed to install Vitest-only router alias');
          }
          writeFileSync(path, source);
          NODE

          git rm .github/workflows/codex-pr690-router-harness.yml
          git add vitest.config.ts src/test/helpers/reactRouterCompat.vitest.tsx \
            src/test/router-harness-memory-router.test.tsx
          git diff --cached --check

          bun install --frozen-lockfile
          bun run typecheck:tsgo
          bunx vitest run \
            src/test/router-harness-memory-router.test.tsx \
            src/test/ssr-head-snapshot-paths.test.ts \
            src/test/vitest-config-react-plugin-contract.test.ts \
            --reporter=dot
          bun run build

          git commit -m "test(router): isolate legacy MemoryRouter harness to Vitest"
          final_head="$(git rev-parse HEAD)"
          git push \
            --force-with-lease="refs/heads/${TARGET_BRANCH}:${EXPECTED_PRE_TRANSFER_HEAD}" \
            origin "HEAD:refs/heads/${TARGET_BRANCH}"
          echo "final_head=$final_head"