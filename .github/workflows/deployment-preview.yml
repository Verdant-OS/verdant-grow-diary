name: deployment-preview
# Hosted acceptance uses https://verdantgrowdiary.com only (2026-09-28).
# Existing CI/diagnostic bindings remain unchanged and supply no live acceptance.
# Any target/status-message alignment requires a separate reviewed CI slice.
# See docs/production-only-verification-runbook.md; no dispatch/APPLY here.

# Deployment-preview pipeline: on every PR (and manual dispatch), gate
# this branch's preview build behind the same checks that run in
# CI's production path — edge-shared mirror preflight, typecheck, and a
# full production build. Green pipeline → this branch builds in CI. What
# any publisher's preview actually serves is not measured here. Red
# pipeline → the PR comment names the outcome: a build that ran and
# failed, a build that never ran because preflight failed (unmeasured,
# not failed), or a build that ended some other way (e.g. cancelled).
#
# This does NOT publish to production. Which platform publishes it, and
# how, is operating state (docs/agents/CURRENT_STATE.md), never assumed
# here. This pipeline only certifies that the tree builds and the mirror is in sync.

on:
  pull_request:
    branches: [main, verdant-grow-diary]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write # post/update the preview-status comment
  issues: write # (pull_request comments API is under /issues/)

concurrency:
  # One preview build per PR — cancel superseded runs so the PR comment
  # always reflects the latest commit, not a stale in-flight build.
  group: deployment-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Stage 1 — cheap gate. Fails in <1 min if the edge shared-lib mirror
  # is out of sync, so the expensive build stage never starts.
  preflight:
    name: Preflight — edge shared-lib mirror
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: No src/lib imports from supabase/functions
        run: node scripts/check-no-src-lib-imports.mjs

      - name: Verify edge shared-lib mirror is in sync
        id: verify-mirror
        run: node scripts/verify-edge-shared-in-sync.mjs --check-only

      - name: Human-readable drift report
        if: always() && steps.verify-mirror.outcome == 'failure'
        env:
          DRIFT_REPORT_OUT: edge-shared-drift-report.md
        run: node scripts/report-edge-shared-drift.mjs || true

      - name: Upload drift report
        if: always() && steps.verify-mirror.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: edge-shared-drift-report-preview
          path: edge-shared-drift-report.md
          if-no-files-found: ignore
          retention-days: 14

  # Stage 2 — production build, with the repo's own command (`vite build`
  # via `bun run build`). A green here proves this tree builds in CI. It
  # does not measure what a publisher's preview serves; nothing here does.
  build:
    name: Production build (preview-bound)
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun install cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck (stop-ship gate)
        id: typecheck
        run: bun run typecheck

      - name: Production build
        id: prod_build
        env:
          NODE_ENV: production
        run: bun run build

      - name: Generate build summary
        if: always()
        env:
          OUT_DIR: artifacts/build-summary
          BUILD_SUMMARY_TRIGGER: ${{ github.event_name }}
          BUILD_SUMMARY_VALIDATORS: >-
            [
              {"name":"job-status","result":"${{ job.status }}","detail":"backstop: covers steps not listed below"},
              {"name":"edge-shared-preflight","result":"pass","detail":"gated by needs: preflight"},
              {"name":"typecheck","result":"${{ steps.typecheck.outcome }}"},
              {"name":"production-build","result":"${{ steps.prod_build.outcome }}"}
            ]
        run: node scripts/generate-build-summary.mjs

      - name: Upload build summary artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-summary-preview-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/build-summary/
          if-no-files-found: error
          retention-days: 30

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: preview-build-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist
          retention-days: 7

  # Stage 3 — publish the preview status back to the PR. Runs even when
  # earlier stages fail so the PR always shows current preview health.
  publish-preview-status:
    name: Publish preview status to PR
    needs: [preflight, build]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Post preview-status comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          PREFLIGHT: ${{ needs.preflight.result }}
          BUILD: ${{ needs.build.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          MARKER="<!-- deployment-preview-status -->"

          # Four outcomes, kept distinct: a skipped build is unmeasured, not failed.
          if [ "$PREFLIGHT" = "success" ] && [ "$BUILD" = "success" ]; then
            STATUS="✅ **CI build verified** — preview contents not measured"
            NOTE="Edge-shared mirror in sync, typecheck clean, production build succeeded."
          elif [ "$BUILD" = "skipped" ]; then
            STATUS="⏭️ **CI build not run** (preflight \`$PREFLIGHT\`) — do not share a preview"
            NOTE="The build stage never ran, so this commit's build is unmeasured, not failed. A preview may still load, but its build may not match this commit."
          elif [ "$BUILD" = "failure" ]; then
            STATUS="❌ **CI build failed** — do not share a preview"
            NOTE="The build job failed before this commit could be certified; only the job result is known here, so the workflow run names the failing step. A preview may still load, but its build may not match this commit."
          else
            STATUS="⚠️ **CI build did not complete** (\`$BUILD\`) — do not share a preview"
            NOTE="The build stage ended \`$BUILD\`, so this commit's build is unmeasured. A preview may still load, but its build may not match this commit."
          fi

          BODY=$(cat <<EOF
          $MARKER
          ### Deployment preview pipeline

          $STATUS

          | Stage                       | Result       |
          |-----------------------------|--------------|
          | Edge-shared preflight       | \`$PREFLIGHT\` |
          | Typecheck + production build| \`$BUILD\`     |

          $NOTE

          - Commit: \`${SHA:0:12}\`
          - Workflow run: $RUN_URL
          - Preview URL: whatever the publishing platform posts for this branch (see docs/agents/CURRENT_STATE.md).
          EOF
          )

          # Idempotent update: patch existing marker comment if present.
          EXISTING=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            -q ".[] | select(.body | contains(\"$MARKER\")) | .id" | head -n1)

          if [ -n "$EXISTING" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$EXISTING" -f body="$BODY" >/dev/null
            echo "Updated preview-status comment $EXISTING."
          else
            gh pr comment "$PR" --repo "$REPO" --body "$BODY"
            echo "Posted preview-status comment on PR #$PR."
          fi

      # Mirror the pipeline result into the job outcome so branch
      # protection rules can require "publish-preview-status" as a
      # single required check that reflects overall preview health.
      - name: Enforce overall preview verdict
        run: |
          if [ "${{ needs.preflight.result }}" != "success" ] || [ "${{ needs.build.result }}" != "success" ]; then
            echo "::error::Deployment preview pipeline failed — see stage results above."
            exit 1
          fi
