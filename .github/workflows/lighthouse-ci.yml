# Lighthouse CI — protects LCP + SEO on the published surface.
#
# Runs against https://verdantgrowdiary.com (published, real network).
# NOT dispatched automatically until the repo owner enables it — Verdant
# publishes locally from Windows, so this workflow is opt-in via
# workflow_dispatch + nightly schedule.
#
# Assertions live in lighthouserc.cjs. URLs are loaded from
# public/sitemap.xml so this stays in lockstep with the canonical routes.

name: lighthouse-ci

on:
  workflow_dispatch: {}
  schedule:
    # Nightly at 08:00 UTC. Comment out if not desired.
    - cron: "0 8 * * *"

jobs:
  lighthouse:
    name: Lighthouse (published sitemap, ${{ matrix.shard.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard:
          - index: 0
            label: shard 1/4
          - index: 1
            label: shard 2/4
          - index: 2
            label: shard 3/4
          - index: 3
            label: shard 4/4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Verify Lighthouse sharding contract
        run: node --test scripts/lib/lighthouse-url-sharding.test.cjs

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.15.1

      - name: Run Lighthouse against published sitemap shard
        run: lhci autorun --config=./lighthouserc.cjs
        env:
          LHCI_BUILD_CONTEXT__CURRENT_BRANCH: ${{ github.ref_name }}
          LHCI_SHARD_INDEX: ${{ matrix.shard.index }}
          LHCI_SHARD_COUNT: 4
