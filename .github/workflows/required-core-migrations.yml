# Core-schema migration deploy gate.
#
# Sibling of required-money-migrations.yml. That workflow guards
# credit/referral/entitlement schema; this one guards the schema the core
# product loop cannot run without — the columns and tables plant, grow,
# tent, and Quick Log flows write on every request.
#
# Motivating incident: `plants.plant_type` was added in-repo on 2026-07-22
# but never applied to prod. CreatePlantDialog sends `plant_type` in every
# insert payload, so every plant creation failed with PGRST204 and the
# dialog returned early — presenting to growers as "Create plant does
# nothing". Nothing in CI compared the schema the app requires against the
# schema prod actually had, so it sat live for days.
#
# This asserts COLUMN EXISTENCE via pg_catalog — not migration version rows
# in supabase_migrations.schema_migrations. Duplicate migrations supplying
# the same column, and schema created outside the Supabase CLI, both make a
# version check fail against a perfectly correct database. pg_catalog rather
# than information_schema because the latter is filtered by the connecting
# role's privileges, which produced a false "everything is missing" against a
# correct database. Column existence is also the exact condition the app
# fails on, so green here means "the app will work". See the header of
# scripts/required-core-migrations.mjs for the full rationale.
#
# Deliberately does NOT use ./.github/actions/require-ci-secret: that
# composite action currently fails template validation, and this gate must
# stay independently diagnosable. The secret check below is inline.
name: Required core schema present

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "scripts/assert-required-core-migrations.mjs"
      - "scripts/assert-required-core-migrations-applied.mjs"
      - "scripts/required-core-migrations.mjs"
      - "src/test/required-core-migrations.test.ts"
      - ".github/workflows/required-core-migrations.yml"

  # Every push to the deploy branch re-checks LIVE. Publishing happens through
  # Lovable's deploy_project, outside CI entirely, so there is no pre-deploy
  # workflow to hook into — a push to this branch is the closest CI-observable
  # point before a publish. Without this the LIVE check would only ever run on
  # a manual dispatch, i.e. exactly when someone remembers, which is not a gate.
  # (Note: the deploy branch is `verdant-grow-diary`, NOT `main`.)
  push:
    branches: [verdant-grow-diary]

  workflow_dispatch:
    inputs:
      target_env:
        description: "Target env label for logs (live | sandbox)"
        required: true
        default: "sandbox"

permissions:
  contents: read
  pull-requests: write

jobs:
  # Manifest integrity + file presence. Needs no secrets and no network, so
  # this half of the gate can always run and always reach a real verdict.
  manifest-and-files:
    name: Core schema manifest + migration files present
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      # A dispatch with a typo ('prod', 'Live', 'sandox') matches neither
      # applied-* job condition, so both would skip and the workflow would go
      # green having inspected no database at all — a silent no-op wearing a
      # passing badge, which is the opposite of this gate's fail-closed intent.
      - name: Reject unknown target_env on manual dispatch
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          TARGET_ENV_INPUT: ${{ inputs.target_env }}
        run: |
          set -euo pipefail
          case "${TARGET_ENV_INPUT}" in
            live|sandbox)
              echo "target_env='${TARGET_ENV_INPUT}' is valid."
              ;;
            *)
              echo "::error title=Core-schema gate::Unsupported target_env '${TARGET_ENV_INPUT}'. Use exactly 'live' or 'sandbox' (lowercase) — any other value would skip both database checks and report a pass that was never earned."
              exit 1
              ;;
          esac
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Unit tests — manifest shape + version extraction
        run: bunx vitest run src/test/required-core-migrations.test.ts --reporter=verbose
      - name: Assert every required core migration file is present on disk
        run: node scripts/assert-required-core-migrations.mjs

  # Applied-to-database check. Requires SUPABASE_DB_URL_SANDBOX. Until that
  # secret is configured this job fails with exit 3 (NO_DB_CONNECTION) by
  # design — "we could not check" and "we checked and it is fine" are
  # opposite states, and conflating them is what let the motivating P0 ship.
  applied-sandbox:
    name: Assert core schema present in SANDBOX
    needs: manifest-and-files
    # PRs and manual sandbox dispatches. Never on the deploy-branch push — that
    # path checks LIVE below.
    if: ${{ (github.event_name == 'pull_request') || (github.event_name == 'workflow_dispatch' && inputs.target_env == 'sandbox') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Prepare audit dir
        run: mkdir -p "${{ github.workspace }}/audit/core-sandbox"
      - name: Preflight — SUPABASE_DB_URL_SANDBOX configured
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL_SANDBOX }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            {
              echo "### Core-schema migration deploy guard — SANDBOX"
              echo
              echo "**Status:** ❌ \`SUPABASE_DB_URL_SANDBOX\` is not configured."
              echo
              echo "This gate verifies that core-schema migrations present in the repo have"
              echo "actually been applied to the target database. Without the connection"
              echo "string it cannot verify anything, so it fails closed rather than"
              echo "reporting a pass it did not earn."
              echo
              echo "**Fix:**"
              echo "1. Open **Settings → Secrets and variables → Actions**."
              echo "2. Add a repository secret \`SUPABASE_DB_URL_SANDBOX\` — the pooled"
              echo "   Postgres connection string for the SANDBOX database (same URL used"
              echo "   by \`supabase db push\`)."
              echo "3. Re-run this workflow."
            } | tee "${{ github.workspace }}/audit/core-sandbox/report.md" >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Core-schema migration gate::SUPABASE_DB_URL_SANDBOX not configured — gate could not verify core schema."
            exit 1
          fi
          echo "SUPABASE_DB_URL_SANDBOX is configured."
      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Verify required core columns exist (sandbox)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL_SANDBOX }}
          TARGET_ENV: sandbox
          REPORT_PATH: ${{ github.workspace }}/audit/core-sandbox/report.md
          AUDIT_PATH: ${{ github.workspace }}/audit/core-sandbox/audit.json
        run: node scripts/assert-required-core-migrations-applied.mjs
      - name: Publish guard report to job summary
        if: always()
        run: |
          if [ -f "${{ github.workspace }}/audit/core-sandbox/report.md" ]; then
            cat "${{ github.workspace }}/audit/core-sandbox/report.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Comment on PR when the core-schema gate fails
        if: failure() && github.event_name == 'pull_request' && hashFiles('audit/core-sandbox/report.md') != ''
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2
        with:
          header: core-schema-migration-gate-sandbox
          path: audit/core-sandbox/report.md
      - name: Upload core-schema guard audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: core-schema-migration-guard-sandbox
          path: audit/core-sandbox
          if-no-files-found: warn

  # ADVISORY: schema behind paid / entitlement-gated features.
  #
  # A missing Pro column breaks a paid surface for the growers who bought it —
  # worth surfacing — but must never block an unrelated core release, or a core
  # fix ends up waiting on an optional paid-feature migration. Same script and
  # same verified behavior as the core job, different manifest.
  #
  # The job itself always ends GREEN; drift is reported as a ::warning::
  # annotation plus a job summary. See the step-level note below for why this
  # is not job-level continue-on-error.
  advisory-pro-sandbox:
    name: Advisory — Pro-feature schema in SANDBOX (non-blocking)
    needs: manifest-and-files
    if: ${{ (github.event_name == 'pull_request') || (github.event_name == 'workflow_dispatch' && inputs.target_env == 'sandbox') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Prepare audit dir
        run: mkdir -p "${{ github.workspace }}/audit/pro-sandbox"
      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
      # continue-on-error on the STEP, not the job. Job-level continue-on-error
      # still surfaces the check as FAILURE in the checks API, which makes an
      # "advisory" result indistinguishable from a blocking one on the PR — the
      # exact triage noise this job exists to avoid. Failing the step instead
      # lets the job finish green while the next step re-reads the outcome.
      - name: Report Pro-feature schema drift (advisory)
        id: pro_check
        continue-on-error: true
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL_SANDBOX }}
          TARGET_ENV: sandbox
          MANIFEST_SCOPE: pro
          REPORT_PATH: ${{ github.workspace }}/audit/pro-sandbox/report.md
          AUDIT_PATH: ${{ github.workspace }}/audit/pro-sandbox/audit.json
        run: node scripts/assert-required-core-migrations-applied.mjs
      - name: Publish advisory result
        if: always()
        run: |
          set -euo pipefail
          if [ "${{ steps.pro_check.outcome }}" = "success" ]; then
            echo "✓ Pro-feature schema present in sandbox."
            echo "✓ Pro-feature schema present in sandbox." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Surfaced as a warning annotation, never an error: a missing Pro
          # column breaks a paid surface for entitled growers (worth seeing)
          # but must not gate an unrelated core release.
          echo "::warning title=Pro-feature schema drift::Pro-gated schema is missing in sandbox. Advisory only — does not block release. See the job summary for details."
          {
            echo "> ⚠️ **Advisory only** — Pro-feature schema drift. Does **not** block release."
            echo ""
            if [ -f "${{ github.workspace }}/audit/pro-sandbox/report.md" ]; then
              cat "${{ github.workspace }}/audit/pro-sandbox/report.md"
            else
              echo "The advisory check did not produce a report (see step logs)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload advisory audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pro-schema-advisory-sandbox
          path: audit/pro-sandbox
          if-no-files-found: warn

  # Live/pre-deploy variant. Runs automatically on every deploy-branch push so
  # a publish cannot proceed on an unverified LIVE schema, plus on explicit
  # dispatch. Requires SUPABASE_DB_URL_LIVE; fails closed without it.
  applied-live:
    name: Assert core schema present in LIVE (pre-deploy gate)
    needs: manifest-and-files
    # Fires on every deploy-branch push (the real pre-publish moment) and on an
    # explicit live dispatch. Never on PRs.
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/verdant-grow-diary') || (github.event_name == 'workflow_dispatch' && inputs.target_env == 'live') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Prepare audit dir
        run: mkdir -p "${{ github.workspace }}/audit/core-live"
      - name: Preflight — SUPABASE_DB_URL_LIVE configured
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL_LIVE }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "::error title=Core-schema migration gate::SUPABASE_DB_URL_LIVE not configured — gate could not verify core schema."
            exit 1
          fi
          echo "SUPABASE_DB_URL_LIVE is configured."
      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Verify required core columns exist (live)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL_LIVE }}
          TARGET_ENV: live
          REPORT_PATH: ${{ github.workspace }}/audit/core-live/report.md
          AUDIT_PATH: ${{ github.workspace }}/audit/core-live/audit.json
        run: node scripts/assert-required-core-migrations-applied.mjs
      - name: Publish guard report to job summary
        if: always()
        run: |
          if [ -f "${{ github.workspace }}/audit/core-live/report.md" ]; then
            cat "${{ github.workspace }}/audit/core-live/report.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload core-schema guard audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: core-schema-migration-guard-live
          path: audit/core-live
          if-no-files-found: warn
