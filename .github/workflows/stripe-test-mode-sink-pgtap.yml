name: Stripe test-mode sink pgTAP

# Runs supabase/tests/stripe_test_mode_sink_pgtap.sql on a fresh loopback
# Postgres cluster. The file creates its own stub roles and tables, then
# applies the unmerged Stripe test-mode migration. A migrated Supabase stack
# already has those objects, so this job uses an empty database instead.
# Stripe test mode only. No GitHub secrets, no hosted project, no deploy.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [main, verdant-grow-diary]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  stripe-test-mode-sink-pgtap:
    name: Stripe test-mode sink pgTAP (disposable local Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install disposable Postgres and pgTAP
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql
          PG_MAJOR="$(psql --version | awk '{print $3}' | cut -d. -f1)"
          sudo apt-get install -y --no-install-recommends "postgresql-${PG_MAJOR}-pgtap"
          echo "PG_MAJOR=${PG_MAJOR}" >> "$GITHUB_ENV"

      - name: Run stripe_test_mode_sink_pgtap.sql on a fresh loopback database
        run: |
          set -euo pipefail
          PG_BIN="/usr/lib/postgresql/${PG_MAJOR}/bin"
          PGDATA="${RUNNER_TEMP}/stripe-sink-pg"
          SOCK="${RUNNER_TEMP}/stripe-sink-sock"
          PORT=54329
          cleanup() {
            if [ -d "$PGDATA" ]; then
              sudo -u postgres "${PG_BIN}/pg_ctl" -D "$PGDATA" -m fast -w stop || true
            fi
          }
          trap cleanup EXIT
          mkdir -p "$SOCK"
          chmod 777 "$SOCK"
          sudo install -d -o postgres -g postgres -m 700 "$PGDATA"
          sudo -u postgres "${PG_BIN}/initdb" -D "$PGDATA" --auth=trust --username=postgres --no-instructions
          sudo -u postgres "${PG_BIN}/pg_ctl" -D "$PGDATA" -w start \
            -o "-p ${PORT} -k ${SOCK} -c listen_addresses=127.0.0.1"
          LISTEN="$(sudo -u postgres psql -h "$SOCK" -p "$PORT" -d postgres -Atqc "SHOW listen_addresses")"
          case "$LISTEN" in
            127.0.0.1|localhost) ;;
            *)
              echo "BLOCKED: refusing non-loopback listen_addresses '${LISTEN}'." >&2
              exit 2
              ;;
          esac
          sudo -u postgres psql -h 127.0.0.1 -p "$PORT" -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE stripe_sink_pgtap;"
          sudo -u postgres psql -h 127.0.0.1 -p "$PORT" -d stripe_sink_pgtap -v ON_ERROR_STOP=1 -f supabase/tests/stripe_test_mode_sink_pgtap.sql
          sudo -u postgres psql -h 127.0.0.1 -p "$PORT" -d postgres -v ON_ERROR_STOP=1 -c "DROP DATABASE stripe_sink_pgtap;"
