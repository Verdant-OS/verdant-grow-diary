name: Actions read-only production proof

# Production only. Real fixture-owned Actions reads, UI readback and GET-only refresh.
# Login uses the existing UI bootstrap. No backend save or database dispatch.
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "e2e/lib/actionsReadonlyProofRules.ts"
      - "e2e/lib/signedInReadonlyProof.ts"
      - "e2e/actions-readonly-proof.spec.ts"
      - "src/test/actions-production-readonly-proof.test.ts"
      - "src/test/signed-in-readonly-proof.test.ts"
      - ".github/workflows/actions-readonly-proof.yml"
  push:
    branches: [verdant-grow-diary]
    paths:
      - "e2e/lib/actionsReadonlyProofRules.ts"
      - "e2e/lib/signedInReadonlyProof.ts"
      - "e2e/actions-readonly-proof.spec.ts"
      - ".github/workflows/actions-readonly-proof.yml"

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  actions-readonly-proof:
    # Trusted same-repository re-land branch only for PRs; never fork credentials.
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'claude/chem-actions-readonly-proof-001')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
      E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
      E2E_MEASURE_ACTIONS_READONLY: "true"
      PLAYWRIGHT_RETRIES: "0"
    steps:
      - name: Verify production fixture configuration
        shell: bash
        run: |
          set -euo pipefail
          if [ "$E2E_BASE_URL" != "https://verdantgrowdiary.com" ] ||
             [ "$E2E_TEST_EMAIL" != "cheekhimself@gmail.com" ] ||
             [ -z "$E2E_TEST_PASSWORD" ]; then
            echo "BLOCKED: exact production host and approved fixture-account credentials required."
            exit 1
          fi
      - name: Checkout proof source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Pin current deploy SHA
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/verdant-grow-diary:refs/remotes/origin/verdant-grow-diary
          expected_sha="$(git rev-parse refs/remotes/origin/verdant-grow-diary)"
          [[ "$expected_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "E2E_EXPECTED_SHA=$expected_sha" >> "$GITHUB_ENV"
      # A merge is not a deployment: measure only once production serves this SHA.
      - name: Wait for the pinned SHA to be live
        run: node scripts/wait-for-deployed-sha.mjs
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - name: Install pinned dependencies
        run: bun install --frozen-lockfile
      - name: Verify read-only proof safety regressions
        run: bun run test --run src/test/actions-production-readonly-proof.test.ts src/test/signed-in-readonly-proof.test.ts src/test/production-quicklog-fixture.test.ts
      - name: Install Chromium
        run: bun run e2e:install:ci
      - name: Measure fixture-owned Actions on production
        run: bunx playwright test e2e/actions-readonly-proof.spec.ts --project=chromium-authed --workers=1 --retries=0 --reporter=list
      - name: Upload sanitized Actions receipt only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: actions-readonly-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/**/actions-readonly-proof.json
          if-no-files-found: warn
          retention-days: 7
