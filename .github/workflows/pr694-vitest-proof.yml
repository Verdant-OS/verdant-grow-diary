name: PR 694 Vitest residual ownership proof

on:
  pull_request:
    branches: [verdant-grow-diary]
    paths:
      - ".github/workflows/pr694-vitest-proof.yml"
      - "scripts/ci/pr694-vitest-proof.mjs"
      - "scripts/ci/vitest.pr694-normalized.config.mjs"
      - "scripts/ci/pr694-vitest-failures.json"
  workflow_dispatch:

concurrency:
  group: pr694-vitest-proof-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  proof:
    name: Proof ${{ matrix.label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: base
            sha: 7efaaa5ed09a76e01e0555328e204934900f0083
          - label: head
            sha: a28cd69b803eb1a5af78a90b9ca766e6fa6d4be0
          - label: merge
            sha: 541dbfca91f3876aca8224ad6d0dfd0250393ed5

    steps:
      - name: Checkout proof harness
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: harness
          persist-credentials: false

      - name: Checkout immutable target ref
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ matrix.sha }}
          path: target
          persist-credentials: false

      - name: Verify immutable target SHA
        working-directory: target
        run: |
          set -euo pipefail
          ACTUAL="$(git rev-parse HEAD)"
          test "$ACTUAL" = "${{ matrix.sha }}"
          echo "target=${{ matrix.label }} sha=$ACTUAL"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Runtime and lockfile proof
        working-directory: target
        run: |
          set -euo pipefail
          echo "node=$(node --version)"
          echo "bun=$(bun --version)"
          sha256sum bun.lock 2>/dev/null || sha256sum bun.lockb

      - name: Install frozen dependencies
        id: install
        continue-on-error: true
        working-directory: target
        run: bun install --frozen-lockfile

      - name: Run native and normalized proof
        if: steps.install.outcome == 'success'
        run: |
          node harness/scripts/ci/pr694-vitest-proof.mjs run \
            --target-dir target \
            --inventory harness/scripts/ci/pr694-vitest-failures.json \
            --normalized-config harness/scripts/ci/vitest.pr694-normalized.config.mjs \
            --output-dir "target/.pr694-proof-artifacts/${{ matrix.label }}" \
            --label "${{ matrix.label }}" \
            --expected-sha "${{ matrix.sha }}"

      - name: Record frozen install blocker
        if: steps.install.outcome != 'success'
        run: |
          node harness/scripts/ci/pr694-vitest-proof.mjs record-install-failure \
            --output-dir "target/.pr694-proof-artifacts/${{ matrix.label }}" \
            --label "${{ matrix.label }}" \
            --expected-sha "${{ matrix.sha }}"

      - name: Upload per-ref proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr694-vitest-proof-${{ matrix.label }}
          path: target/.pr694-proof-artifacts/${{ matrix.label }}
          retention-days: 14
          if-no-files-found: error

      - name: Fail only when the proof harness could not install
        if: steps.install.outcome != 'success'
        run: |
          echo "::error::Frozen dependency install failed for ${{ matrix.label }}."
          exit 1

  aggregate:
    name: Aggregate PR 694 ownership proof
    runs-on: ubuntu-24.04
    needs: proof
    if: always()
    timeout-minutes: 10
    steps:
      - name: Checkout proof harness
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Download same-run proof artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: pr694-vitest-proof-*
          path: proof-artifacts

      - name: Aggregate three-ref evidence
        run: |
          node scripts/ci/pr694-vitest-proof.mjs aggregate \
            --input-dir proof-artifacts \
            --output-dir combined-proof

      - name: Publish job summary
        if: always()
        run: |
          if [ -f combined-proof/pr694-vitest-ownership-matrix.md ]; then
            cat combined-proof/pr694-vitest-ownership-matrix.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "PR #694 proof aggregation did not produce a matrix." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload combined proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr694-vitest-proof-combined
          path: combined-proof
          retention-days: 14
          if-no-files-found: error
