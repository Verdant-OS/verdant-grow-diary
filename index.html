<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Browser chrome -->
    <meta name="theme-color" content="#0d1a12" />
    <meta name="robots" content="index, follow" />

    <!-- Google Search Console site verification (META method) -->
    <meta name="google-site-verification" content="xPFb9yyxbDpIFrPhumD9-10JIkCO_gUlu09ZsF2nevo" />

    <!-- Favicon / app icons.
         Primary favicon is a tiny inline-simple SVG (leaf + pen nib). The
         Apple touch icon is a purpose-built 180px raster so browser icon
         discovery never downloads the 2.38 MB print-quality source logo. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/verdant-logo-180.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-B3QRSZEM9S"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());

      // React sends an explicit pathname-only page_location. Disable GA's
      // automatic initial view so query tokens and hashes never become the
      // browser-location fallback before the router mounts.
      gtag("config", "G-B3QRSZEM9S", { send_page_view: false });
    </script>

    <!-- Primary SEO -->
    <title>Verdant Grow Diary</title>
    <meta
      name="description"
      content="Grow logs, sensor-aware insights, environment alerts, and cautious AI coaching for serious cultivators."
    />
    <!-- Root self-canonical. This used to be omitted on purpose, because a
         single baked canonical would make /welcome, /pricing, etc. declare
         themselves duplicates of the homepage. That reasoning ended when the
         deferred prerender pass this file's old comment anticipated actually
         shipped: buildStaticSocialRouteHtml REPLACES an existing canonical
         rather than appending one (src/lib/build/staticSocialRouteHtml.ts),
         so every prerendered route overwrites this tag with its own correct
         self-canonical. Verified: every URL in public/sitemap.xml except "/"
         has a prerendered document, and root-canonical-seo.test.ts fails the
         build if that ever stops being true.

         What still receives this tag verbatim is exactly what should:
           - "/" itself, which is not prerendered (routeFileName rejects root)
             and previously shipped with NO canonical at all to non-JS crawlers.
           - Unknown URLs. Static SPA hosting serves this shell for every
             unmatched path with HTTP 200, so junk URLs used to arrive with
             "index, follow" and no canonical — an invitation to index
             unlimited soft-404s. They now point at the homepage instead of
             standing as separate indexable pages.
         Per-route client-side canonicals from usePageSeo still apply on top
         for JS-rendering consumers. -->
    <link rel="canonical" href="https://verdantgrowdiary.com/" />

    <!-- Fonts.
         The Google Fonts stylesheet is loaded non-blocking so above-the-fold
         text can paint with system fallbacks (font-display: swap on every
         face) while the web font arrives. This unblocks LCP on the /welcome
         hero paragraph flagged by the Lighthouse audit. The <noscript>
         fallback keeps the stylesheet reachable for non-JS crawlers. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      onload="this.rel = 'stylesheet'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>

    <!-- Open Graph -->

    <meta property="og:url" content="https://verdantgrowdiary.com" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Verdant Grow Diary" />
    <meta property="og:image" content="https://verdantgrowdiary.com/brand/verdant-logo-512.png" />
    <meta property="og:image:alt" content="Verdant Grow Diary" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta name="twitter:image" content="https://verdantgrowdiary.com/brand/verdant-logo-512.png" />

    <!-- Sitewide Organization + WebSite JSON-LD -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://verdantgrowdiary.com/#organization",
            "name": "Verdant Grow Diary",
            "url": "https://verdantgrowdiary.com",
            "logo": "https://verdantgrowdiary.com/brand/verdant-logo-512.png"
          },
          {
            "@type": "WebSite",
            "@id": "https://verdantgrowdiary.com/#website",
            "name": "Verdant Grow Diary",
            "url": "https://verdantgrowdiary.com",
            "publisher": { "@id": "https://verdantgrowdiary.com/#organization" },
            "description": "Grow logs, sensor-aware insights, environment alerts, and cautious AI coaching for serious cultivators."
          }
        ]
      }
    </script>
    <meta property="og:title" content="Verdant Grow Diary" />
    <meta name="twitter:title" content="Verdant Grow Diary" />
    <meta
      property="og:description"
      content="Grow logs, sensor-aware insights, environment alerts, and cautious AI coaching for serious cultivators."
    />
    <meta
      name="twitter:description"
      content="Grow logs, sensor-aware insights, environment alerts, and cautious AI coaching for serious cultivators."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
