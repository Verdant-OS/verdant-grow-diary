# Scheduled merge-queue + open-PR backlog snapshot with threshold alerts.
# Read-only (gh api / gh pr list). Does not merge or mutate rulesets.
name: Merge queue snapshot

on:
  schedule:
    # 14:05 UTC daily — after US morning CI churn
    - cron: "5 14 * * *"
  workflow_dispatch:
    inputs:
      fail_on_warn:
        description: "Fail the job on warn-level threshold breaches"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read
  pull-requests: read

jobs:
  snapshot:
    name: merge-queue snapshot + thresholds
    runs-on: tenki-standard-medium-4c-8g
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Snapshot with alerts
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          MERGE_QUEUE_BRANCH: verdant-grow-diary
        run: |
          set -euo pipefail
          EXTRA=()
          if [ "${{ github.event.inputs.fail_on_warn || 'false' }}" = "true" ]; then
            EXTRA+=(--fail-on-warn)
          fi
          # Single live snapshot → both artifacts (no redundant second status fetch)
          node scripts/ci/merge-queue-snapshot.mjs --alert \
            --json-out merge-queue-snapshot.json \
            --text-out merge-queue-snapshot.txt \
            "${EXTRA[@]}"

      - name: Upload snapshot artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: merge-queue-snapshot
          path: |
            merge-queue-snapshot.txt
            merge-queue-snapshot.json
          if-no-files-found: ignore
          retention-days: 14