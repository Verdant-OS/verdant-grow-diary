name: Required money-critical migrations present

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "scripts/assert-required-money-migrations.mjs"
      - "scripts/assert-required-money-migrations-applied.mjs"
      - "scripts/assert-money-migration-db-secret.mjs"
      - "scripts/assert-no-unreviewed-money-migrations.mjs"
      - "scripts/diff-money-migration-prefixes.mjs"
      - "scripts/lib/moneyDatabaseTargetIdentity.mjs"
      - "scripts/lib/supabaseDatabaseTargetIdentity.mjs"
      - "scripts/required-money-migrations.mjs"
      - "src/test/assert-required-money-migrations-applied-security.test.ts"
      - "src/test/assert-money-migration-db-secret.runner-secret-resolution.test.ts"
      - "src/test/assert-money-migration-db-secret.test.ts"
      - "src/test/diff-money-migration-prefixes.test.ts"
      - "src/test/helpers/psqlSpawnStub.ts"
      - "src/test/money-database-target-identity.test.ts"
      - "src/test/required-money-migrations-workflow-trust-boundary.test.ts"
      - "src/test/required-money-migrations-version.test.ts"
      - ".github/workflows/prefix-diff-sarif.yml"
      - ".github/workflows/required-money-migrations.yml"

  push:
    branches: [verdant-grow-diary]
  workflow_dispatch:
    inputs:
      target_env:
        description: "Protected target environment"
        required: true
        default: "sandbox"
        type: choice
        options:
          - sandbox
          - live

permissions:
  contents: read

jobs:
  unit-tests-migration-version:
    name: Unit tests — migrationVersion + applied-check logic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Prepare vitest log dir
        run: mkdir -p "${{ github.workspace }}/audit/vitest"
      - name: Run required-money-migrations unit tests
        id: vitest_run
        run: |
          set -o pipefail
          bunx vitest run \
            src/test/assert-money-migration-db-secret.runner-secret-resolution.test.ts \
            src/test/assert-money-migration-db-secret.test.ts \
            src/test/assert-required-money-migrations-applied-security.test.ts \
            src/test/diff-money-migration-prefixes.test.ts \
            src/test/money-database-target-identity.test.ts \
            src/test/required-money-migrations-workflow-trust-boundary.test.ts \
            src/test/required-money-migrations-version.test.ts \
            --reporter=verbose \
            2>&1 | tee "${{ github.workspace }}/audit/vitest/required-money-migrations.log"
      - name: Dump extractor expected prefixes
        if: always()
        run: |
          node scripts/diff-money-migration-prefixes.mjs --expected \
            > "${{ github.workspace }}/audit/vitest/expected-prefixes.txt" || true
          node scripts/diff-money-migration-prefixes.mjs --expected --json \
            > "${{ github.workspace }}/audit/vitest/expected-prefixes.json" || true
      - name: Upload vitest + extractor artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: required-money-migrations-vitest
          path: audit/vitest
          if-no-files-found: warn

  assert-required-money-migrations:
    name: Assert required credit-spend + referral migrations present
    needs: unit-tests-migration-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Assert filename allowlist
        run: node scripts/assert-required-money-migrations.mjs
      - name: Assert no unreviewed money-adjacent migrations
        run: node scripts/assert-no-unreviewed-money-migrations.mjs

  assert-money-migrations-applied-sandbox:
    name: Assert money migrations applied in SANDBOX
    needs: assert-required-money-migrations
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/verdant-grow-diary') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/verdant-grow-diary' && inputs.target_env == 'sandbox') }}
    environment: verdant-sandbox
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ""
      PGDATABASE: ""
      PGHOST: ""
      PGPASSWORD: ""
      PGPORT: ""
      PGSERVICE: ""
      PGSERVICEFILE: ""
      PGUSER: ""
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Prepare audit dir
        run: mkdir -p "${{ github.workspace }}/audit/sandbox"
      - name: Preflight — SUPABASE_DB_URL_SANDBOX configured
        uses: ./.github/actions/require-ci-secret
        with:
          secret-name: SUPABASE_DB_URL_SANDBOX
          secret-value: ${{ secrets.SUPABASE_DB_URL_SANDBOX }}
          guard-heading: "Money-critical migration deploy guard — SANDBOX"
          report-path: ${{ github.workspace }}/audit/sandbox/report.md
          log-prefix: money-migration-preflight
          fix-steps-json: >-
            ["1. Open **Settings → Environments → verdant-sandbox** in this repository.",
             "2. Add an environment secret named `SUPABASE_DB_URL_SANDBOX` whose value is the pooled Postgres connection string for the SANDBOX database (the same URL used by `supabase db push`).",
             "3. Re-run this workflow. The gate will run `node scripts/assert-required-money-migrations-applied.mjs` against SANDBOX and confirm every money-critical migration is applied."]
          reason-lines-json: >-
            ["Why this is a hard failure: without the DB URL the deploy gate cannot",
             "confirm that money-critical migrations (credit spends, referrals, entitlements)",
             "are actually applied. Merging without this check risks silently shipping",
             "a schema drift into production."]
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Fast-fail prefix diff (sandbox)
        id: prefix_diff_sandbox
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL_SANDBOX }}
          TARGET_ENV: sandbox
        run: |
          set -o pipefail
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "SUPABASE_DB_URL_SANDBOX not configured — skipping fast-fail diff; verify step will emit the missing-secret report."
            exit 0
          fi
          node scripts/diff-money-migration-prefixes.mjs --json \
            > "${{ github.workspace }}/audit/sandbox/prefix-diff-cli.json"
          node scripts/diff-money-migration-prefixes.mjs \
            | tee "${{ github.workspace }}/audit/sandbox/prefix-diff-cli.txt"
      - name: Verify applied migrations in sandbox DB
        id: verify_sandbox
        if: always()
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL_SANDBOX }}
          TARGET_ENV: sandbox
          REPORT_PATH: ${{ github.workspace }}/audit/sandbox/report.md
          AUDIT_PATH: ${{ github.workspace }}/audit/sandbox/applied-audit.json
          DIFF_PATH: ${{ github.workspace }}/audit/sandbox/prefix-diff.txt
        # Missing-secret handling lives in the local require-ci-secret
        # preflight above, which is the single source of truth for that failure.
        run: node scripts/assert-required-money-migrations-applied.mjs
      - name: Append report to workflow summary
        if: always() && hashFiles('audit/sandbox/report.md') != ''
        run: cat audit/sandbox/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload sandbox audit bundle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: money-migration-audit-sandbox
          path: audit/sandbox
          if-no-files-found: warn

  assert-money-migrations-applied-live:
    name: Assert money migrations applied in LIVE (pre-deploy gate)
    needs: assert-required-money-migrations
    # Production verification is always a protected, manual run from the trusted base branch.
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/verdant-grow-diary' && inputs.target_env == 'live' }}
    environment: verdant-production
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ""
      PGDATABASE: ""
      PGHOST: ""
      PGPASSWORD: ""
      PGPORT: ""
      PGSERVICE: ""
      PGSERVICEFILE: ""
      PGUSER: ""
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Prepare audit dir
        run: mkdir -p "${{ github.workspace }}/audit/live"
      - name: Preflight — SUPABASE_DB_URL configured
        uses: ./.github/actions/require-ci-secret
        with:
          secret-name: SUPABASE_DB_URL
          secret-value: ${{ secrets.SUPABASE_DB_URL }}
          guard-heading: "Money-critical migration deploy guard — LIVE"
          report-path: ${{ github.workspace }}/audit/live/report.md
          log-prefix: money-migration-preflight
          fix-steps-json: >-
            ["1. Open **Settings → Environments → verdant-production** in this repository.",
             "2. Add an environment secret named `SUPABASE_DB_URL` whose value is the pooled Postgres connection string for the LIVE database (the same URL used by `supabase db push`).",
             "3. Re-run this workflow. The gate will run `node scripts/assert-required-money-migrations-applied.mjs` against LIVE and confirm every money-critical migration is applied."]
          reason-lines-json: >-
            ["Why this is a hard failure: without the DB URL the deploy gate cannot",
             "confirm that money-critical migrations (credit spends, referrals, entitlements)",
             "are actually applied. Merging without this check risks silently shipping",
             "a schema drift into production."]
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Fast-fail prefix diff (live)
        id: prefix_diff_live
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          TARGET_ENV: live
        run: |
          set -o pipefail
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "SUPABASE_DB_URL not configured — skipping fast-fail diff; verify step will emit the missing-secret report."
            exit 0
          fi
          node scripts/diff-money-migration-prefixes.mjs --json \
            > "${{ github.workspace }}/audit/live/prefix-diff-cli.json"
          node scripts/diff-money-migration-prefixes.mjs \
            | tee "${{ github.workspace }}/audit/live/prefix-diff-cli.txt"
      - name: Verify applied migrations in live DB
        id: verify_live
        if: always()
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          TARGET_ENV: live
          REPORT_PATH: ${{ github.workspace }}/audit/live/report.md
          AUDIT_PATH: ${{ github.workspace }}/audit/live/applied-audit.json
          DIFF_PATH: ${{ github.workspace }}/audit/live/prefix-diff.txt
        # Missing-secret handling lives in the local require-ci-secret
        # preflight above, which is the single source of truth for that failure.
        run: node scripts/assert-required-money-migrations-applied.mjs
      - name: Append report to workflow summary
        if: always() && hashFiles('audit/live/report.md') != ''
        run: cat audit/live/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload live audit bundle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: money-migration-audit-live
          path: audit/live
          if-no-files-found: warn
