name: release-workbook-safety

on:
  pull_request:
    paths:
      - "docs/**"
      - "scripts/assert-premium-workbook-access-docs.mjs"
      - "scripts/assert-release-traceability-mapping.mjs"
      - "scripts/generate-release-workbook-templates.mjs"
      - "scripts/assert-release-docs-safety.mjs"
      - "scripts/sensor-safety-check.mjs"
      - "src/test/assert-premium-workbook-access-docs.test.ts"
      - "src/test/assert-release-traceability-mapping.test.ts"
      - "src/test/generate-release-workbook-templates.test.ts"
      - "src/test/fixtures/hanging-release-workbook-generator.mjs"
      - "src/test/release-workbook-concurrent-read-isolation.test.ts"
      - "src/test/release-workbook-formula-snapshots.test.ts"
      - "src/test/release-workbook-manifest.test.ts"
      - "src/test/utils/releaseWorkbookTestArtifacts.ts"
      - "scripts/verify-release-workbooks.mjs"
      - ".github/workflows/release-workbook-safety.yml"
      - "package.json"
      - "bun.lockb"
  workflow_dispatch:

jobs:
  release-workbook-safety:
    name: Workbook safety + traceability + snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Cache Bun install cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify release workbooks (aggregator)
        run: bun run docs:verify-release-workbooks

      - name: Upload generated artifacts (diagnostic)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-workbook-templates-v1.3
          path: docs/artifacts/
          if-no-files-found: error
          retention-days: 14
