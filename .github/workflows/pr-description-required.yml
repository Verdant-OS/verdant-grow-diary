name: PR description required

# Fails any pull request whose description has no real content: after
# removing HTML comments (including an unclosed one), invisible
# whitespace, checkbox lines, and any line copied unchanged from
# .github/pull_request_template.md, something written by the author must
# remain. Merge-queue runs pass trivially because the description was
# already checked on the pull request itself.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]
  merge_group:

permissions:
  contents: read

concurrency:
  group: pr-description-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-description:
    name: PR description required
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Fetch PR template
        if: github.event_name == 'pull_request'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: .github/pull_request_template.md
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Check pull request description
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ "$EVENT_NAME" = "merge_group" ]; then
            echo "Merge queue run: description was checked on the pull request."
            exit 0
          fi
          tpl=.github/pull_request_template.md
          if [ ! -f "$tpl" ]; then
            echo "::error title=PR description required::Could not read $tpl from the base commit; failing closed."
            exit 1
          fi
          remaining="$(printf '%s' "$PR_BODY" | TPL="$tpl" perl -CSD -0777 -ne '
            my $b = $_;
            $b =~ s/<!--.*?(-->|\z)//gs;
            $b =~ s/[\x{00A0}\x{00AD}\x{180E}\x{200B}-\x{200D}\x{2060}-\x{2064}\x{FEFF}]/ /g;
            my %tpl;
            if (open(my $fh, "<:encoding(UTF-8)", $ENV{TPL})) {
              local $/; my $t = <$fh>; $t =~ s/<!--.*?(-->|\z)//gs;
              for (split /\r?\n/, $t) { s/^\s+|\s+$//g; $tpl{$_} = 1 if length }
            }
            my @keep;
            for (split /\r?\n/, $b) {
              s/^\s+|\s+$//g;
              next unless length;
              next if $tpl{$_};
              next if /^[-*]\s*\[[ xX]?\]/;
              next if /^(#+|>|---+|[-*])$/;
              push @keep, $_;
            }
            print join("\n", @keep);
          ')"
          stripped="$(printf '%s' "$remaining" | tr -d '[:space:]')"
          if [ -z "$stripped" ]; then
            echo "::error title=PR description required::This pull request has no description of its own (an empty body, an unfilled template, or checkbox lines alone do not count). Add a short summary of what it changes and why, then save; this check reruns on edit."
            exit 1
          fi
          echo "PR description present (${#stripped} non-whitespace characters beyond the template)."
