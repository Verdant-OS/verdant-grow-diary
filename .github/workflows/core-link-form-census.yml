name: Core Link and Form Census

on:
  pull_request:
    paths:
      - "src/**"
      - "e2e/core-link-form-census.spec.ts"
      - "e2e/lib/coreLinkFormCensus.ts"
      - "playwright.config.ts"
      - ".github/workflows/core-link-form-census.yml"
  push:
    branches:
      - verdant-grow-diary
    paths:
      - "src/**"
      - "e2e/core-link-form-census.spec.ts"
      - "e2e/lib/coreLinkFormCensus.ts"
      - "playwright.config.ts"
      - ".github/workflows/core-link-form-census.yml"
  schedule:
    - cron: "35 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-link-form-census-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused-rules:
    name: Census rules and accessibility regressions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run focused rules and Pheno accessibility tests
        run: >-
          bunx vitest run
          src/test/core-link-form-census-rules.test.ts
          src/test/pheno-keepers-page.test.tsx
          --reporter=dot

  browser-census:
    name: Browser census (${{ matrix.lane }})
    needs: focused-rules
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: public
            grep: scheduled public
          - lane: authenticated
            grep: scheduled authenticated
    env:
      PLAYWRIGHT_RETRIES: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Cache Bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'bun.lockb', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock', 'bun.lockb', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Playwright Chromium
        run: bun run e2e:install:ci
      - name: Run hermetic ${{ matrix.lane }} census
        run: >-
          bunx playwright test
          --project=chromium-mocked
          e2e/core-link-form-census.spec.ts
          --grep "${{ matrix.grep }}"
          --reporter=list
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: core-link-form-census-${{ matrix.lane }}-failure
          path: test-results
          if-no-files-found: warn
