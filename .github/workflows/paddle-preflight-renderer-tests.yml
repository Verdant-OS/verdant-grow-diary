name: Paddle preflight renderer tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  renderer-tests:
    name: node --test (renderer)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Full renderer suite for scripts/render-paddle-craft-preflight-comment.mjs.
      # Runs `node --test` (no vitest) so it can't hang the full-suite runner,
      # and fails the build on any regression in the comment/verdict rules.
      - name: Run renderer test suite
        run: bun run test:paddle-craft-preflight-renderer
