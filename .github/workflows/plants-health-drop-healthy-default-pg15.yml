name: Plants health null PG15

on:
  pull_request:
    paths: &plants_health_null_paths
      - "scripts/run-plants-health-drop-healthy-default-pg15-harness.mjs"
      - "supabase/migrations/20261015161000_plants_health_drop_healthy_default.sql"
      - "supabase/migrations/20260924120000_plants_health_unassessed_default.sql"
      - ".github/workflows/plants-health-drop-healthy-default-pg15.yml"
      - "src/test/plants-health-drop-healthy-default-pg15-harness.test.ts"
      - "src/test/plants-health-drop-healthy-default-migration.test.ts"
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - verdant-grow-diary
    paths: *plants_health_null_paths
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pg15_runtime:
    name: PostgreSQL 15 omitted health is null
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15.18@sha256:bb0df8b69f086efa2cbe4b8128df2f368a362bbdadef743731a63dd0f2f24c9e
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: verdant-runtime-only
          POSTGRES_DB: verdant_plants_health_null
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d verdant_plants_health_null"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PLANTS_HEALTH_NULL_PG15_URL: postgresql://postgres:verdant-runtime-only@127.0.0.1:5432/verdant_plants_health_null
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"

      - name: Install and verify PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client
          psql --version

      - name: Create disposable PostgreSQL harness sentinel
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: verdant-runtime-only
          PGDATABASE: verdant_plants_health_null
        run: |
          psql -X -q -v ON_ERROR_STOP=1 --single-transaction --file=- <<'SQL'
          create schema verdant_plants_health_null_harness authorization postgres;
          revoke all on schema verdant_plants_health_null_harness from public;
          create table verdant_plants_health_null_harness.runtime_sentinel (
            sentinel text primary key
          );
          revoke all on table verdant_plants_health_null_harness.runtime_sentinel from public;
          insert into verdant_plants_health_null_harness.runtime_sentinel(sentinel)
          values ('verdant_plants_health_null_pg15_disposable_v1');
          SQL

      - name: Run isolated PostgreSQL 15 harness
        run: node scripts/run-plants-health-drop-healthy-default-pg15-harness.mjs
