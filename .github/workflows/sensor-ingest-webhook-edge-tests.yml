name: sensor-ingest-webhook Edge Tests

on:
  push:
    branches: [main, verdant-grow-diary]
    paths:
      - "supabase/functions/_shared/**"
      - "supabase/functions/sensor-ingest-webhook/**"
      - "supabase/functions/ecowitt-ingest/**"
      - "supabase/config.toml"
      - "src/lib/sensorIngestTestResultRules.ts"
      - "src/test/sensor-ingest-webhook*.test.ts"
      - "src/test/ecowitt-bridge-auth-config.test.ts"
      - "package.json"
      - ".github/workflows/sensor-ingest-webhook-edge-tests.yml"
  pull_request:
    paths:
      - "supabase/functions/_shared/**"
      - "supabase/functions/sensor-ingest-webhook/**"
      - "supabase/functions/ecowitt-ingest/**"
      - "supabase/config.toml"
      - "src/lib/sensorIngestTestResultRules.ts"
      - "src/test/sensor-ingest-webhook*.test.ts"
      - "src/test/ecowitt-bridge-auth-config.test.ts"
      - "package.json"
      - ".github/workflows/sensor-ingest-webhook-edge-tests.yml"

jobs:
  edge-tests:
    name: Deno bridge auth + handler E2E
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v1.x

      - name: Run sensor ingest Deno tests
        # Fake env only — no production secrets are used or required.
        env:
          SUPABASE_URL: https://example.test
          SUPABASE_ANON_KEY: test-anon-key
        run: |
          deno test \
            --no-lock \
            --allow-env \
            --allow-net=esm.sh,deno.land,jsr.io,npm.jsr.io \
            supabase/functions/sensor-ingest-webhook/auth.test.ts \
            supabase/functions/sensor-ingest-webhook/cors_e2e_test.ts \
            supabase/functions/sensor-ingest-webhook/handler_e2e_test.ts \
            supabase/functions/ecowitt-ingest/handler_e2e_test.ts \
            2>&1 | tee deno-edge-tests.log

      - name: Upload Deno test log on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sensor-ingest-webhook-deno-log
          path: deno-edge-tests.log
          # Only the test log is uploaded — never dotfiles, raw JSONL listener
          # output, or local logs.
          if-no-files-found: ignore
