name: Published migration integrity

# Fails a PR when any already-published Supabase migration file has been
# edited, deleted, or reduced to a no-op relative to the PR's base branch.
# Migration history is append-only — follow-ups must land as new files with
# fresh timestamps, never by editing files that have already shipped.
#
# The gate compares the PR head's working tree against the base branch
# (github.event.pull_request.base.ref) using SHA-256 hashes of each
# already-published migration blob. New files that only exist on the PR
# branch are reported but never fail — they are the correct way to land
# follow-up changes.
#
# Non-money-critical scope: this gate covers ALL supabase/migrations/*.sql,
# not just money paths. Runs on every PR touching migrations or the
# verifier script itself.

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "scripts/verify-published-migration-integrity.mjs"
      - ".github/workflows/published-migration-integrity.yml"

permissions:
  contents: read
  pull-requests: write

jobs:
  verify-published-migration-integrity:
    name: Verify published migrations are unchanged vs base branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR head with full history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Fetch full history so the verifier can read blobs from the base
          # branch ref. Shallow clones fail with "unknown revision".
          fetch-depth: 0

      - name: Fetch base branch
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          # `actions/checkout` with fetch-depth: 0 already has all refs, but
          # explicitly fetch the base ref by name so it is available as
          # `origin/<base>` regardless of runner state.
          git fetch --no-tags origin "${BASE_REF}:refs/remotes/origin/${BASE_REF}" || \
            git fetch --no-tags origin "${BASE_REF}"

      - name: Prepare audit dir
        run: mkdir -p "${{ github.workspace }}/audit/migration-integrity"

      - name: Run integrity verifier (JSON)
        id: verify_json
        continue-on-error: true
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -o pipefail
          node scripts/verify-published-migration-integrity.mjs \
            --baseline="origin/${BASE_REF}" \
            --json \
            > "${{ github.workspace }}/audit/migration-integrity/report.json"

      - name: Run integrity verifier (human-readable, gate)
        id: verify_text
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -o pipefail
          node scripts/verify-published-migration-integrity.mjs \
            --baseline="origin/${BASE_REF}" \
            2>&1 | tee "${{ github.workspace }}/audit/migration-integrity/report.txt"

      - name: Write PR-comment body on failure
        if: failure()
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "### Published migration integrity — ❌ FAILED"
            echo ""
            echo "One or more already-published Supabase migration files were **edited, deleted, or reduced to a no-op** on this PR relative to \`${BASE_REF}\`."
            echo ""
            echo "Migration history is append-only. Restore the affected files byte-for-byte from \`${BASE_REF}\` and land any real change as a **new additive migration** with a fresh timestamp."
            echo ""
            echo "**Verifier output:**"
            echo ""
            echo '```text'
            # Cap at ~200 lines so the sticky comment stays readable.
            head -n 200 audit/migration-integrity/report.txt || true
            echo '```'
            echo ""
            echo "[Full workflow run](${RUN_URL})"
          } > audit/migration-integrity/pr-comment.md

      - name: Post PR comment on failure
        if: failure() && hashFiles('audit/migration-integrity/pr-comment.md') != ''
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2
        with:
          header: published-migration-integrity
          path: audit/migration-integrity/pr-comment.md

      - name: Clear stale PR comment on success
        if: success() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2
        with:
          header: published-migration-integrity
          delete: true

      - name: Append report to workflow summary
        if: always()
        run: |
          {
            echo "## Published migration integrity"
            echo ""
            echo "- Baseline ref: \`origin/${{ github.event.pull_request.base.ref }}\`"
            echo "- Verifier: \`scripts/verify-published-migration-integrity.mjs\`"
            echo ""
            echo '```text'
            head -n 200 audit/migration-integrity/report.txt 2>/dev/null || echo "(no report produced)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload integrity audit bundle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: published-migration-integrity-report
          path: audit/migration-integrity
          retention-days: 30
          if-no-files-found: warn
