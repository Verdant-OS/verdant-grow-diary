name: Quick Log Playwright smoke

# Authenticated Quick Log Playwright smoke harness.
#
# SAFETY:
#  - No auth bypass.
#  - No hardcoded credentials in the workflow.
#  - No elevated DB role usage.
#  - No checked-in storageState; the setup project signs in via the real /auth UI
#    using repository secrets, or skips with a clear message.
#  - Uploads Playwright report + smoke JSON/text report as artifacts on every run.
#  - Never uses the elevated PR target event — only the safe pull_request event.
#
# Triggers:
#  - workflow_dispatch: manual run; fails fast if required secrets/URL are missing.
#  - push to verdant-grow-diary: best-effort; skips cleanly if secrets are unavailable.
#  - pull_request to verdant-grow-diary: best-effort; PRs without access to E2E vars/secrets
#    (e.g. forked PRs) skip cleanly with a clear non-secret message and the job
#    completes successfully.
#
# Required repository secrets / vars (configure in GitHub → Settings):
#   secrets.E2E_TEST_EMAIL
#   secrets.E2E_TEST_PASSWORD
#   vars.E2E_BASE_URL              (e.g. https://<preview-or-staging>.example)
#   vars.E2E_GROW_1_PLANT_URL      (full URL of a Grow #1 plant page)
#   vars.E2E_GROW_1_SECOND_PLANT_NAME (optional; defaults to "E2E Test Plant 2")
#
# PR-comment controls (workflow_dispatch only; push/pull_request use the
# defaults below):
#   pr_comment_min_failed  Minimum hard-failure count to post at all. Default 1.
#   pr_comment_disabled    "true" fully suppresses the PR comment for this run,
#                          unconditionally — even with hard failures. Overrides
#                          pr_comment_min_failed. Default "false".
#   pr_comment_mode        "sticky" (default) updates the same comment across
#                          runs; "new-per-run" posts a fresh comment every run.
#   pr_number              Required alongside the three inputs above for a
#                          workflow_dispatch run: a plain manual dispatch has
#                          no pull_request event context, so PR-comment steps
#                          only run on workflow_dispatch when this is set (or
#                          on a real pull_request event, where it's inferred
#                          automatically). Leave blank to just run the smoke
#                          suite with no PR-comment behavior at all.
#
# Each failed/flaky test also gets its own dedicated artifact (uploaded via
# scripts/upload-per-test-artifacts.mjs) in addition to the shared
# quicklog-playwright-traces/-media bundles, so the PR comment can link
# directly to just that test's evidence. Per-test upload failures are
# warnings only and never fail the job.

on:
  workflow_dispatch:
    inputs:
      playwright_retries:
        description: "Playwright retry count per test (default 1 in CI). Increase to 2 or 3 for deeper flake triage."
        required: false
        default: "1"
      pr_comment_min_failed:
        description: "Minimum hard-failure count required to post the PR comment. 0 = always post; 1 = only when at least one test stays red after retries."
        required: false
        default: "1"
      pr_comment_disabled:
        description: "Fully disable PR comment posting for this run, unconditionally — even when there are hard failures. Overrides pr_comment_min_failed."
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      pr_comment_mode:
        description: "'sticky' updates the same PR comment across runs; 'new-per-run' posts a fresh comment every run instead."
        required: false
        default: "sticky"
        type: choice
        options: ["sticky", "new-per-run"]
      pr_number:
        description: "PR number to comment on for a manual workflow_dispatch run. Required for pr_comment_disabled/pr_comment_mode/pr_comment_min_failed to have any effect on a dispatched run — a plain workflow_dispatch has no pull_request event context to infer this from. Leave blank for a run that isn't about PR-comment behavior."
        required: false
        default: ""

  push:
    branches: [verdant-grow-diary]
    paths:
      - "e2e/**"
      - "playwright.config.ts"
      - ".github/workflows/quicklog-smoke.yml"
  pull_request:
    branches: [verdant-grow-diary]
    paths:
      - "e2e/**"
      - "playwright.config.ts"
      - ".github/workflows/quicklog-smoke.yml"

jobs:
  quicklog-smoke:
    name: Quick Log Playwright smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Job scope: read code, post a sticky PR comment linking to Playwright
    # artifact bundles for failed/flaky tests. No other write scopes.
    permissions:
      contents: read
      pull-requests: write

    env:
      E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
      E2E_GROW_1_PLANT_URL: ${{ vars.E2E_GROW_1_PLANT_URL }}
      E2E_GROW_1_SECOND_PLANT_NAME: ${{ vars.E2E_GROW_1_SECOND_PLANT_NAME }}
      E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
      E2E_FIXTURE_MODE: ${{ vars.E2E_FIXTURE_MODE }}
      E2E_FIXTURE_EXPECTED_GROW_NAME: ${{ vars.E2E_FIXTURE_EXPECTED_GROW_NAME }}
      E2E_FIXTURE_EXPECTED_TENT_NAME: ${{ vars.E2E_FIXTURE_EXPECTED_TENT_NAME }}
      E2E_FIXTURE_EXPECTED_PLANT_NAME: ${{ vars.E2E_FIXTURE_EXPECTED_PLANT_NAME }}
      # Optional safe label (e.g. "E2E") used by the fixture validator if the
      # app visibly exposes account identity. NEVER a password or token.
      E2E_FIXTURE_EXPECTED_ACCOUNT_HINT: ${{ vars.E2E_FIXTURE_EXPECTED_ACCOUNT_HINT }}
      # Optional, off by default. Enables the UI-only fixture bootstrap step.
      E2E_ALLOW_FIXTURE_BOOTSTRAP: ${{ vars.E2E_ALLOW_FIXTURE_BOOTSTRAP }}
      # Playwright retry policy for flake triage. Defaults to 1 retry in CI
      # (playwright.config.ts). workflow_dispatch can override for deeper runs.
      PLAYWRIGHT_RETRIES: ${{ github.event_name == 'workflow_dispatch' && inputs.playwright_retries || '1' }}
      # PR-comment posting mode, read by the two "Post ... PR comment" steps'
      # own `if:` conditions below. push/pull_request always default to
      # 'sticky'; only workflow_dispatch can choose 'new-per-run'.
      PR_COMMENT_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_comment_mode || 'sticky' }}
      # Unconditional PR-comment kill switch, read by both the per-test
      # artifact upload step (skip the work entirely) and the comment-body
      # builder step (skip even when there are hard failures). Overrides
      # PR_COMMENT_MIN_FAILED. push/pull_request always default to 'false'.
      PR_COMMENT_DISABLED: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_comment_disabled || 'false' }}
      # The PR number to comment on: inferred automatically on a real
      # pull_request event, or from the pr_number input on workflow_dispatch.
      # Empty on push, and empty on workflow_dispatch when pr_number is unset.
      PR_NUMBER: ${{ github.event.pull_request.number || (github.event_name == 'workflow_dispatch' && inputs.pr_number || '') }}
      # Whether THIS run is in a context where a PR comment can be built and
      # posted at all — a real pull_request event, or workflow_dispatch with
      # an explicit pr_number. Without this, pr_comment_disabled/pr_comment_mode
      # would only ever be readable on workflow_dispatch, while the only
      # steps that build/post a comment were pull_request-only — two
      # mutually exclusive event types that could never both be true in one
      # run, making every pr_comment_* input permanently unreachable.
      PR_COMMENT_CONTEXT_OK: ${{ (github.event_name == 'pull_request') && 'true' || (github.event_name == 'workflow_dispatch' && inputs.pr_number != '' && 'true') || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Verify required configuration
        id: e2e_config
        shell: bash
        run: |
          # Track presence (never echo values). Only NAMES of missing config
          # are emitted — never the values of any var or secret.
          missing=()
          [ -n "$E2E_BASE_URL" ] || missing+=("vars.E2E_BASE_URL")
          [ -n "$E2E_GROW_1_PLANT_URL" ] || missing+=("vars.E2E_GROW_1_PLANT_URL")
          [ -n "$E2E_TEST_EMAIL" ] || missing+=("secrets.E2E_TEST_EMAIL")
          [ -n "$E2E_TEST_PASSWORD" ] || missing+=("secrets.E2E_TEST_PASSWORD")
          # Disposable E2E fixture safety: required before write-producing smoke.
          # Grow name is OPTIONAL — the current UI has no Grow page in the
          # setup flow (Dashboard → Add Tent → Add Plant).
          [ -n "$E2E_FIXTURE_MODE" ] || missing+=("vars.E2E_FIXTURE_MODE")
          [ -n "$E2E_FIXTURE_EXPECTED_TENT_NAME" ] || missing+=("vars.E2E_FIXTURE_EXPECTED_TENT_NAME")
          [ -n "$E2E_FIXTURE_EXPECTED_PLANT_NAME" ] || missing+=("vars.E2E_FIXTURE_EXPECTED_PLANT_NAME")

          event="${{ github.event_name }}"

          # Sanitized, comma-separated list of missing config NAMES.
          missing_csv=""
          if [ ${#missing[@]} -gt 0 ]; then
            missing_csv=$(IFS=, ; echo "${missing[*]}")
          fi
          echo "missing_config=${missing_csv}" >> "$GITHUB_OUTPUT"

          if [ ${#missing[@]} -gt 0 ]; then
            echo "Missing required Quick Log smoke configuration: ${missing[*]}"
            if [ "$event" = "workflow_dispatch" ]; then
              echo "Missing required Quick Log smoke configuration. Configure Actions vars/secrets." >&2
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              exit 1
            elif [ "$event" = "pull_request" ]; then
              echo "Skipping Quick Log smoke: E2E vars/secrets are unavailable for this PR context."
              echo "should_run=false" >> "$GITHUB_OUTPUT"
            else
              echo "Skipping Quick Log smoke: E2E vars/secrets are unavailable for this event."
              echo "should_run=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "Quick Log smoke configuration present. Proceeding."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Bun
        if: steps.e2e_config.outputs.should_run == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      # Best-effort cache for Bun's package cache. Never includes auth state,
      # storageState, smoke reports, traces, screenshots, videos, or secrets.
      - name: Cache Bun packages
        if: steps.e2e_config.outputs.should_run == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'bun.lockb', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      # Best-effort cache for Playwright browser binaries. Never includes auth
      # state, storageState, smoke reports, traces, screenshots, videos, or
      # secrets. `bun run e2e:install:ci` still runs below to verify Chromium
      # and OS deps after restore.
      - name: Cache Playwright browsers
        if: steps.e2e_config.outputs.should_run == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock', 'bun.lockb', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        if: steps.e2e_config.outputs.should_run == 'true'
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium (with OS deps)
        if: steps.e2e_config.outputs.should_run == 'true'
        run: bun run e2e:install:ci

      - name: Print disposable E2E fixture checklist
        if: steps.e2e_config.outputs.should_run == 'true'
        run: bun run e2e:fixture-checklist

      # Optional UI-only disposable E2E fixture bootstrap. OFF by default.
      # Only runs when vars.E2E_ALLOW_FIXTURE_BOOTSTRAP == 'true'.
      # Never deletes, renames, or modifies existing grow data. Refuses to
      # run against any account that does not look disposable. Bootstrap is
      # NOT required — fixture verification still runs and gates the smoke.
      - name: Bootstrap disposable E2E fixture
        id: bootstrap_fixture
        if: steps.e2e_config.outputs.should_run == 'true' && vars.E2E_ALLOW_FIXTURE_BOOTSTRAP == 'true'
        run: bun run e2e:bootstrap-fixture

      - name: Verify disposable E2E fixture
        id: verify_fixture
        if: steps.e2e_config.outputs.should_run == 'true'
        run: bun run e2e:verify-fixture

      - name: Run Quick Log Playwright smoke
        id: quicklog_smoke
        if: steps.e2e_config.outputs.should_run == 'true' && steps.verify_fixture.outcome == 'success'
        run: bun run e2e:quicklog-smoke

      - name: Verify Quick Log smoke artifacts
        if: always() && steps.e2e_config.outputs.should_run == 'true'
        shell: bash
        run: |
          # After a real smoke execution the JSON report + Playwright HTML
          # report must exist. If either is missing the run is not a usable
          # smoke result — fail the job so we never publish a green run that
          # produced no evidence. Never echoes secret values.
          status=0

          if [ -f "e2e/results/quicklog-smoke-report.json" ]; then
            echo "OK: e2e/results/quicklog-smoke-report.json present"
          else
            echo "MISSING (required): e2e/results/quicklog-smoke-report.json" >&2
            status=1
          fi

          if [ -d "playwright-report" ]; then
            echo "OK: playwright-report/ present"
          else
            echo "MISSING (required): playwright-report/ directory" >&2
            status=1
          fi

          if [ -f "e2e/results/quicklog-smoke-report.txt" ]; then
            echo "OK: e2e/results/quicklog-smoke-report.txt present"
          else
            echo "WARN: e2e/results/quicklog-smoke-report.txt missing (non-fatal)"
          fi

          if [ -d "test-results" ]; then
            echo "OK: test-results/ present"
          else
            echo "WARN: test-results/ missing (non-fatal; may be empty on full pass)"
          fi

          exit "$status"

      - name: Capture Quick Log smoke metadata
        id: smoke_meta
        if: always() && steps.e2e_config.outputs.should_run == 'true'
        shell: bash
        run: |
          # Best-effort capture of smoke counts + Playwright version for the
          # GitHub Actions step summary. Never echoes secret values. Failures
          # here must not mask the real Playwright failure: this step always
          # exits 0 and emits explicit "unavailable" sentinels when fields
          # cannot be determined. Distinguishes:
          #   report_parse_status=parsed  -> counts successfully extracted
          #   report_parse_status=missing -> report JSON not produced
          #   report_parse_status=failed  -> report JSON present but parsing failed
          set +e

          pw_version="$(bunx playwright --version 2>/dev/null | tr -d '\r' | head -n1)"
          if [ -z "${pw_version}" ]; then
            pw_version="unavailable"
          fi
          echo "playwright_version=${pw_version}" >> "$GITHUB_OUTPUT"

          report="e2e/results/quicklog-smoke-report.json"
          report_parse_error=""
          if [ -f "${report}" ]; then
            echo "report_json_present=true" >> "$GITHUB_OUTPUT"
            counts="$(node -e '
              try {
                const fs = require("fs");
                const r = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
                const pick = (...keys) => {
                  for (const k of keys) {
                    const v = k.split(".").reduce((o, p) => (o == null ? o : o[p]), r);
                    if (typeof v === "number") return v;
                  }
                  return null;
                };
                const steps = Array.isArray(r.steps) ? r.steps : (Array.isArray(r.results) ? r.results : null);
                let total = pick("total", "stats.total", "counts.total");
                let passed = pick("passed", "stats.passed", "counts.passed", "ok");
                let failed = pick("failed", "stats.failed", "counts.failed", "failures");
                let skipped = pick("skipped", "stats.skipped", "counts.skipped");
                if (steps) {
                  const norm = s => String(s ?? "").toLowerCase();
                  if (total == null) total = steps.length;
                  if (passed == null) passed = steps.filter(s => ["pass","passed","ok","success"].includes(norm(s.status ?? s.result))).length;
                  if (failed == null) failed = steps.filter(s => ["fail","failed","error"].includes(norm(s.status ?? s.result))).length;
                  if (skipped == null) skipped = steps.filter(s => ["skip","skipped"].includes(norm(s.status ?? s.result))).length;
                }
                const out = [total, passed, failed, skipped].map(v => (typeof v === "number" ? v : ""));
                process.stdout.write(out.join("|"));
              } catch (e) {
                process.stderr.write(String(e && e.message ? e.message : e).slice(0, 200));
                process.stdout.write("");
              }
            ' "${report}" 2> /tmp/smoke_meta_err.txt)"
            IFS='|' read -r smoke_total smoke_passed smoke_failed smoke_skipped <<< "${counts}"
            if [ -n "${smoke_total}${smoke_passed}${smoke_failed}${smoke_skipped}" ]; then
              echo "smoke_counts_available=true" >> "$GITHUB_OUTPUT"
              echo "report_parse_status=parsed" >> "$GITHUB_OUTPUT"
              echo "smoke_total=${smoke_total:-unknown}" >> "$GITHUB_OUTPUT"
              echo "smoke_passed=${smoke_passed:-unknown}" >> "$GITHUB_OUTPUT"
              echo "smoke_failed=${smoke_failed:-unknown}" >> "$GITHUB_OUTPUT"
              echo "smoke_skipped=${smoke_skipped:-unknown}" >> "$GITHUB_OUTPUT"
            else
              echo "smoke_counts_available=false" >> "$GITHUB_OUTPUT"
              echo "report_parse_status=failed" >> "$GITHUB_OUTPUT"
              if [ -s /tmp/smoke_meta_err.txt ]; then
                # Sanitize: single line, strip $ and backticks, cap length.
                report_parse_error="$(tr '\n' ' ' < /tmp/smoke_meta_err.txt | tr -d '`$' | head -c 200)"
              else
                report_parse_error="unable to extract counts from report JSON"
              fi
              echo "report_parse_error=${report_parse_error}" >> "$GITHUB_OUTPUT"
              echo "::warning::Quick Log smoke metadata parsing failed: ${report_parse_error}"
            fi
          else
            echo "report_json_present=false" >> "$GITHUB_OUTPUT"
            echo "smoke_counts_available=false" >> "$GITHUB_OUTPUT"
            echo "report_parse_status=missing" >> "$GITHUB_OUTPUT"
            echo "report_parse_error=" >> "$GITHUB_OUTPUT"
            echo "::warning::Quick Log smoke report JSON missing at ${report}"
          fi

          exit 0

      - name: Summarize Playwright flakes
        id: summarize_flakes
        if: always() && steps.e2e_config.outputs.should_run == 'true'
        shell: bash
        run: |
          # Parses e2e/results/playwright-report.json (Playwright JSON reporter)
          # and appends a flake summary to $GITHUB_STEP_SUMMARY. Flakes = tests
          # that failed on attempt 0 but passed on retry1. Retry counts and
          # artifact paths (trace/video/screenshot) are included per flake.
          # Never fails the job on presence of flakes — informational only.
          if [ ! -f "e2e/results/playwright-report.json" ]; then
            echo "::warning::Playwright JSON report not found; skipping flake summary."
            {
              echo ""
              echo "## Playwright flake summary"
              echo ""
              echo "_No Playwright JSON report was produced for this run — flake classification skipped._"
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node scripts/summarize-playwright-flakes.mjs \
            --report=e2e/results/playwright-report.json \
            --out=e2e/results/playwright-flake-summary.md \
            || echo "::warning::flake summarizer exited non-zero (see logs)"

      # Dedicated single-file upload of the flake summary markdown so
      # reviewers can grab just the summary from the run's artifacts
      # dropdown without downloading the full smoke bundle. The same file
      # is also included in `quicklog-smoke-artifacts` below for archival.
      # Pre-check: the flake summary markdown is only meaningful when there
      # were failed or flaky tests. If summarize-playwright-flakes.mjs
      # produced no file (nothing to report) or an empty file, we skip the
      # dedicated upload and record a clear note in the Job Summary instead
      # of shipping an empty artifact reviewers might mistake for evidence.
      - name: Check flake summary presence
        id: check_flake_summary
        if: always() && steps.e2e_config.outputs.should_run == 'true'
        shell: bash
        run: |
          file="e2e/results/playwright-flake-summary.md"
          if [ -s "${file}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "reason=" >> "$GITHUB_OUTPUT"
            echo "OK: ${file} is present and non-empty."
          elif [ -f "${file}" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "reason=empty" >> "$GITHUB_OUTPUT"
            echo "NOTE: ${file} exists but is empty — nothing to upload."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "reason=missing" >> "$GITHUB_OUTPUT"
            echo "NOTE: ${file} was not produced — nothing to upload."
          fi

      - name: Upload flake summary markdown
        id: upload_flake_summary
        if: always() && steps.e2e_config.outputs.should_run == 'true' && steps.check_flake_summary.outputs.present == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quicklog-flake-summary
          path: e2e/results/playwright-flake-summary.md
          retention-days: 30
          if-no-files-found: warn

      # Append a direct download link to the just-uploaded flake summary
      # artifact into the GitHub Actions Job Summary. `artifact-url` is only
      # populated by actions/upload-artifact@v4 AFTER the upload step runs,
      # so this must live immediately after upload_flake_summary rather than
      # inside the earlier summarizer step. When the upload was skipped
      # because there were no failed/flaky tests, record that explicitly
      # instead so reviewers know why no artifact is attached. Enrichment
      # only — never fails.
      - name: Link flake summary artifact in Job Summary
        if: always() && steps.e2e_config.outputs.should_run == 'true'
        shell: bash
        env:
          FLAKE_SUMMARY_URL: ${{ steps.upload_flake_summary.outputs.artifact-url }}
          FLAKE_SUMMARY_PRESENT: ${{ steps.check_flake_summary.outputs.present }}
          FLAKE_SUMMARY_REASON: ${{ steps.check_flake_summary.outputs.reason }}
        run: |
          {
            echo ""
            echo "### 📎 Flake summary artifact"
            echo ""
            echo "**Expected path (in this workspace):** \`e2e/results/playwright-flake-summary.md\`"
            echo "**Uploaded artifact name:** \`quicklog-flake-summary\` (single file: \`playwright-flake-summary.md\`)"
            echo "**Also archived inside:** \`quicklog-smoke-artifacts\` bundle, same relative path."
            echo ""
            if [ "${FLAKE_SUMMARY_PRESENT}" != "true" ]; then
              if [ "${FLAKE_SUMMARY_REASON}" = "empty" ]; then
                echo "**Status:** _No failed or flaky tests in this run — \`playwright-flake-summary.md\` was written but empty, so the dedicated \`quicklog-flake-summary\` artifact was skipped._"
              else
                echo "**Status:** _No failed or flaky tests in this run — \`playwright-flake-summary.md\` was not produced, so the dedicated \`quicklog-flake-summary\` artifact was skipped._"
              fi
              echo ""
              echo "#### How to (re)generate \`playwright-flake-summary.md\` locally"
              echo ""
              echo "The file is written by \`scripts/summarize-playwright-flakes.mjs\` from the Playwright JSON report at \`e2e/results/playwright-report.json\`. To reproduce this step locally after a Playwright run:"
              echo ""
              echo '```bash'
              echo "# 1. Run the Quick Log smoke (produces e2e/results/playwright-report.json)"
              echo "bun run e2e:quicklog-smoke"
              echo ""
              echo "# 2. Regenerate the flake summary markdown"
              echo "node scripts/summarize-playwright-flakes.mjs \\"
              echo "  --report=e2e/results/playwright-report.json \\"
              echo "  --out=e2e/results/playwright-flake-summary.md"
              echo '```'
              echo ""
              echo "The summary is only non-empty when at least one test failed on attempt 1 or was classified as flaky (failed then passed on retry1). A clean, all-green run intentionally produces no artifact — this notice is the expected outcome, not a build error."
            elif [ -n "${FLAKE_SUMMARY_URL}" ]; then
              echo "**Status:** Download the standalone \`playwright-flake-summary.md\` here: [quicklog-flake-summary](${FLAKE_SUMMARY_URL})"
            else
              echo "**Status:** _Flake summary artifact URL unavailable — check the run's Artifacts dropdown for \`quicklog-flake-summary\`._"
            fi
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload smoke artifacts
        id: upload_smoke_bundle
        if: always() && steps.e2e_config.outputs.should_run == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quicklog-smoke-artifacts
          if-no-files-found: warn
          retention-days: 30
          path: |
            e2e/results/quicklog-smoke-report.json
            e2e/results/quicklog-smoke-report.txt
            e2e/results/playwright-report.json
            e2e/results/playwright-flake-summary.md
            playwright-report/
            test-results/

      - name: Upload Playwright HTML report
        id: upload_playwright_report
        if: always() && steps.e2e_config.outputs.should_run == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quicklog-playwright-report
          path: playwright-report/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Playwright traces
        id: upload_playwright_traces
        if: always() && steps.e2e_config.outputs.should_run == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quicklog-playwright-traces
          path: |
            test-results/**/*.zip
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Playwright media (screenshots/videos)
        id: upload_playwright_media
        if: always() && steps.e2e_config.outputs.should_run == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quicklog-playwright-media
          path: |
            test-results/**/*.png
            test-results/**/*.jpg
            test-results/**/*.jpeg
            test-results/**/*.gif
            test-results/**/*.webm
            test-results/**/*.mp4
            playwright-report/data/**
          retention-days: 30
          if-no-files-found: warn

      - name: Upload smoke report JSON
        id: upload_smoke_report_json
        if: always() && steps.e2e_config.outputs.should_run == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quicklog-smoke-report-json
          path: e2e/results/quicklog-smoke-report.json
          retention-days: 30
          if-no-files-found: warn

      - name: Upload smoke report TXT
        id: upload_smoke_report_txt
        if: always() && steps.e2e_config.outputs.should_run == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quicklog-smoke-report-txt
          path: e2e/results/quicklog-smoke-report.txt
          retention-days: 30
          if-no-files-found: warn

      - name: Upload per-test failure artifacts
        id: upload_per_test_artifacts
        if: always() && steps.e2e_config.outputs.should_run == 'true' && env.PR_COMMENT_CONTEXT_OK == 'true' && env.PR_COMMENT_DISABLED != 'true'
        shell: bash
        run: |
          # One dedicated artifact per failed/flaky test, so the PR comment
          # can link directly to just that test's evidence instead of the
          # whole run's shared bundle. Enrichment only: this script never
          # exits non-zero, so it can never fail the job. Skipped entirely
          # when PR comments are disabled — nothing would ever link to it.
          if [ ! -f "e2e/results/playwright-report.json" ]; then
            echo "::notice::No Playwright JSON report — skipping per-test artifact uploads."
            exit 0
          fi
          node scripts/upload-per-test-artifacts.mjs \
            --report=e2e/results/playwright-report.json \
            --out=e2e/results/per-test-artifacts.json \
            || echo "::warning::per-test artifact uploader exited non-zero (see logs) — this is enrichment only and does not affect the smoke result"

      - name: Build Playwright failure PR-comment body
        id: build_pr_comment
        if: always() && steps.e2e_config.outputs.should_run == 'true' && env.PR_COMMENT_CONTEXT_OK == 'true'
        shell: bash
        env:
          TRACES_URL: ${{ steps.upload_playwright_traces.outputs.artifact-url }}
          MEDIA_URL: ${{ steps.upload_playwright_media.outputs.artifact-url }}
          REPORT_URL: ${{ steps.upload_playwright_report.outputs.artifact-url }}
          BUNDLE_URL: ${{ steps.upload_smoke_bundle.outputs.artifact-url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PR_COMMENT_MIN_FAILED: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_comment_min_failed || '1' }}
        run: |
          # Regenerates the flake summary as a PR-comment body with direct
          # links to the uploaded artifact bundles for both attempt 1 and
          # retry1. `artifact-url` outputs are only populated by
          # actions/upload-artifact@v4 AFTER the upload step runs, so this
          # step must live after every upload_playwright_* step.
          #
          # PR_COMMENT_DISABLED is checked FIRST and unconditionally — it
          # overrides PR_COMMENT_MIN_FAILED and posts nothing even when there
          # are hard failures. This is the one authoritative gate: the "Post
          # ... PR comment" steps below only ever look at comment_ready, so
          # disabling here is enough to suppress posting everywhere.
          if [ "${PR_COMMENT_DISABLED}" = "true" ]; then
            echo "::notice::pr_comment_disabled=true — skipping PR comment unconditionally, even if there are hard failures."
            echo "comment_ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          #
          # PR_COMMENT_MIN_FAILED gates comment creation: the file (and
          # therefore the sticky comment) is only written when the hard-
          # failure count is >= this threshold. Default 1 keeps PRs quiet
          # on flake-only runs; set to 0 to always post.
          if [ ! -f "e2e/results/playwright-report.json" ]; then
            echo "::notice::No Playwright JSON report — skipping PR comment."
            echo "comment_ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node scripts/summarize-playwright-flakes.mjs \
            --report=e2e/results/playwright-report.json \
            --pr-comment=e2e/results/playwright-flake-pr-comment.md \
            --traces-url="${TRACES_URL}" \
            --media-url="${MEDIA_URL}" \
            --report-url="${REPORT_URL}" \
            --bundle-url="${BUNDLE_URL}" \
            --run-url="${RUN_URL}" \
            --per-test-artifacts=e2e/results/per-test-artifacts.json \
            --min-failed="${PR_COMMENT_MIN_FAILED:-1}" \
            > /dev/null \
            || echo "::warning::PR-comment builder exited non-zero (see logs)"
          if [ -s "e2e/results/playwright-flake-pr-comment.md" ]; then
            echo "comment_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "comment_ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Post Playwright failure artifacts PR comment (sticky)
        if: always() && steps.build_pr_comment.outputs.comment_ready == 'true' && env.PR_COMMENT_MODE == 'sticky'
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2
        with:
          header: verdant-playwright-flake-artifacts
          path: e2e/results/playwright-flake-pr-comment.md
          # Explicit PR number so this also works when comment_ready came
          # from a workflow_dispatch run (no pull_request event context to
          # auto-detect from — see PR_NUMBER/PR_COMMENT_CONTEXT_OK above).
          number: ${{ env.PR_NUMBER }}

      - name: Post Playwright failure artifacts PR comment (new per run)
        if: always() && steps.build_pr_comment.outputs.comment_ready == 'true' && env.PR_COMMENT_MODE == 'new-per-run'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Deliberately bypasses the sticky-comment action: with no header
          # to match against, every run posts a brand-new comment instead of
          # updating a prior one. Same body (and sticky marker inside it) as
          # the 'sticky' mode above — only the posting behavior differs.
          gh pr comment "${PR_NUMBER}" --body-file e2e/results/playwright-flake-pr-comment.md

      - name: Write Quick Log smoke run summary
        if: always()
        shell: bash
        env:
          SHOULD_RUN: ${{ steps.e2e_config.outputs.should_run }}
          MISSING_CONFIG: ${{ steps.e2e_config.outputs.missing_config }}
          JOB_STATUS: ${{ job.status }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ARTIFACTS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts
          SMOKE_COUNTS_AVAILABLE: ${{ steps.smoke_meta.outputs.smoke_counts_available }}
          SMOKE_TOTAL: ${{ steps.smoke_meta.outputs.smoke_total }}
          SMOKE_PASSED: ${{ steps.smoke_meta.outputs.smoke_passed }}
          SMOKE_FAILED: ${{ steps.smoke_meta.outputs.smoke_failed }}
          SMOKE_SKIPPED: ${{ steps.smoke_meta.outputs.smoke_skipped }}
          PLAYWRIGHT_VERSION: ${{ steps.smoke_meta.outputs.playwright_version }}
          REPORT_JSON_PRESENT: ${{ steps.smoke_meta.outputs.report_json_present }}
          REPORT_PARSE_STATUS: ${{ steps.smoke_meta.outputs.report_parse_status }}
          REPORT_PARSE_ERROR: ${{ steps.smoke_meta.outputs.report_parse_error }}
          SMOKE_STEP_OUTCOME: ${{ steps.quicklog_smoke.outcome }}
          SMOKE_STEP_CONCLUSION: ${{ steps.quicklog_smoke.conclusion }}
          PLAYWRIGHT_REPORT_ARTIFACT_URL: ${{ steps.upload_playwright_report.outputs.artifact-url }}
          PLAYWRIGHT_TRACES_ARTIFACT_URL: ${{ steps.upload_playwright_traces.outputs.artifact-url }}
          PLAYWRIGHT_MEDIA_ARTIFACT_URL: ${{ steps.upload_playwright_media.outputs.artifact-url }}
          SMOKE_REPORT_JSON_ARTIFACT_URL: ${{ steps.upload_smoke_report_json.outputs.artifact-url }}
          SMOKE_REPORT_TXT_ARTIFACT_URL: ${{ steps.upload_smoke_report_txt.outputs.artifact-url }}
          FIXTURE_STEP_OUTCOME: ${{ steps.verify_fixture.outcome }}
          FIXTURE_STEP_CONCLUSION: ${{ steps.verify_fixture.conclusion }}
          BOOTSTRAP_ALLOW: ${{ vars.E2E_ALLOW_FIXTURE_BOOTSTRAP }}
          BOOTSTRAP_STEP_OUTCOME: ${{ steps.bootstrap_fixture.outcome }}
          BOOTSTRAP_STEP_CONCLUSION: ${{ steps.bootstrap_fixture.conclusion }}
        run: |
          # Never echo secret values. Only references to secret NAMES are written.
          fallback="${ARTIFACTS_URL}"
          pw_report_url="${PLAYWRIGHT_REPORT_ARTIFACT_URL:-$fallback}"
          pw_traces_url="${PLAYWRIGHT_TRACES_ARTIFACT_URL:-$fallback}"
          pw_media_url="${PLAYWRIGHT_MEDIA_ARTIFACT_URL:-$fallback}"
          smoke_json_url="${SMOKE_REPORT_JSON_ARTIFACT_URL:-$fallback}"
          smoke_txt_url="${SMOKE_REPORT_TXT_ARTIFACT_URL:-$fallback}"

          # Fixture validation status for the summary.
          if [ "${SHOULD_RUN}" != "true" ]; then
            fixture_status="skipped due missing config"
          elif [ -z "${FIXTURE_STEP_OUTCOME}" ] || [ "${FIXTURE_STEP_OUTCOME}" = "skipped" ]; then
            fixture_status="not run"
          elif [ "${FIXTURE_STEP_OUTCOME}" = "success" ]; then
            fixture_status="passed"
          else
            fixture_status="failed"
          fi

          # Bootstrap status for the summary.
          if [ "${SHOULD_RUN}" != "true" ]; then
            bootstrap_status="skipped due missing config"
          elif [ "${BOOTSTRAP_ALLOW}" != "true" ]; then
            bootstrap_status="not enabled"
          elif [ "${BOOTSTRAP_STEP_OUTCOME}" = "success" ]; then
            bootstrap_status="passed"
          elif [ -z "${BOOTSTRAP_STEP_OUTCOME}" ] || [ "${BOOTSTRAP_STEP_OUTCOME}" = "skipped" ]; then
            bootstrap_status="skipped"
          else
            bootstrap_status="failed"
          fi

          {
            echo "## Quick Log Playwright smoke"
            echo ""
            echo "- Workflow result: \`${JOB_STATUS}\`"
            echo "- Event: \`${EVENT_NAME}\`"
            echo "- Branch/ref: \`${{ github.ref }}\`"
            echo "- [Workflow run](${RUN_URL})"
            echo "- [Artifacts](${ARTIFACTS_URL})"
            echo "- [Playwright HTML report](${pw_report_url})"
            echo "- [Playwright traces](${pw_traces_url})"
            echo "- [Playwright media (screenshots/videos)](${pw_media_url})"
            echo "- [Smoke report JSON](${smoke_json_url})"
            echo "- [Smoke report TXT](${smoke_txt_url})"
            echo ""
            echo "  GitHub artifacts are downloads, not hosted HTML pages — download the artifact and open \`index.html\` (HTML report) or the report files locally."
            echo ""
            echo "### Disposable E2E fixture validation"
            echo ""
            echo "- Fixture validation: \`${fixture_status}\`"
            echo "- Fixture step outcome: \`${FIXTURE_STEP_OUTCOME:-unknown}\` (conclusion: \`${FIXTURE_STEP_CONCLUSION:-unknown}\`)"
            echo "- Bootstrap status: \`${bootstrap_status}\` (outcome: \`${BOOTSTRAP_STEP_OUTCOME:-unknown}\`, conclusion: \`${BOOTSTRAP_STEP_CONCLUSION:-unknown}\`)"
            echo ""
            echo "  GitHub artifacts are downloads — open files locally; no direct raw URLs are produced."
            echo ""
            if [ "${fixture_status}" = "failed" ]; then
              echo "Fixture verification failed: smoke was not allowed to run because the target plant/grow/tent did not match the expected disposable E2E fixture. No diary entries were written."
            fi
            if [ "${SHOULD_RUN}" = "true" ]; then
              echo "- Smoke executed: yes"
              echo "- Smoke step outcome: \`${SMOKE_STEP_OUTCOME:-unknown}\` (conclusion: \`${SMOKE_STEP_CONCLUSION:-unknown}\`)"
              echo ""
              echo "### Smoke run"
              echo ""
              echo "- Command: \`bun run e2e:quicklog-smoke\`"
              echo "- Browser: \`chromium\`"
              echo "- Playwright: \`${PLAYWRIGHT_VERSION:-unavailable}\`"
              echo "- Playwright retries per test: \`${PLAYWRIGHT_RETRIES:-1}\` (override via workflow_dispatch \`playwright_retries\` input)"
              echo ""
              echo "  Retry artifacts: a flake produces per-attempt trace zips, videos, and screenshots under \`test-results/<test>-retry1/\`. Compare the original attempt and \`retry1\` to distinguish a regression (fails both) from a flake (passes on retry)."
              echo ""
              echo "### Smoke counts"
              echo ""
              if [ "${SMOKE_COUNTS_AVAILABLE}" = "true" ]; then
                echo "| total | passed | failed | skipped |"
                echo "| ----- | ------ | ------ | ------- |"
                echo "| ${SMOKE_TOTAL} | ${SMOKE_PASSED} | ${SMOKE_FAILED} | ${SMOKE_SKIPPED} |"
              else
                echo "Smoke counts unavailable: report JSON was not produced."
              fi
              echo ""
              echo "### Failure annotation"
              echo ""
              echo "- Smoke step outcome: \`${SMOKE_STEP_OUTCOME:-unknown}\`"
              echo "- Smoke step conclusion: \`${SMOKE_STEP_CONCLUSION:-unknown}\`"
              echo "- Report JSON present: \`${REPORT_JSON_PRESENT:-unknown}\`"
              echo "- Report parse status: \`${REPORT_PARSE_STATUS:-unknown}\`"
              echo ""
              if [ "${SMOKE_STEP_OUTCOME}" = "failure" ] || [ "${SMOKE_STEP_CONCLUSION}" = "failure" ]; then
                echo "Smoke command failed: the Playwright smoke step did not complete successfully. Inspect \`quicklog-smoke-report.txt\`, Playwright trace, screenshots, and videos."
              fi
              case "${REPORT_PARSE_STATUS}" in
                parsed)
                  echo "Report parsing succeeded: smoke counts were extracted from \`quicklog-smoke-report.json\`."
                  ;;
                missing)
                  echo "Report JSON missing: smoke count parsing could not run because the report JSON was not produced. The artifact guard should fail this job after a real smoke attempt."
                  ;;
                failed)
                  echo "Report parsing failed: smoke counts could not be extracted from \`quicklog-smoke-report.json\`. This is a metadata/report parsing problem, not automatically the same as a Playwright smoke failure."
                  if [ -n "${REPORT_PARSE_ERROR}" ]; then
                    echo ""
                    echo "  Sanitized parse error: \`${REPORT_PARSE_ERROR}\`"
                  fi
                  ;;
                *)
                  echo "Report parse status unknown."
                  ;;
              esac
              echo ""
              echo "### Artifacts"
              echo ""
              echo "- Bundled artifact: \`quicklog-smoke-artifacts\` (retention: 30 days)"
              echo "- Playwright HTML report artifact: \`quicklog-playwright-report\` (retention: 30 days)"
              echo "- Playwright traces artifact: \`quicklog-playwright-traces\` (retention: 30 days)"
              echo "- Playwright media artifact: \`quicklog-playwright-media\` (retention: 30 days)"
              echo "- Smoke report JSON artifact: \`quicklog-smoke-report-json\` (retention: 30 days)"
              echo "- Smoke report TXT artifact: \`quicklog-smoke-report-txt\` (retention: 30 days)"
              echo "- Run artifacts page: ${ARTIFACTS_URL}"
              echo ""
              echo "Bundled contents:"
              echo ""
              echo "- \`e2e/results/quicklog-smoke-report.json\`"
              echo "- \`e2e/results/quicklog-smoke-report.txt\`"
              echo "- \`playwright-report/\`"
              echo "- \`test-results/\`"
              echo ""
              echo "### Troubleshooting"
              echo ""
              echo "Open \`quicklog-smoke-report.txt\` first (then the JSON sibling) and find the first \`✗\` line. Then inspect the matching Playwright trace, screenshots, and video under \`playwright-report/\` and \`test-results/\`."

            else
              echo "- Smoke executed: no (skipped)"
              echo ""
              echo "### Skipped: required Quick Log smoke configuration was unavailable"
              echo ""
              echo "Missing required Quick Log smoke configuration prevented execution."
              echo ""
              echo "Tent + Plant fixture names are required; Grow name is optional."
              echo "Required configuration (names only — values are never printed):"
              echo ""
              echo "- \`vars.E2E_BASE_URL\`"
              echo "- \`vars.E2E_GROW_1_PLANT_URL\`"
              echo "- \`secrets.E2E_TEST_EMAIL\`"
              echo "- \`secrets.E2E_TEST_PASSWORD\`"
              echo "- \`vars.E2E_FIXTURE_MODE\`"
              echo "- \`vars.E2E_FIXTURE_EXPECTED_TENT_NAME\`"
              echo "- \`vars.E2E_FIXTURE_EXPECTED_PLANT_NAME\`"
              echo ""
              echo "Optional configuration (names only — values are never printed):"
              echo ""
              echo "- \`vars.E2E_FIXTURE_EXPECTED_GROW_NAME\`"
              echo ""

              if [ -n "${MISSING_CONFIG}" ]; then
                echo "Missing in this run:"
                echo ""
                # MISSING_CONFIG is a comma-separated list of NAMES only.
                IFS=',' read -ra _names <<< "${MISSING_CONFIG}"
                for n in "${_names[@]}"; do
                  echo "- \`${n}\`"
                done
                echo ""
              fi
              if [ "${EVENT_NAME}" = "pull_request" ] || [ "${EVENT_NAME}" = "push" ]; then
                echo "This is a clean skip for the \`${EVENT_NAME}\` event — forks and branch contexts without access to E2E vars/secrets are expected to skip without failing."
              elif [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
                echo "On \`workflow_dispatch\`, missing required configuration fails fast in the \`Verify required configuration\` step before later steps run. Configure the Actions vars/secrets above and re-dispatch."
              fi
              echo ""
              echo "No smoke artifacts were produced because the smoke did not execute."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
