name: Mobile 375px horizontal overflow (mocked)

# Real-layout proof for #2203: Timeline, Plant Detail and Dashboard at 375x812
# must not widen the document or the page root (scrollWidth <= clientWidth).
# jsdom performs no CSS layout, so this lane is the measurement; the Vitest
# suite only pins the per-component class contract.
#
# SAFETY:
#  - Mocked / non-destructive only. The spec fulfils /auth/v1, /rest/v1,
#    /storage/v1 and /functions/v1 itself, so no request reaches Supabase.
#  - No real accounts created, no real grow data touched, no secrets read.
#  - Uses the SAFE pull_request event only — never the elevated PR target event.
#  - No schedule/cron trigger.

on:
  pull_request:
    branches: [verdant-grow-diary]
    paths:
      - "e2e/mobile-horizontal-overflow-2203.spec.ts"
      - "src/**"
      - "playwright.config.ts"
      - "vite.config.ts"
      - "tsconfig.json"
      - ".env"
      - ".env.development"
      - ".github/workflows/mobile-horizontal-overflow-2203-smoke.yml"
      - "package.json"
      - "bun.lock"
      - "bun.lockb"
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  mobile-horizontal-overflow-2203:
    name: Mobile 375px horizontal overflow (mocked / non-destructive)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('bun.lock', 'bun.lockb', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-chromium-

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Install Chromium only (with deps)
        run: bunx playwright install chromium --with-deps

      - name: Run the 375x812 Timeline / Plant Detail / Dashboard overflow proof
        run: bunx playwright test e2e/mobile-horizontal-overflow-2203.spec.ts --project=chromium-mocked

      - name: Upload Playwright report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mobile-horizontal-overflow-2203-playwright-report
          path: playwright-report
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload Playwright test-results
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mobile-horizontal-overflow-2203-test-results
          path: test-results
          retention-days: 14
          if-no-files-found: ignore
