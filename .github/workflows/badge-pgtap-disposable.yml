name: Badge pgTAP (disposable local DB)

# Every pull request runs this result. There is no path filter and the job is
# not opt-in. The stack is a disposable local Supabase on loopback. It never
# touches the hosted project.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [main, verdant-grow-diary]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  badge-pgtap:
    name: badge pgTAP (disposable local DB)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Cache apt archives (postgresql-client)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-postgresql-client-v1
          restore-keys: |
            ${{ runner.os }}-apt-postgresql-client-

      - name: Install psql client
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Cache Supabase CLI state
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.supabase
          key: ${{ runner.os }}-supabase-cli-2.109.1-${{ hashFiles('supabase/config.toml') }}
          restore-keys: |
            ${{ runner.os }}-supabase-cli-2.109.1-

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v1
        with:
          version: 2.109.1

      - name: Prepare immutable migration replay workspace
        run: |
          set -euo pipefail
          REPLAY_WORKDIR="${RUNNER_TEMP}/verdant-supabase-replay"
          node scripts/prepare-local-supabase-replay.mjs \
            --output="${REPLAY_WORKDIR}" \
            --json \
            | tee migration-replay-compatibility.json
          echo "SUPABASE_REPLAY_WORKDIR=${REPLAY_WORKDIR}" >> "$GITHUB_ENV"

      - name: Start local Supabase (disposable, loopback only)
        run: |
          set -euo pipefail
          if ! supabase start --workdir "$SUPABASE_REPLAY_WORKDIR" >"${RUNNER_TEMP}/badge-pgtap-supabase-start.log" 2>&1; then
            echo "::error::Disposable local Supabase failed to start"
            exit 1
          fi

      - name: Export loopback database settings
        run: |
          set -euo pipefail
          DB_URL="$(supabase status --workdir "$SUPABASE_REPLAY_WORKDIR" -o json | jq -r '.DB_URL // .db_url // empty')"
          if [ -z "$DB_URL" ]; then
            echo "BLOCKED: local Supabase did not expose DB_URL." >&2
            exit 2
          fi
          echo "::add-mask::$DB_URL"
          node --input-type=module -e '
            import { appendFileSync } from "node:fs";
            const raw = process.argv[1];
            const u = new URL(raw);
            const host = u.hostname.replace(/^\[|\]$/g, "");
            if (!["localhost", "127.0.0.1", "::1"].includes(host)) {
              console.error(`BLOCKED: refusing non-loopback DB host ${host}`);
              process.exit(2);
            }
            if (!u.port) {
              console.error("BLOCKED: DB_URL has no port");
              process.exit(2);
            }
            const user = decodeURIComponent(u.username);
            const pass = decodeURIComponent(u.password);
            if (!user || pass === "") {
              console.error("BLOCKED: DB_URL is missing user or password");
              process.exit(2);
            }
            process.stdout.write(`::add-mask::${pass}\n`);
            appendFileSync(
              process.env.GITHUB_ENV,
              `PGHOST=${host}\nPGPORT=${u.port}\nPGUSER=${user}\nPGPASSWORD=${pass}\n`,
            );
          ' "$DB_URL"

      - name: Apply migrations + prod-parity seed
        shell: bash
        run: supabase db reset --workdir "$SUPABASE_REPLAY_WORKDIR"

      - name: pgTAP — happy
        shell: bash
        run: bash scripts/run-badge-pgtap-disposable.sh --sql supabase/tests/badge_awards_permissions.sql

      - name: pgTAP — wrong token
        shell: bash
        run: bash scripts/run-badge-pgtap-disposable.sh --sql supabase/tests/badge_awards_permissions.sql --wrong-token

      - name: pgTAP — missing token
        shell: bash
        run: bash scripts/run-badge-pgtap-disposable.sh --sql supabase/tests/badge_awards_permissions.sql --missing-token

      - name: pgTAP — seed nonempty
        shell: bash
        run: bash scripts/run-badge-pgtap-disposable.sh --sql supabase/tests/badge_awards_permissions.sql --seed-nonempty

      - name: pgTAP — forced session-2 failure
        shell: bash
        run: bash scripts/run-badge-pgtap-disposable.sh --sql supabase/tests/badge_awards_permissions.sql --force-session2-failure

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: badge-pgtap-disposable-logs
          path: |
            migration-replay-compatibility.json
            ${{ runner.temp }}/verdant-supabase-replay/local-supabase-replay-report.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop local Supabase
        if: always()
        run: supabase stop --workdir "$SUPABASE_REPLAY_WORKDIR" --no-backup || true
