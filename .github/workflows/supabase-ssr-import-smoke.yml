name: Supabase SSR import smoke

on:
  pull_request:
    paths:
      - "src/integrations/supabase/client.ts"
      - "src/lib/**ssr**"
      - "src/lib/**Storage**"
      - "src/lib/mcp/browserOAuthClient.ts"
      - "src/server.ts"
      - "scripts/test-supabase-client-ssr-import.ts"
      - ".github/workflows/supabase-ssr-import-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Import Supabase client in hostile SSR runtime
        run: bunx vite-node --config vite.config.ts scripts/test-supabase-client-ssr-import.ts
