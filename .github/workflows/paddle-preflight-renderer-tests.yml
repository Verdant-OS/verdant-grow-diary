name: Paddle preflight renderer tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  renderer-tests:
    name: node --test (renderer)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Full renderer suite for scripts/render-paddle-craft-preflight-comment.mjs.
      # Runs `node --test` (no vitest) so it can't hang the full-suite runner,
      # and fails the build on any regression in the comment/verdict rules.
      - name: Run renderer test suite
        run: bun run test:paddle-craft-preflight-renderer
