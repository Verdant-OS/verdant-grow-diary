name: Cursor SDK local orchestration spike

on:
  pull_request:
    branches: [main, verdant-grow-diary]
    paths:
      - "spikes/cursor-sdk-local-orchestration/**"
      - "src/**"
      - "scripts/**"
      - "supabase/functions/**"
      - "package.json"
      - "bun.lock"
      - "package-lock.json"
      - ".github/workflows/cursor-sdk-local-orchestration.yml"
      - "src/test/cursor-sdk-production-isolation-fence.test.ts"
      - "docs/specs/cursor-sdk-local-orchestration-spike.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spike-static:
    name: Nested static proofs and production isolation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'package.json', 'spikes/cursor-sdk-local-orchestration/bun.lock', 'spikes/cursor-sdk-local-orchestration/package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Install nested spike dependencies
        working-directory: spikes/cursor-sdk-local-orchestration
        run: bun install --frozen-lockfile

      - name: Production isolation fence
        run: bunx vitest run src/test/cursor-sdk-production-isolation-fence.test.ts --reporter=dot

      - name: Nested typecheck and tests
        working-directory: spikes/cursor-sdk-local-orchestration
        run: bun run validate

      - name: Nested dependency audit
        working-directory: spikes/cursor-sdk-local-orchestration
        run: bun audit
