name: Codex MCP sensor source-confidence slice (one-shot)

on:
  push:
    branches:
      - codex/mcp-sensor-source-confidence
    paths:
      - .github/workflows/codex-mcp-sensor-source-confidence-once.yml

permissions:
  contents: write

concurrency:
  group: codex-mcp-sensor-source-confidence-once
  cancel-in-progress: false

jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_SHA: 5e75a3a3ae85b4bc3821ed1d1ca2caae1e756859
      PATCH_PATH: .codex/mcp-sensor-confidence-patch.mjs
      WORKFLOW_PATH: .github/workflows/codex-mcp-sensor-source-confidence-once.yml

    steps:
      - name: Checkout isolated feature branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: codex/mcp-sensor-source-confidence

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: RED — prove the publication-boundary regression fails first
        shell: bash
        run: |
          set +e
          bunx vitest run src/test/mcp-sensor-source-confidence.test.ts --reporter=verbose > /tmp/mcp-red.log 2>&1
          status=$?
          set -e
          cat /tmp/mcp-red.log
          if [ "$status" -eq 0 ]; then
            echo "::error::Expected the new MCP source-confidence regression to fail before implementation."
            exit 1
          fi
          grep -q "mcp-sensor-source-confidence.test.ts" /tmp/mcp-red.log
          echo "Observed expected RED test exit: $status"

      - name: Implement canonical MCP source and derived confidence
        run: node "$PATCH_PATH"

      - name: Format authored TypeScript and manifest
        run: bunx prettier --write src/lib/operatorAccountReadModels.ts src/lib/mcp/tools/get-latest-sensor-snapshot.ts src/lib/mcp/manifestView.ts src/test/operator-account-read-models.test.ts src/test/mcp-sensor-source-confidence.test.ts .lovable/mcp/manifest.json

      - name: GREEN — focused MCP and sensor snapshot regression suite
        run: bunx vitest run src/test/mcp-sensor-source-confidence.test.ts src/test/operator-account-read-models.test.ts src/test/mcp-ecowitt-provenance-fence.test.ts src/test/mcp-tools-schema-safety.test.ts src/test/mcp-manifest-drift.test.ts src/test/sensor-source-rules.test.ts --reporter=verbose

      - name: Typecheck
        run: bun run typecheck

      - name: Confirm pinned base has the same validator lint debt
        shell: bash
        run: |
          git show "$BASE_SHA":src/lib/operatorAccountReadModels.ts > /tmp/operator-base.ts
          set +e
          bunx eslint --stdin --stdin-filename src/lib/operatorAccountReadModels.ts < /tmp/operator-base.ts > /tmp/operator-base-lint.log 2>&1
          status=$?
          set -e
          cat /tmp/operator-base-lint.log
          if [ "$status" -eq 0 ]; then
            echo "::error::Expected the pinned base file to reproduce its two validator order findings."
            exit 1
          fi
          grep -Fq "'validatePh' was used before it was defined" /tmp/operator-base-lint.log
          grep -Fq "'validateEcWithUnit' was used before it was defined" /tmp/operator-base-lint.log
          echo "Pinned base reproduces both imported-validator no-use-before-define findings."

      - name: Targeted lint excluding only proven baseline validator-order debt
        run: bunx eslint src/lib/operatorAccountReadModels.ts src/lib/mcp/tools/get-latest-sensor-snapshot.ts src/lib/mcp/manifestView.ts src/test/operator-account-read-models.test.ts src/test/mcp-sensor-source-confidence.test.ts --rule '{"@typescript-eslint/no-use-before-define":"off"}'

      - name: Verify safety and pinned tool surface
        shell: bash
        run: |
          git diff --check
          grep -q 'source: SensorSource;' src/lib/operatorAccountReadModels.ts
          grep -q 'confidence: number;' src/lib/operatorAccountReadModels.ts
          ! grep -q 'source: row.source' src/lib/operatorAccountReadModels.ts
          ! grep -q 'source: row.source' supabase/functions/mcp/index.ts
          grep -Fq 'confidence: ${r.confidence}' src/lib/mcp/tools/get-latest-sensor-snapshot.ts
          grep -Fq 'confidence: ${r.confidence}' supabase/functions/mcp/index.ts

          git show "$BASE_SHA":.lovable/mcp/manifest.json > /tmp/base-mcp-manifest.json
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          const base = JSON.parse(readFileSync("/tmp/base-mcp-manifest.json", "utf8"));
          const next = JSON.parse(readFileSync(".lovable/mcp/manifest.json", "utf8"));
          const shape = (manifest) =>
            manifest.mcp.tools.map(({ name, inputSchema }) => ({ name, inputSchema }));
          assert.deepEqual(shape(next), shape(base), "MCP tool names or input schemas changed");
          NODE

          if git diff --name-only "$BASE_SHA" | grep -Eq '^(tools/ecowitt-testbench/|supabase/migrations/|src/.*/(Timeline|Alert|ActionQueue)|src/pages/.+SensorSnapshot)'; then
            echo "::error::Forbidden ownership or schema path changed."
            exit 1
          fi

      - name: Remove harness and commit verified slice
        shell: bash
        run: |
          rm "$PATCH_PATH" "$WORKFLOW_PATH"
          git add -A
          git diff --cached --check
          git config user.name "Codex"
          git config user.email "72639960+cheekhimself@users.noreply.github.com"
          git commit -m "fix(mcp): canonicalize sensor sources and derive confidence"

          actual="$(git diff --name-only "$BASE_SHA"...HEAD | sort)"
          expected="$(printf '%s\n' '.lovable/mcp/manifest.json' 'src/lib/mcp/manifestView.ts' 'src/lib/mcp/tools/get-latest-sensor-snapshot.ts' 'src/lib/operatorAccountReadModels.ts' 'src/test/mcp-sensor-source-confidence.test.ts' 'src/test/operator-account-read-models.test.ts' 'supabase/functions/mcp/index.ts' | sort)"
          diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$actual")
          git push origin HEAD:codex/mcp-sensor-source-confidence

      - name: Handoff receipt
        run: |
          {
            echo "## MCP sensor source-confidence handoff";
            echo "";
            echo "- RED regression observed before implementation";
            echo "- Canonical sources only at the MCP boundary";
            echo "- Numeric confidence derived in memory";
            echo "- Focused MCP/snapshot tests and typecheck passed";
            echo "- Targeted lint passed after excluding only two imported-validator order findings proven present at the pinned base SHA";
            echo "- No schema, migration, RLS, production apply, EcoWitt ingest/UI, or tool-list change";
          } >> "$GITHUB_STEP_SUMMARY"
