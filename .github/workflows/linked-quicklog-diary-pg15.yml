name: Linked Quick Log diary client-write fence PG15

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: &linked_quicklog_diary_paths
      - "supabase/migrations/20260927094000_linked_quicklog_diary_client_write_fence.sql"
      - "scripts/run-linked-quicklog-diary-pg15-harness.mjs"
      - "src/test/linked-quicklog-diary-pg15-harness.test.ts"
      - "supabase/migrations/20260725024026_quicklog_dual_timestamp_foundation.sql"
      - "supabase/migrations/20260818010000_quicklog_manual_delegate_forward_repair.sql"
      - ".github/workflows/linked-quicklog-diary-pg15.yml"
  push:
    branches: [verdant-grow-diary]
    paths: *linked_quicklog_diary_paths
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pg15_runtime:
    name: Disposable PostgreSQL 15 linked-companion contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15.18@sha256:bb0df8b69f086efa2cbe4b8128df2f368a362bbdadef743731a63dd0f2f24c9e
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: verdant-runtime-only
          POSTGRES_DB: verdant_linked_quicklog_diary
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d verdant_linked_quicklog_diary"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LINKED_QUICKLOG_DIARY_PG15_URL: postgresql://postgres:verdant-runtime-only@127.0.0.1:5432/verdant_linked_quicklog_diary
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client
          psql --version

      - name: Create disposable database sentinel
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: verdant-runtime-only
          PGDATABASE: verdant_linked_quicklog_diary
        run: |
          psql -X -q -v ON_ERROR_STOP=1 --single-transaction --file=- <<'SQL'
          CREATE SCHEMA verdant_linked_quicklog_diary_harness AUTHORIZATION postgres;
          REVOKE ALL ON SCHEMA verdant_linked_quicklog_diary_harness FROM PUBLIC;
          CREATE TABLE verdant_linked_quicklog_diary_harness.runtime_sentinel (
            sentinel text PRIMARY KEY
          );
          REVOKE ALL ON TABLE verdant_linked_quicklog_diary_harness.runtime_sentinel FROM PUBLIC;
          INSERT INTO verdant_linked_quicklog_diary_harness.runtime_sentinel(sentinel)
          VALUES ('verdant_linked_quicklog_diary_pg15_disposable_v1');
          SQL

      - name: Run linked-companion client-write proof
        run: node scripts/run-linked-quicklog-diary-pg15-harness.mjs
