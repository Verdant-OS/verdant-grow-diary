project_id = "knkwiiywfkbqznbxwqfh"

[functions]
  [functions.auth-email-hook]
    verify_jwt = false
  [functions.process-email-queue]
    verify_jwt = true
  [functions.rls-selftest]
    verify_jwt = false
  # AI Doctor is cost-bearing and user-scoped. Keep gateway JWT verification
  # enabled in addition to the handler's auth.getUser() check.
  [functions.ai-doctor-review]
    verify_jwt = true
  # Paid-launch gate: JWT posture pinned explicitly per function.
  # get-paddle-price requires a signed-in user (and re-verifies via
  # auth.getUser inside the function — defence in depth).
  [functions.get-paddle-price]
    verify_jwt = true
  # Webhook receivers accept Paddle requests, which carry no Supabase user
  # JWT. They grant NOTHING until the raw-body Paddle signature verifies
  # inside the function; platform JWT verification must be off or Paddle
  # deliveries would bounce at the gateway with 401 before verification.
  [functions.paddle-webhook]
    verify_jwt = false
  [functions.payments-webhook]
    verify_jwt = false
  # founder-slots-remaining is a public, read-only counter used by the
  # /pricing card. Bounded 0..100 integer only; no user data.
  [functions.founder-slots-remaining]
    verify_jwt = false
  # checkout-status re-verifies the caller JWT inside the function via
  # auth.getUser (defence in depth) but keeps platform verify_jwt off so
  # tests / previews can hit it without editing project auth config.
  [functions.checkout-status]
    verify_jwt = false
  # paddle-portal-session mints a Paddle customer-portal URL for the
  # signed-in caller. Re-verifies the caller JWT inside the function via
  # auth.getUser; keeps platform verify_jwt off for parity with the other
  # audited billing surfaces.
  [functions.paddle-portal-session]
    verify_jwt = false
  # delete-account revokes the caller's sessions and deletes their auth
  # user. Re-verifies JWT inside via auth.getUser before any destructive
  # write; service_role is only used after that check succeeds.
  [functions.delete-account]
    verify_jwt = false
  # ECOWITT bridge requests use a tent-scoped `vbt_...` bearer rather than a
  # platform JWT. The handler requires that bridge bearer and enforces its tent
  # scope before accepting any trusted reading; ordinary user JWTs are denied.
  [functions.sensor-ingest-webhook]
    verify_jwt = false
  # The direct ECOWITT canary has the same handler-level bearer verification;
  # disabling platform JWT verification only lets that strict verifier run.
  [functions.ecowitt-ingest]
    verify_jwt = false
  # Raspberry Pi bridges authenticate each request with the handler's
  # x-bridge-id / timestamp / HMAC signature contract, not a Supabase user
  # JWT. Keep the platform JWT gate off so the strict bridge verifier can run.
  [functions.pi-ingest-readings]
    verify_jwt = false
  # redeem-referral fires the verified referral credit conversion for the
  # signed-in caller. Requires a platform JWT AND re-verifies via auth.getUser
  # inside (defence in depth); the grant itself is a service-role-only RPC.
  [functions.redeem-referral]
    verify_jwt = true
  # operator-credits-audit is a read-only operator-only diagnostics surface.
  # Requires a platform-verified JWT AND re-checks public.has_role(uid,'operator')
  # inside before running any query. Returns row IDs, timestamps, enums, and
  # UUID owner identifiers only — no email/name/profile fields.
  [functions.operator-credits-audit]
    verify_jwt = true
  # edge-metrics-alert-check and edge-metrics-latest are operator-only edge
  # function metric/alert surfaces. Require a platform-verified JWT AND
  # re-check public.has_role(uid,'operator') inside via the caller-scoped
  # has_role RPC before returning anything.
  [functions.edge-metrics-alert-check]
    verify_jwt = true
  [functions.edge-metrics-latest]
    verify_jwt = true
  # Transactional email queue writes are server-only. The handler compares
  # `apikey` against SUPABASE_SECRET_KEYS (with local/legacy fallbacks) before
  # parsing any caller-controlled recipient/template fields. Gateway
  # verification stays off because opaque `sb_secret_...` keys are not JWTs.
  # Never call this function from browser code.
  [functions.send-transactional-email]
    verify_jwt = false
  # The preview, unsubscribe, and suppression handlers are invoked without a
  # Supabase user JWT (Go API / email clients) and verify their own caller
  # (LOVABLE_API_KEY, unsubscribe token, or HMAC signature) in the handler.
  [functions.preview-transactional-email]
    verify_jwt = false
  [functions.handle-email-unsubscribe]
    verify_jwt = false
  [functions.handle-email-suppression]
    verify_jwt = false

  # Explicit auth topology for every remaining committed function. These
  # user-scoped handlers require a Supabase JWT at the gateway and also verify
  # the caller inside the handler before reading entitlements or writing data.
  [functions.ai-coach]
    verify_jwt = true
  [functions.ai-cultivar-qa]
    verify_jwt = true
  [functions.create-breeding-suggestions]
    verify_jwt = true
  [functions.environment-summary-report-entitlement]
    verify_jwt = true
  [functions.live-sensor-entitlement]
    verify_jwt = true
  [functions.mint-bridge-token]
    verify_jwt = true
  [functions.premium-export-entitlement]
    verify_jwt = true
  [functions.revoke-bridge-token]
    verify_jwt = true
  [functions.save-founder-prefs]
    verify_jwt = true

  # The validation-only EcoWitt endpoint authenticates an opaque bridge token
  # inside the handler, not a Supabase JWT.
  [functions.ecowitt-real-ingest]
    verify_jwt = false

  # The generated MCP server must receive OAuth metadata and bearer requests
  # before @lovable.dev/mcp-js performs issuer/JWKS validation.
  [functions.mcp]
    verify_jwt = false
