name: Symptom Check branch E2E (mocked)

# Branch-backed, non-destructive browser proofs for the grower-facing loop and
# public symptom guides. The authenticated spec covers Plant Detail -> full
# Quick Log -> Symptom Check -> canonical RPC boundary -> Timeline evidence
# checklist. The public burden spec covers the guide hub and focused guides at
# four viewport sizes and asserts that they issue no backend writes. The
# authenticated spec intercepts every remote HTTPS request; no real account,
# Supabase row, function, AI call, Action Queue item, or device is touched.

on:
  workflow_dispatch:
  pull_request:
    branches: [verdant-grow-diary]
    paths:
      - "e2e/symptom-check-branch.spec.ts"
      - "e2e/symptom-guides-burden.spec.ts"
      - "src/**"
      - ".env"
      - ".env.development"
      - "index.html"
      - "playwright.config.ts"
      - "vite.config.ts"
      - "tailwind.config.ts"
      - "postcss.config.js"
      - "tsconfig.json"
      - "tsconfig.json"
      - "tsconfig.node.json"
      - "package.json"
      - "bun.lock"
      - "bun.lockb"
      - ".github/workflows/symptom-check-branch-e2e.yml"

permissions:
  contents: read

jobs:
  symptom-check-branch-e2e:
    name: Symptom Check branch E2E (mocked / non-destructive)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('bun.lock', 'bun.lockb', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-chromium-

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Install Chromium only (with dependencies)
        run: bunx playwright install chromium --with-deps

      - name: Run branch-backed Symptom Check and public guide burden proofs
        run: bun run test:symptom-check:e2e

      - name: Upload Playwright report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: symptom-check-branch-playwright-report
          path: playwright-report
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload Playwright test results
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: symptom-check-branch-test-results
          path: test-results
          retention-days: 14
          if-no-files-found: ignore
