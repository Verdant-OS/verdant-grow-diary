name: Grow Walk MCP codegen artifact

on:
  push:
    branches:
      - codex/verdant-grow-walk-v0
    paths:
      - .github/workflows/grow-walk-mcp-codegen-artifact.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-commit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: codex/verdant-grow-walk-v0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate and verify the executable MCP bundle
        shell: bash
        run: |
          set -euo pipefail
          bunx vite build
          test -s supabase/functions/mcp/index.ts
          grep -q 'list_grow_walk_targets' supabase/functions/mcp/index.ts
          grep -q 'get_grow_walk_context' supabase/functions/mcp/index.ts
          grep -q 'list_grow_walk_targets' .lovable/mcp/manifest.json
          grep -q 'get_grow_walk_context' .lovable/mcp/manifest.json

      - name: Commit only the generated bundle when changed
        shell: bash
        run: |
          set -euo pipefail
          git add supabase/functions/mcp/index.ts
          if git diff --cached --quiet; then
            echo "Generated MCP bundle already matches source."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: regenerate MCP bundle for Grow Walk"
          git push origin HEAD:codex/verdant-grow-walk-v0
