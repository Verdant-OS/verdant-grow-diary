# Manual E2E garden rotation — never push/schedule (destructive when execute).
name: E2E fixture garden rotation

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run (default) | execute | execute-with-diary"
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - execute
          - execute-with-diary

jobs:
  rotate:
    name: Garden rotation (${{ inputs.mode }})
    runs-on: tenki-standard-medium-4c-8g
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Unit-test rotation core
        run: bunx vitest run src/test/e2e-fixture-rotation.test.ts --reporter=dot

      - name: Run rotation CLI
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          E2E_ROTATION_ACCESS_TOKEN: ${{ secrets.E2E_ROTATION_ACCESS_TOKEN }}
          E2E_ROTATION_TARGET_PROJECT_REF: ${{ vars.E2E_ROTATION_TARGET_PROJECT_REF }}
          E2E_FIXTURE_EXPECTED_TENT_NAME: ${{ vars.E2E_FIXTURE_EXPECTED_TENT_NAME }}
          E2E_FIXTURE_EXPECTED_PLANT_NAME: ${{ vars.E2E_FIXTURE_EXPECTED_PLANT_NAME }}
          E2E_FIXTURE_EXPECTED_GROW_NAME: ${{ vars.E2E_FIXTURE_EXPECTED_GROW_NAME }}
        run: |
          set -euo pipefail
          case "${{ inputs.mode }}" in
            dry-run)
              bun run e2e:fixture:rotate:dry
              ;;
            execute)
              bun run e2e:fixture:rotate
              ;;
            execute-with-diary)
              bun run e2e:fixture:rotate:with-diary
              ;;
            *)
              echo "Unknown mode" >&2
              exit 1
              ;;
          esac