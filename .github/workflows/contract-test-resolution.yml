name: Contract test resolution

# AGENTS.md > Testing Standard: a contract test over a config must import it and
# assert on the RESOLVED value. Source-text matching cannot tell a live setting
# from one commented out, moved into a narrower scope, or duplicated — verified
# failure: `playwright-action-timeout-fence` regex-matched playwright.config.ts,
# and replacing the setting with `// was actionTimeout: 15_000, …` left the guard
# green. Tests whose claim is only answerable from source declare
# `@source-scan-justified: <reason>` so the exception is visible in the diff.
on:
  pull_request:
    paths:
      - "src/test/**"
      - "playwright.config.ts"
      - "vitest.config.ts"
      - "scripts/check-contract-test-resolution.mjs"
      - ".github/workflows/contract-test-resolution.yml"
  push:
    branches:
      - main
      - verdant-grow-diary
    paths:
      - "src/test/**"
      - "playwright.config.ts"
      - "vitest.config.ts"
      - "scripts/check-contract-test-resolution.mjs"
      - ".github/workflows/contract-test-resolution.yml"

permissions:
  contents: read

jobs:
  resolution:
    name: Config guards assert resolved values
    runs-on: tenki-standard-medium-4c-8g
    steps:
      # Org policy requires every action pinned to a full-length commit SHA.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"

      # No dependency install: the checker is dependency-free by design so this
      # gate cannot be knocked out by an unrelated install failure.
      - name: Check contract-test resolution
        run: node scripts/check-contract-test-resolution.mjs
