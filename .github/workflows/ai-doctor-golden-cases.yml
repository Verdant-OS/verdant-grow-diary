name: AI Doctor Golden Cases

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ai-doctor-golden-cases:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'bun.lockb', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # v1.4: Complete AI Doctor Phase 1 safety suite —
      # engine, context compiler, core static safety, scanner self-tests,
      # golden cases, plus the sensor-safety static scan. No dry-run.
      - name: Run complete AI Doctor Phase 1 safety suite
        run: bun run test:ai-doctor-phase1
