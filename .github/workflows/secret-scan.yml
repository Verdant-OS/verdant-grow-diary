name: Secret scan

# CLI only. gitleaks-action needs a license secret, so this job does not use it.
# Matches stay in the redacted job log and are never uploaded.

on:
  push:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan
    # A deleted branch has no after commit. Checkout would fail on that zero SHA.
    if: github.event_name != 'push' || github.event.deleted != true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Install gitleaks v8.30.1
        run: |
          set -euo pipefail
          archive="gitleaks_8.30.1_linux_x64.tar.gz"
          curl -sSfL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/${archive}"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  ${archive}" | sha256sum -c
          tar -xzf "$archive" gitleaks
          mkdir -p "$HOME/.local/bin"
          install -m 0755 gitleaks "$HOME/.local/bin/gitleaks"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          rm -f gitleaks "$archive"

      - name: Resolve scan range
        id: range
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          MERGE_GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          MERGE_GROUP_HEAD: ${{ github.event.merge_group.head_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail

          require_sha() {
            if ! printf '%s' "$1" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "scan bound is not a 40-character sha" >&2
              exit 1
            fi
          }

          case "$EVENT_NAME" in
            pull_request)
              require_sha "$PR_BASE"
              require_sha "$PR_HEAD"
              range="${PR_BASE}..${PR_HEAD}"
              ;;
            merge_group)
              require_sha "$MERGE_GROUP_BASE"
              require_sha "$MERGE_GROUP_HEAD"
              range="${MERGE_GROUP_BASE}..${MERGE_GROUP_HEAD}"
              ;;
            push)
              # Branch deletion sets after to 40 zeros, which still matches a sha.
              # There are no new commits to scan.
              if printf '%s' "$PUSH_AFTER" | grep -Eq '^0+$'; then
                echo "branch deleted; no commits to scan"
                echo "skip=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              require_sha "$PUSH_AFTER"
              # New branches use an all-zero before. A force-push leaves a real
              # before SHA that fetch-depth 0 does not contain, because it is no
              # longer on any ref. git log fails on that missing revision.
              if printf '%s' "$PUSH_BEFORE" | grep -Eq '^0+$' || ! git cat-file -e "${PUSH_BEFORE}^{commit}" >/dev/null 2>&1; then
                echo "push before is unavailable; scanning from merge-base with verdant-grow-diary" >&2
                if ! git rev-parse --verify --quiet refs/remotes/origin/verdant-grow-diary >/dev/null; then
                  git fetch --no-tags origin +refs/heads/verdant-grow-diary:refs/remotes/origin/verdant-grow-diary
                fi
                base="$(git merge-base origin/verdant-grow-diary HEAD)"
                require_sha "$base"
                range="${base}..HEAD"
              else
                require_sha "$PUSH_BEFORE"
                range="${PUSH_BEFORE}..${PUSH_AFTER}"
              fi
              ;;
            *)
              echo "unsupported event" >&2
              exit 1
              ;;
          esac

          {
            echo "range<<EOF"
            printf '%s\n' "$range"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Scan commits
        if: steps.range.outputs.skip != 'true'
        env:
          LOG_OPTS: ${{ steps.range.outputs.range }}
        run: |
          set -euo pipefail
          gitleaks git --redact --no-banner --exit-code 1 --config .gitleaks.toml --baseline-path .gitleaks-baseline.json --log-opts="$LOG_OPTS"
