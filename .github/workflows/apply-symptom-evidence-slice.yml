name: Apply symptom evidence slice

on:
  push:
    branches:
      - feature/symptom-evidence-check
  pull_request:
    branches:
      - verdant-grow-diary

permissions:
  contents: write

concurrency:
  group: apply-symptom-evidence-slice
  cancel-in-progress: false

jobs:
  apply-validate-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/symptom-evidence-check

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Apply scoped patch
        run: node scripts/apply-symptom-evidence-slice.mjs

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate diff whitespace
        run: git diff --check

      - name: Run targeted tests
        run: >-
          bunx vitest run
          src/test/symptom-check-rules.test.ts
          src/test/symptom-evidence-check-rules.test.ts
          src/test/diary-symptom-evidence-check.test.tsx
          src/test/cannabis-leaf-symptom-guide.test.tsx
          src/test/quicklog-activity-detail-fields.test.ts
          src/test/quick-log-all-activities-integration.test.tsx
          src/test/grow-diary-timeline.test.ts
          src/test/verdant-seo-guides.test.ts
          src/test/verdant-seo-guides-render.test.tsx

      - name: Typecheck
        run: bun run typecheck

      - name: Production build and SEO validators
        run: bun run build

      - name: Remove one-time patch tooling
        run: |
          rm -f scripts/apply-symptom-evidence-slice.mjs
          rm -f .github/workflows/apply-symptom-evidence-slice.yml

      - name: Commit validated implementation
        run: |
          git config user.name "verdant-build-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "feat: add symptom evidence checks and guide hub"
          git push origin HEAD:feature/symptom-evidence-check
