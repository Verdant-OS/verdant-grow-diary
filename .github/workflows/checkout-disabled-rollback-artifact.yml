name: Checkout-disabled rollback artifact

# Builds with the checkout kill switch and uploads a verification receipt.
# Does not deploy, does not set secrets, and does not register webhooks.
# This job is not one of the 35 required merge checks.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checkout-disabled-bundle:
    name: Build checkout-disabled bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build with checkout disabled
        env:
          VITE_CHECKOUT_DISABLED: "true"
        run: bun run build

      - name: Verify paused copy and no Paddle checkout init
        run: node scripts/verify-checkout-disabled-bundle.mjs

      - name: Upload rollback verification receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: checkout-disabled-rollback-receipt
          path: checkout-disabled-bundle-receipt.json
          if-no-files-found: error
