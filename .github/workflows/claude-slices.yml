name: Claude slices

on:
  issue_comment:
    types: [created]
  issues:
    types: [labeled]
  # This event runs configuration checks and the Claude branch guard only.
  # It never enters the builder or spends Claude usage.
  pull_request:
    branches: [verdant-grow-diary]
    types: [opened, synchronize, reopened, ready_for_review]
  # Merge-queue entries report here so this workflow never stalls the queue.
  # The builder and the Claude-branch guard are unreachable from this event.
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

# Builder runs share one serialized group. PR validation gets a per-PR group so
# it never waits behind a builder run and superseded PR pushes cancel. Each
# merge-queue entry gets its own group keyed on the queued head SHA, so it can
# neither wait behind a builder run nor be cancelled by a newer request.
# Concurrency is evaluated before the job `if`, so only events that pass the
# builder's own trigger gate join `builder`. Every other comment or label event
# gets a unique group and can never replace a pending real request.
concurrency:
  group: >-
    claude-slices-${{
      github.event_name == 'merge_group' && format('mq-{0}', github.event.merge_group.head_sha) ||
      github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) ||
      (github.actor == 'cheekhimself' &&
        ((github.event_name == 'issue_comment' && github.event.action == 'created' &&
          contains(github.event.comment.body, '@claude')) ||
         (github.event_name == 'issues' && github.event.action == 'labeled' &&
          github.event.label.name == 'claude-slice'))) && 'builder' ||
      format('noop-{0}', github.run_id)
    }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  claude-slices:
    name: Claude slice builder
    if: >-
      github.actor == 'cheekhimself' &&
      ((github.event_name == 'issue_comment' && github.event.action == 'created' &&
        contains(github.event.comment.body, '@claude')) ||
       (github.event_name == 'issues' && github.event.action == 'labeled' &&
        github.event.label.name == 'claude-slice'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Claude runs with a read-only workflow token: no token in this job can push,
    # merge or open a PR. The publish job below does that after the policy check.
    permissions:
      contents: read
      pull-requests: read
      issues: write
    outputs:
      publish: ${{ steps.bundle.outputs.publish }}
    steps:
      - name: Check billing configuration without exposing credentials
        id: billing
        env:
          HAS_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
          HAS_API_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        run: |
          node <<'NODE'
          const { appendFileSync } = require('node:fs');
          const mode = process.env.HAS_OAUTH_TOKEN === 'true' ? 'oauth'
            : process.env.HAS_API_KEY === 'true' ? 'api' : 'none';
          appendFileSync(process.env.GITHUB_OUTPUT, `configured=${mode !== 'none'}\nmode=${mode}\n`);
          if (mode === 'none') {
            const note = 'Claude billing secret not configured';
            console.log(note);
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${note}\n`);
          }
          NODE

      - name: Checkout the deploy branch
        if: steps.billing.outputs.configured == 'true'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: verdant-grow-diary
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare trusted locked-path policy
        if: steps.billing.outputs.configured == 'true'
        run: &locked_path_policy |
          cat > "$RUNNER_TEMP/claude-slice-policy.cjs" <<'NODE'
          const { execFileSync } = require('node:child_process');
          const { writeFileSync, readFileSync, existsSync } = require('node:fs');
          const assert = require('node:assert/strict');

          function lockedPath(raw) {
            const path = raw.replaceAll('\\', '/');
            if (!path || path.startsWith('/') || path.split('/').includes('..')) return true;
            if (/^(?:\.github|\.claude|\.grok|\.git)(?:\/|$)/i.test(path)) return true;
            if (/^(?:AGENTS|CLAUDE|GEMINI)\.md$/i.test(path)) return true;
            if (/^docs\/agents\/(?:OWNERSHIP|CURRENT_STATE)\.md$/i.test(path)) return true;
            if (/(?:^|\/)(?:supabase|migrations?|sql|rls|edge-functions?|functions)(?:\/|$)/i.test(path)) return true;
            if (/\.sql$/i.test(path)) return true;
            if (/(?:\.lockb?$|(?:^|\/)(?:package-lock\.json|npm-shrinkwrap\.json|pnpm-lock\.yaml|Pipfile\.lock)$)/i.test(path)) return true;
            if (/(?:^|\/)\.env(?:\.|$)/i.test(path)) return true;
            // Code CI executes with repository secrets: manifests (scripts), tool
            // configs and test setup. A draft could otherwise plant code there.
            if (/(?:^|\/)package\.json$/i.test(path)) return true;
            if (/(?:^|\/)(?:[tj]sconfig[^/]*\.json|\.npmrc|\.yarnrc(?:\.yml)?|bunfig\.toml|\.nvmrc|\.node-version)$/i.test(path)) return true;
            if (/(?:^|\/)[^/]+\.config\.[^/]+$/i.test(path)) return true;
            if (/(?:^|\/)(?:vitest|vite|playwright)\.(?:setup|workspace)[^/]*$/i.test(path)) return true;
            if (/(?:^|\/)(?:setup-?tests?|test-?setup|global[-_.]?(?:setup|teardown))[^/]*$/i.test(path)) return true;
            if (/^src\/test\/setup/i.test(path)) return true;
            // Prettier and legacy ESLint configs can load plugins. CI runs scripts/**
            // (ci.yml and other workflows) in jobs that hold write tokens or secrets.
            if (/(?:^|\/)(?:\.prettierrc|\.eslintrc)[^/]*$/i.test(path)) return true;
            if (/^scripts(?:\/|$)/i.test(path)) return true;
            if (/^config\/claude-slice-lock-exceptions\.json$/i.test(path)) return true;
            // Same roots as the content rules, e2e-local/ included (Codex P1 at cbc0ab0f).
            const executable = CONTENT_ROOTS.test(path) && !/\.md$/i.test(path);
            return executable && (
              /auth|oauth|rls|action[-_]?(?:queue|detail|outcome|follow[-_]?up|response[-_]?memory|completion|status)|linked[-_]?actions?|assigned[-_]?tent[-_]?actions?|live[-_]?proof[-_]?action[-_]?status|recent[-_]?action[-_]?response|device[-_]?(?:control|command)|actuator/i.test(path) ||
              /(?:^|\/)(?:actions|edge)(?:[/._]|$)/i.test(path)
            );
          }

          // Content locks. A file that calls Supabase auth mutations or reads or
          // writes the Action Queue is locked whatever its name (Matthew, 2026-10-06:
          // D1 auth mutations plus onAuthStateChange; D2 Action Queue reads and writes
          // only; D3 tests too; D4 reviewed exceptions). Regexes over text: a helper
          // with a neutral name that wraps these calls is not followed (deferred).
          const CONTENT_ROOT_DIRS = ['src', 'scripts', 'tests', 'e2e', 'e2e-local', 'packages'];
          const CONTENT_ROOTS = new RegExp(`^(?:${CONTENT_ROOT_DIRS.join('|')})/`, 'i');
          // mfa.* and resend are covered too (Durban Poison P2-A, 2026-10-06).
          const AUTH_CALLS = '(?:signIn\\w*|signOut|signUp|updateUser|resetPassword\\w*|exchangeCode\\w*|verifyOtp|setSession|refreshSession|onAuthStateChange|admin|mfa|resend|reauthenticate|linkIdentity|unlinkIdentity)\\b';
          // The auth namespace: auth as an identifier or property (not "/auth" or
          // "oauth"), or ["auth"].
          const AUTH = '(?:(?<![\\w$/\\\\-])auth\\b|\\[\\s*[\'"`]auth[\'"`]\\s*\\])';
          // What may sit between the namespace and the call or terminator:
          // (supabase.auth).x, (supabase.auth as any).x, supabase.auth!.x,
          // supabase.auth as AuthClient, ... satisfies T. Bounded, so it can't stall.
          // After those, one cast of any type on the same line is allowed too:
          // nested generics, function types, import("x").T (Codex P1 at cbc0ab0f).
          const AUTH_TAIL = '(?:\\s*(?:\\)|!(?!=)|\\b(?:as|satisfies)\\s+[\\w$.]{1,200}(?:<[^<>()\\n]{0,200}>)?(?:\\[\\])?)){0,6}' +
            '(?:\\s*\\b(?:as|satisfies)\\s+[^;\\n]{1,300}?(?:\\s*(?:\\)|!(?!=))){0,6})?';
          // End of an alias or destructure statement: ";", end of file, or a line
          // break that ASI ends (the next line doesn't continue the expression).
          const STMT_END = '[\\t ]*(?:;|$|\\r?\\n(?!\\s*[-?.:\\[(&|,+*/%<>=!^~]))';
          const AQ_NAMES = '(?:action_queue|action_queue_events|action_queue_create|action_queue_transition|action_queue_guard_decision_fields)';
          // Every pattern of a rule is tried; a file can match several rules.
          const CONTENT_RULES = [
            ['auth-mutation', [
              // supabase.auth.signOut(), auth?.signOut(), supabase["auth"].admin.createUser()
              // (supabase.auth).signOut(), (supabase.auth as any).signOut(), auth!.signOut()
              new RegExp(`${AUTH}${AUTH_TAIL}\\s*\\??\\.\\s*${AUTH_CALLS}`),
              // auth["signOut"](), auth?.[name](): bracket access on the namespace, unless
              // the key is a plain literal that isn't a D1 member (auth["getUser"] is the
              // read-only getUser(); Codex P2 at 805b256c).
              new RegExp(`${AUTH}${AUTH_TAIL}\\s*(?:\\?\\.)?\\s*\\[(?!\\s*(['"\`])(?!${AUTH_CALLS})[\\w$]+\\1\\s*\\])`),
              // const { signOut } = supabase.auth; const { data, signOut: out } = (await c()).auth;
              // also without the trailing ";" (ASI) and with a cast.
              new RegExp(`\\{(?:[^{}]{0,2000},)?\\s*${AUTH_CALLS}\\s*(?::\\s*[\\w$]+\\s*)?(?:,[^{}]{0,2000})?\\}\\s*=\\s*[^;=]{0,2000}?${AUTH}${AUTH_TAIL}${STMT_END}`),
              // const a = supabase.auth; return client["auth"]; const a = supabase.auth as AuthClient
              // and supabase\n  .auth; across lines (the namespace escapes).
              new RegExp(`(?:=|\\breturn\\b)\\s*[^;=]{0,2000}?(?:\\??\\.\\s*auth\\b|\\[\\s*['"\`]auth['"\`]\\s*\\])${AUTH_TAIL}${STMT_END}`),
              // const { auth: a } = supabase;
              /\{[^{}]{0,2000}\bauth\s*:\s*[\w$]+[^{}]{0,2000}\}\s*=/,
            ]],
            ['aq-io', [
              // .from("action_queue"), ?.rpc('action_queue_create'), .from<Row>(`action_queue_events`)
              /\??\.\s*(?:from|rpc)\s*(?:<[^()]*?>)?\s*\(\s*['"`][a-z_]*action_queue[a-z_]*['"`]/,
              // const TABLE = "action_queue"; db.from(TABLE). Only a declaration: a bare
              // literal also sits in generated types, view models and source-scan tests.
              new RegExp(`\\b(?:const|let|var)\\s+[\\w$]+\\s*(?::[^=]+)?=\\s*(['"\`])${AQ_NAMES}\\1`),
            ]],
          ];
          const EXCEPTIONS_FILE = 'config/claude-slice-lock-exceptions.json';

          function contentScoped(path) {
            return CONTENT_ROOTS.test(path) && !/\.md$/i.test(path);
          }

          // The text with // and /* */ comments blanked (a block comment keeps its
          // line breaks), so supabase.auth /* c */ .signOut() and
          // db.from(/* c */ "action_queue") match (Codex P1s, 2026-10-07).
          // The text with the given [start, end) comment ranges blanked.
          function blankRanges(text, ranges) {
            if (!ranges.length) return text;
            let out = '';
            let last = 0;
            for (const [from, to] of ranges) {
              out += text.slice(last, from) + text.slice(from, to).replace(/[^\n]/g, ' ');
              last = to;
            }
            return out + text.slice(last);
          }

          // End of the comment starting at i (after its "*/", or at its line break).
          function commentEnd(text, i) {
            const block = text[i + 1] === '*';
            const end = block ? text.indexOf('*/', i + 2) : text.indexOf('\n', i);
            return end === -1 ? text.length : block ? end + 2 : end;
          }

          // \uXXXX, \u{X…} and \xXX escapes decoded, in identifiers and strings alike.
          function decodeEscapes(text) {
            if (!text.includes('\\')) return text;
            // A backslash before a line break is a line continuation inside a string
            // (CodeRabbit at 6deb747b): "action_\<newline>queue".
            return text.replace(/\\u\{([0-9a-fA-F]{1,6})\}|\\u([0-9a-fA-F]{4})|\\x([0-9a-fA-F]{2})|\\(?:\r\n|[\n\r\u2028\u2029])/g, (match, braced, four, two) => {
              if (!braced && !four && !two) return '';
              const code = parseInt(braced || four || two, 16);
              return code <= 0x10ffff ? String.fromCodePoint(code) : match;
            });
          }

          // End of the balanced TypeScript type starting at i, or -1 if it is
          // malformed or the text ends first. Brackets ( [ { < nest, strings are
          // skipped, the ">" of "=>" doesn't close. With stopAtTop, the type also ends
          // at depth 0 before ) ] } ; , = or a line break, unless a | or & on either
          // side of the break continues it (Codex P1 at dac72d14); otherwise it ends
          // after the first bracket closes. In strict mode (code-only text), a type
          // still open after 2,000 characters throws, so the file locks rather than
          // slipping through (Codex P1 at dac72d14).
          const TYPE_OPEN = { '(': ')', '[': ']', '{': '}', '<': '>' };
          // Whether a top-level line break inside a type continues it, following
          // TypeScript's parser: a qualified name (.), union (|), intersection (&),
          // function type (=>), a keyword that needs an operand, and a conditional
          // type's ? and : carry across a break; type arguments (<), array types
          // ([) and extends don't (Codex P1 at 2dc5d761).
          const TYPE_PREFIX_WORDS = /(?<![\w$])(?:keyof|typeof|infer|readonly|unique|extends)$/;
          function typeContinues(text, last, lastAt, k, conditional) {
            const next = text[k];
            if (next === '.' || next === '|' || next === '&' || (next === '=' && text[k + 1] === '>')) return true;
            if (conditional && (next === '?' || next === ':')) return true;
            if (last === '.' || last === '|' || last === '&' || (last === '>' && text[lastAt - 1] === '=')) return true;
            if (conditional && (last === '?' || last === ':')) return true;
            return lastAt >= 0 && TYPE_PREFIX_WORDS.test(text.slice(Math.max(0, lastAt - 8), lastAt + 1));
          }
          function typeEnd(text, i, stopAtTop, budget, strict) {
            const stack = [];
            const limit = Math.min(text.length, i + 2000);
            let j = i;
            let last = '';
            let lastAt = -1;
            let conditional = false;
            while (j < limit) {
              if (--budget.left < 0) throw new Error('type-scan budget');
              const c = text[j];
              if (!stack.length && stopAtTop && c === '\n') {
                let k = j + 1;
                while (k < limit && /\s/.test(text[k])) k += 1;
                if (!typeContinues(text, last, lastAt, k, conditional)) return j;
              } else if (!stack.length && stopAtTop && (c === ')' || c === ']' || c === '}' || c === ';' || c === ',' || (c === '=' && text[j + 1] !== '>'))) return j;
              if (!/\s/.test(c)) {
                last = c;
                lastAt = j;
                if (!stack.length && c === 's' && /(?<![\w$])extends$/.test(text.slice(Math.max(i, j - 7), j + 1))) conditional = true;
              }
              if (c === "'" || c === '"' || c === '`') {
                let k = j + 1;
                while (k < limit && text[k] !== c && text[k] !== '\n') k += text[k] === '\\' ? 2 : 1;
                j = k + 1;
                continue;
              }
              if (TYPE_OPEN[c]) stack.push(TYPE_OPEN[c]);
              else if (c === ')' || c === ']' || c === '}' || (c === '>' && text[j - 1] !== '=')) {
                if (stack.pop() !== c) return -1;
                if (!stack.length && !stopAtTop) return j + 1;
              }
              j += 1;
            }
            if (strict && j >= limit && limit < text.length) throw new Error('type-scan budget');
            return stopAtTop && !stack.length ? j : -1;
          }

          // The text with each "as T" / "satisfies T" cast and each .from<T> / .rpc<T>
          // type argument blanked (line breaks kept), so object, multi-line and
          // parenthesized types can't hide a call: (supabase.auth as { signOut():
          // void; }).signOut() and db.from<("action_queue")>("action_queue") (Codex
          // P1s at cb216998). A type that doesn't close is left alone. The scan
          // shares a budget across a file's versions; contentLocked locks a file
          // that runs out of it instead of skipping it.
          function typeRanges(text, budget, strict) {
            const ranges = [];
            const re = /(?<![\w$.])(?:as|satisfies)\s+(?=[^\s=;,)\]}])|\.\s*(?:from|rpc)\s*(?=<)/g;
            let m;
            while ((m = re.exec(text))) {
              const isCast = m[0][0] !== '.';
              const start = isCast ? m.index : m.index + m[0].length;
              const end = typeEnd(text, m.index + m[0].length, isCast, budget, strict);
              if (end > start) {
                ranges.push([start, end]);
                re.lastIndex = end;
              }
            }
            return ranges;
          }

          // Every // and /* counts, even inside strings; this catches what the
          // lexer below misreads. One linear pass.
          function stripCommentsNaive(text) {
            const ranges = [];
            let i = text.indexOf('/');
            while (i !== -1 && i < text.length) {
              if (text[i + 1] === '/' || text[i + 1] === '*') {
                const stop = commentEnd(text, i);
                ranges.push([i, stop]);
                i = text.indexOf('/', stop);
              } else {
                i = text.indexOf('/', i + 1);
              }
            }
            return blankRanges(text, ranges);
          }

          // A small JS lexer, one linear pass: strings, regex literals and template
          // literals are kept as they are, the code inside a template's ${...} is
          // lexed as code (Codex P1 at 43faeed5), and comments are blanked.
          const REGEX_BEFORE = new Set(['', '(', ',', '=', ':', '[', '!', '&', '|', '?', '{', ';', '+', '-', '*', '%', '<', '>', '~', '^']);
          const REGEX_KEYWORDS = new Set(['return', 'typeof', 'instanceof', 'in', 'of', 'new', 'delete', 'void', 'throw', 'case', 'do', 'else', 'yield', 'await']);
          function isWordChar(code) {
            return (code >= 48 && code <= 57) || (code >= 65 && code <= 90) || (code >= 97 && code <= 122) || code === 95 || code === 36;
          }
          // Returns the comment ranges, and the literal ranges: string and regex
          // bodies and template text outside ${...}.
          function lexRanges(text) {
            const ranges = [];
            const literals = [];
            const n = text.length;
            let i = 0;
            let prev = '';
            // Contexts above top-level code: 'template', or a ${...} expression with its brace depth.
            const stack = [];
            while (i < n) {
              const top = stack[stack.length - 1];
              const c = text[i];
              if (top && top.kind === 'template') {
                if (c === '\\') i += 2;
                else if (c === '`') { literals.push([top.start, i]); i += 1; stack.pop(); prev = 'x'; }
                else if (c === '$' && text[i + 1] === '{') { literals.push([top.start, i]); i += 2; stack.push({ kind: 'expr', depth: 0 }); prev = ''; }
                else i += 1;
                continue;
              }
              if (c === '/' && (text[i + 1] === '/' || text[i + 1] === '*')) {
                const stop = commentEnd(text, i);
                ranges.push([i, stop]);
                i = stop;
              } else if (c === '/' && REGEX_BEFORE.has(prev)) {
                // A regex literal: up to 200 characters on one line, else division.
                let j = i + 1;
                let inClass = false;
                while (j < n && j - i < 200 && text[j] !== '\n' && (inClass || text[j] !== '/')) {
                  if (text[j] === '\\') j += 1;
                  else if (text[j] === '[') inClass = true;
                  else if (text[j] === ']') inClass = false;
                  j += 1;
                }
                if (text[j] === '/') {
                  literals.push([i + 1, j]);
                  j += 1;
                  while (j < n && text.charCodeAt(j) >= 97 && text.charCodeAt(j) <= 122) j += 1;
                  i = j;
                  prev = 'x';
                } else {
                  i += 1;
                  prev = c;
                }
              } else if (c === "'" || c === '"') {
                let j = i + 1;
                while (j < n && text[j] !== c && text[j] !== '\n') j += text[j] === '\\' ? 2 : 1;
                literals.push([i + 1, Math.min(j, n)]);
                i = j + 1;
                prev = 'x';
              } else if (c === '`') {
                i += 1;
                stack.push({ kind: 'template', start: i });
              } else if (c === '{') {
                if (top) top.depth += 1;
                i += 1;
                prev = c;
              } else if (c === '}') {
                if (top && top.depth === 0) {
                  stack.pop();
                  const outer = stack[stack.length - 1];
                  if (outer && outer.kind === 'template') outer.start = i + 1;
                } else if (top) top.depth -= 1;
                i += 1;
                prev = '}';
              } else if (isWordChar(text.charCodeAt(i))) {
                let j = i + 1;
                while (j < n && isWordChar(text.charCodeAt(j))) j += 1;
                prev = REGEX_KEYWORDS.has(text.slice(i, j)) ? '(' : 'x';
                i = j;
              } else {
                if (c !== ' ' && c !== '\t' && c !== '\n' && c !== '\r') prev = c;
                i += 1;
              }
            }
            // An unterminated template's text runs to the end.
            for (const ctx of stack) if (ctx.kind === 'template' && ctx.start < n) literals.push([ctx.start, n]);
            return { comments: ranges, literals };
          }
          function stripCommentsLexed(text) {
            return blankRanges(text, lexRanges(text).comments);
          }
          // The code alone: comments and literal bodies blanked, offsets kept.
          function codeOnly(text, lexed) {
            const ranges = [...lexed.comments, ...lexed.literals]
              .filter(([from, to]) => to > from)
              .sort((a, b) => a[0] - b[0]);
            const merged = [];
            for (const [from, to] of ranges) {
              const last = merged[merged.length - 1];
              if (last && from <= last[1]) last[1] = Math.max(last[1], to);
              else merged.push([from, to]);
            }
            return blankRanges(text, merged);
          }

          // AST content rules (Matthew, 2026-10-07, Option 1): the same D1/D2 rules
          // matched on a TypeScript parse of the file, so casts, comments, escapes and
          // line breaks in any form TypeScript accepts can't hide a call. Only
          // ts.createSourceFile runs; PR code is never executed. The parser is the
          // exact typescript tarball the policy step verifies against a pinned sha512.
          // These rules are OR-ed with the text versions, so they only add locks. If
          // the parser can't be loaded or throws, the file locks (fail closed).
          const AUTH_METHODS = new Set(['signOut', 'signUp', 'updateUser', 'verifyOtp', 'setSession', 'refreshSession', 'onAuthStateChange', 'admin', 'mfa', 'resend', 'reauthenticate', 'linkIdentity', 'unlinkIdentity']);
          const AUTH_METHOD_PREFIXES = ['signIn', 'resetPassword', 'exchangeCode'];
          const AQ_LITERAL = /^[a-z_]*action_queue[a-z_]*$/;
          const AQ_NAME_SET = new Set(['action_queue', 'action_queue_events', 'action_queue_create', 'action_queue_transition', 'action_queue_guard_decision_fields']);
          const AST_MAX_CHARS = 512 * 1024;
          const TS_SCRIPT_KINDS = { ts: 'TS', mts: 'TS', cts: 'TS', tsx: 'TSX', js: 'JS', mjs: 'JS', cjs: 'JS', jsx: 'JSX' };
          let tsModule;
          function loadTypeScript() {
            if (tsModule === undefined) {
              try {
                tsModule = require(`${process.env.RUNNER_TEMP}/claude-slice-ts/package/lib/typescript.js`);
              } catch {
                tsModule = null;
              }
            }
            return tsModule;
          }
          function isAuthMethod(name) {
            return AUTH_METHODS.has(name) || AUTH_METHOD_PREFIXES.some(prefix => name.startsWith(prefix));
          }
          // The rules the AST shows, or null when the file isn't JS/TS. Throws when the
          // parser is missing, so the caller fails closed.
          const ALL_RULES = ['auth-mutation', 'aq-io'];
          function astExtension(path) {
