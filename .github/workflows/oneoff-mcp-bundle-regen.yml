# One-off workflow for PR #3017 only. It regenerates the MCP edge bundle with the
# repo's own generator after the @lovable.dev/mcp-js 3.5.0 upgrade, commits the
# result back to this branch, and is removed in the next commit so it never
# lands on the base branch. No secrets, no deploy, no publish.
name: One-off MCP edge bundle regeneration (#3017)

on:
  push:
    branches:
      - claude/project-thread-qw95uh
    paths:
      - .github/workflows/oneoff-mcp-bundle-regen.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: oneoff-mcp-bundle-regen
  cancel-in-progress: false

jobs:
  regenerate:
    if: github.ref == 'refs/heads/claude/project-thread-qw95uh' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: claude/project-thread-qw95uh

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Confirm installed SDK version
        run: node -e "const p=require('./node_modules/@lovable.dev/mcp-js/package.json'); console.log(p.version); if (p.version !== '3.5.0') process.exit(1)"

      - name: Regenerate the bundle with the repo generator
        run: node scripts/sync-mcp-edge-bundle.mjs --write

      - name: Verify the bundle now matches the generator
        run: node scripts/sync-mcp-edge-bundle.mjs --check

      - name: Confirm only the generated bundle changed
        run: |
          git status --porcelain
          unexpected="$(git status --porcelain | awk '{print $2}' | grep -v '^supabase/functions/mcp/index.ts$' || true)"
          if [ -n "$unexpected" ]; then
            echo "::error::Unexpected files changed: $unexpected"
            exit 1
          fi
          git diff --stat

      - name: Commit regenerated bundle back to the branch
        run: |
          if git diff --quiet -- supabase/functions/mcp/index.ts; then
            echo "Bundle already current; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/mcp/index.ts
          git commit -m "chore(mcp): regenerate edge bundle for mcp-js 3.5.0 (#3017)" -m "Generated by scripts/sync-mcp-edge-bundle.mjs --write in the one-off workflow; not hand-edited."
          git push origin HEAD:claude/project-thread-qw95uh
