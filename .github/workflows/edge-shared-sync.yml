name: edge-shared-sync

on:
  pull_request:
    # Run on every PR — do not path-filter. A PR that only touches
    # unrelated files can still regress edge-function imports (e.g. a
    # merge of stale mirror state), so the gate must always run.
  push:
    branches: [main]

jobs:
  verify:
    name: Adopt #690 and reconcile #691 → #692 atomically
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 691 }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - name: Build and validate both stack branches before atomic push
        env:
          PARENT_BRANCH: grok/sensor-truth-canon-freshness-592
          CHILD_BRANCH: grok/sensor-truth-canon-residual-592
          PREREQ_BRANCH: codex/fix-ssr-head-snapshot-bundle-path-20260803
          EXPECTED_PARENT_TEMP: ${{ github.event.pull_request.head.sha }}
          EXPECTED_CHILD: 49db0b2e8cbc539ceb7fdc3c27f0a725cc14e884
          EXPECTED_PREREQ: 94727a2d425e8906becaeefa39ed974ca9b958ab
        run: |
          set -euo pipefail
          git config user.name "Verdant Stack Maintenance"
          git config user.email "stack-maintenance@users.noreply.github.com"

          normalize_mcp_edge_imports() {
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";

          const files = [
            {
              path: "src/lib/sensorTruthCanon.ts",
              replacements: [
                ['from "@/constants/sensorTiming";', 'from "../constants/sensorTiming";'],
                ['from "@/lib/sensorLiveMembership";', 'from "./sensorLiveMembership";'],
              ],
            },
            {
              path: "src/lib/sensor/sensorSnapshotFreshnessRules.ts",
              replacements: [
                ['from "@/lib/sensorTruthCanon";', 'from "../sensorTruthCanon";'],
              ],
            },
          ];

          for (const file of files) {
            let source = readFileSync(file.path, "utf8");
            for (const [from, to] of file.replacements) {
              source = source.replaceAll(from, to);
            }
            writeFileSync(file.path, source);
          }

          const forbidden = [
            "@/constants/sensorTiming",
            "@/lib/sensorLiveMembership",
            "@/lib/sensorTruthCanon",
          ];
          const residuals = files.flatMap(({ path }) => {
            const source = readFileSync(path, "utf8");
            return forbidden
              .filter((token) => source.includes(token))
              .map((token) => `${path}: ${token}`);
          });
          if (residuals.length > 0) {
            throw new Error(`Unresolved MCP Edge import alias(es):\n${residuals.join("\n")}`);
          }
          NODE
          }

          capture_generated_mcp_bundle() {
            git add supabase/functions/mcp/index.ts
            if ! git diff --cached --quiet; then
              git commit --amend --no-edit
            fi
          }

          clean_ephemeral_build_outputs() {
            rm -rf .output .wrangler
          }

          git fetch --no-tags origin \
            "refs/heads/${CHILD_BRANCH}:refs/remotes/stack/child" \
            "refs/heads/${PREREQ_BRANCH}:refs/remotes/stack/prereq"

          test "$(git rev-parse HEAD)" = "$EXPECTED_PARENT_TEMP"
          test "$(git rev-parse refs/remotes/stack/child)" = "$EXPECTED_CHILD"
          test "$(git rev-parse refs/remotes/stack/prereq)" = "$EXPECTED_PREREQ"

          # ---------- Parent (#691): adopt the shared prerequisite ----------
          git checkout -B stack-parent "$EXPECTED_PARENT_TEMP"
          parent_merge_base="$(git merge-base HEAD refs/remotes/stack/prereq)"
          git diff --name-only "$parent_merge_base"..HEAD > /tmp/parent-owned.txt

          if ! git merge --no-ff --no-commit refs/remotes/stack/prereq; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            for file in "${conflicts[@]}"; do
              case "$file" in
                vitest.config.ts|scripts/capture-ssr-head-snapshots-with-server.mjs|scripts/ssr-head-snapshot-paths.mjs|src/test/helpers/reactRouterCompat.vitest.tsx|src/test/router-harness-memory-router.test.tsx|src/test/ssr-head-snapshot-paths.test.ts|src/test/vitest-config-react-plugin-contract.test.ts|.github/workflows/edge-shared-sync.yml)
                  git checkout --theirs -- "$file"
                  ;;
                supabase/functions/_shared/lib/*|supabase/functions/*/*.ts)
                  git checkout --ours -- "$file"
                  ;;
                *)
                  if grep -Fxq "$file" /tmp/parent-owned.txt; then
                    git checkout --ours -- "$file"
                  else
                    git checkout --theirs -- "$file"
                  fi
                  ;;
              esac
              git add "$file"
            done
          fi
          test -z "$(git diff --name-only --diff-filter=U)"
          git checkout refs/remotes/stack/prereq -- .github/workflows/edge-shared-sync.yml
          normalize_mcp_edge_imports
          node scripts/sync-edge-shared.mjs
          git add .github/workflows/edge-shared-sync.yml \
            src/lib/sensorTruthCanon.ts \
            src/lib/sensor/sensorSnapshotFreshnessRules.ts \
            supabase/functions/_shared/lib supabase/functions/*/*.ts
          git diff --cached --check
          git commit -m "chore(stack): adopt shared Vitest and postbuild prerequisite"
          parent_final="$(git rev-parse HEAD)"

          bun install --frozen-lockfile
          bun run typecheck:tsgo
          bunx vitest run \
            src/test/router-harness-memory-router.test.tsx \
            src/test/ssr-head-snapshot-paths.test.ts \
            src/test/vitest-config-react-plugin-contract.test.ts \
            src/test/sensor-truth-canon.test.ts \
            --reporter=dot
          bun run build
          capture_generated_mcp_bundle
          parent_final="$(git rev-parse HEAD)"
          git reset --hard "$parent_final"
          clean_ephemeral_build_outputs
          test -z "$(git status --porcelain)"

          # ---------- Child (#692): merge refreshed parent, keep residuals ----------
          child_merge_base="$(git merge-base refs/remotes/stack/child "$EXPECTED_PARENT_TEMP")"
          git diff --name-only "$child_merge_base"..refs/remotes/stack/child > /tmp/child-owned.txt
          git checkout -B stack-child refs/remotes/stack/child

          if ! git merge --no-ff --no-commit "$parent_final"; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            for file in "${conflicts[@]}"; do
              case "$file" in
                vitest.config.ts|scripts/capture-ssr-head-snapshots-with-server.mjs|scripts/ssr-head-snapshot-paths.mjs|src/test/helpers/reactRouterCompat.vitest.tsx|src/test/router-harness-memory-router.test.tsx|src/test/ssr-head-snapshot-paths.test.ts|src/test/vitest-config-react-plugin-contract.test.ts|src/lib/react-router-compat.tsx|.github/workflows/edge-shared-sync.yml)
                  git checkout --theirs -- "$file"
                  ;;
                supabase/functions/_shared/lib/*|supabase/functions/*/*.ts)
                  git checkout --ours -- "$file"
                  ;;
                *)
                  if grep -Fxq "$file" /tmp/child-owned.txt; then
                    git checkout --ours -- "$file"
                  else
                    git checkout --theirs -- "$file"
                  fi
                  ;;
              esac
              git add "$file"
            done
          fi
          test -z "$(git diff --name-only --diff-filter=U)"
          git checkout "$parent_final" -- .github/workflows/edge-shared-sync.yml \
            src/lib/react-router-compat.tsx vitest.config.ts \
            scripts/capture-ssr-head-snapshots-with-server.mjs \
            scripts/ssr-head-snapshot-paths.mjs \
            src/test/helpers/reactRouterCompat.vitest.tsx \
            src/test/router-harness-memory-router.test.tsx \
            src/test/ssr-head-snapshot-paths.test.ts \
            src/test/vitest-config-react-plugin-contract.test.ts
          normalize_mcp_edge_imports
          node scripts/sync-edge-shared.mjs
          git add .github/workflows/edge-shared-sync.yml src/lib/react-router-compat.tsx \
            src/lib/sensorTruthCanon.ts \
            src/lib/sensor/sensorSnapshotFreshnessRules.ts \
            vitest.config.ts scripts/capture-ssr-head-snapshots-with-server.mjs \
            scripts/ssr-head-snapshot-paths.mjs src/test/helpers/reactRouterCompat.vitest.tsx \
            src/test/router-harness-memory-router.test.tsx \
            src/test/ssr-head-snapshot-paths.test.ts \
            src/test/vitest-config-react-plugin-contract.test.ts \
            supabase/functions/_shared/lib supabase/functions/*/*.ts
          git diff --cached --check
          git commit -m "chore(stack): sync #691 into #692"
          child_final="$(git rev-parse HEAD)"

          bun run typecheck:tsgo
          bunx vitest run \
            src/test/router-harness-memory-router.test.tsx \
            src/test/ssr-head-snapshot-paths.test.ts \
            src/test/vitest-config-react-plugin-contract.test.ts \
            src/test/sensor-truth-canon.test.ts \
            src/test/sensor-truth-ranges-and-membership.test.ts \
            src/test/sensor-source-rules.test.ts \
            --reporter=dot
          bun run build
          capture_generated_mcp_bundle
          child_final="$(git rev-parse HEAD)"
          git reset --hard "$child_final"
          clean_ephemeral_build_outputs
          test -z "$(git status --porcelain)"

          # No branch moves unless both complete validation stories passed.
          git push --atomic \
            --force-with-lease="refs/heads/${PARENT_BRANCH}:${EXPECTED_PARENT_TEMP}" \
            --force-with-lease="refs/heads/${CHILD_BRANCH}:${EXPECTED_CHILD}" \
            origin \
            "${parent_final}:refs/heads/${PARENT_BRANCH}" \
            "${child_final}:refs/heads/${CHILD_BRANCH}"

          {
            echo "parent_final=$parent_final"
            echo "child_final=$child_final"
            echo "parent_tree=$(git rev-parse "${parent_final}^{tree}")"
            echo "child_tree=$(git rev-parse "${child_final}^{tree}")"
          } | tee stack-sync-result.txt
      - name: Upload stack sync authority
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stack-691-692-sync-result
          path: stack-sync-result.txt
          if-no-files-found: ignore
